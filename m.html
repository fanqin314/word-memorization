<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1512">
<title>随身刷词 · 手机版</title>
<style>
/* ============================================================
   随身刷词 · 手机版
   视觉语言取自「课程表」：纸色 + 墨线 + 硬投影 + 有机色块
   ============================================================ */
*,*::before,*::after{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --ink:#1A1512;
  --ink-2:#3B322A;
  --paper:#EDE3D1;
  --paper-2:#F8F3E9;
  --card:#FFFDF8;

  --clay:#B8704B;
  --moss:#6F8B74;
  --amber:#BB9A5A;
  --indigo:#66799E;
  --plum:#8F7898;
  --teal:#6E968F;
  --rose:#BC7E8A;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --bounce:cubic-bezier(.175,.885,.32,1.275);
  --ease:cubic-bezier(.4,0,.2,1);

  --display:'Arial Black','Cooper Black',Impact,'PingFang SC','Microsoft YaHei',sans-serif;
  --sans:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Courier New',monospace;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* ---------------- 背景色块 ---------------- */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.32;}
.blob.b1{width:320px;height:320px;background:#DCC3AE;top:-120px;left:-130px;animation:drift1 22s ease-in-out infinite;}
.blob.b2{width:300px;height:300px;background:#C5D9C2;bottom:-110px;right:-120px;animation:drift2 27s ease-in-out infinite;}
.blob.b3{width:240px;height:240px;background:#E2D4B8;top:44%;left:58%;animation:drift3 31s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(46px,34px) scale(1.18);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,-30px) scale(1.12);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(.88);}}

/* ---------------- APP 容器 ---------------- */
.app{
  position:relative;z-index:1;
  max-width:480px;width:100%;
  height:100vh;height:100dvh;
  background:var(--paper-2);
  border-left:4px solid var(--ink);
  border-right:4px solid var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;
}
@media (min-width:520px){
  body{padding:18px 0;}
  .app{
    height:min(920px,calc(100dvh - 36px));
    border:4px solid var(--ink);
    border-radius:40px;
    box-shadow:12px 12px 0 rgba(26,21,18,.85),0 34px 70px -28px rgba(26,21,18,.55);
  }
}

/* ---------------- 顶部 Hero ---------------- */
.hero{
  position:relative;flex-shrink:0;
  padding:.85rem 1rem .9rem;
  background:var(--ink);
  border-radius:0 0 30px 30px;
  overflow:hidden;z-index:2;
}
.hero::before{
  content:'';position:absolute;width:300px;height:300px;
  top:-170px;right:-110px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(187,154,90,.55),transparent 68%);
  animation:glowFloat 15s ease-in-out infinite;
}
.hero::after{
  content:'';position:absolute;width:240px;height:240px;
  bottom:-180px;left:-90px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(110,150,143,.42),transparent 68%);
  animation:glowFloat 19s ease-in-out infinite reverse;
}
@keyframes glowFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-26px,20px) scale(1.14);}}

.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:.7rem;}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0;}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:12px;
  background:var(--amber);color:var(--ink);
  border:2.5px solid #fff;
  box-shadow:2px 2px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(26,21,18,.18);
  display:grid;place-items:center;
  font-family:var(--display);font-size:1.15rem;line-height:1;
}
.brand-txt h1{
  color:#fff;font-size:1.02rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;
  white-space:nowrap;
}
.brand-txt p{
  margin-top:.18rem;color:rgba(255,255,255,.58);
  font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;
}
.streak{
  appearance:none;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;gap:.32rem;
  padding:.34rem .62rem .36rem;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.5);
  border-radius:999px;color:#fff;
  font-family:var(--mono);font-size:.7rem;font-weight:900;
  transition:transform .18s var(--spring),background .2s;
}
.streak:active{transform:scale(.93);}
.streak svg{width:15px;height:15px;color:var(--amber);}
.streak b{font-size:.95rem;}

.goal{position:relative;z-index:1;margin-top:.8rem;}
.goal-row{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin-bottom:.42rem;}
.goal-k{color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:900;letter-spacing:.02em;}
.goal-k b{font-family:var(--display);font-size:1.45rem;letter-spacing:-.02em;margin-right:.1rem;}
.goal-k i{font-style:normal;color:rgba(255,255,255,.45);font-size:.78rem;}
.goal-tip{color:rgba(255,255,255,.62);font-size:.66rem;font-weight:700;text-align:right;}
.goal-track{
  height:11px;border-radius:999px;background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.28);overflow:hidden;
}
.goal-fill{
  display:block;height:100%;width:0;
  background:repeating-linear-gradient(115deg,var(--amber) 0 12px,#D3B275 12px 22px);
  border-radius:999px;
  transition:width .5s var(--spring);
}

/* ---------------- 近七天 ---------------- */
.strip{
  position:relative;z-index:2;flex-shrink:0;
  display:flex;padding:2px;
  margin:-.7rem .8rem 0;
  background:var(--card);
  border:2.5px solid var(--ink);
  border-radius:0 0 16px 16px;
  box-shadow:3px 3px 0 rgba(26,21,18,.85);
  overflow:hidden;
}
.day-cell{
  flex:1;min-width:0;padding:.34rem 0 .32rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.1rem;color:var(--ink-2);opacity:.55;
  border-left:1.5px solid rgba(26,21,18,.12);
}
.day-cell:first-child{border-left:none;}
.day-cell.is-today{opacity:1;background:var(--amber);border-radius:0 0 12px 12px;
  box-shadow:inset 0 2px 0 rgba(26,21,18,.18);}
.day-cell.has{opacity:.9;}
.day-cell .dc-day{font-size:.6rem;font-weight:900;line-height:1;}
.day-cell .dc-num{font-family:var(--mono);font-size:.56rem;font-weight:900;line-height:1;opacity:.7;}
.day-cell.is-today .dc-num{opacity:1;}
/* ---------------- 主区与视图 ---------------- */
.main{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:.55rem .8rem 1rem;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
.main::-webkit-scrollbar{width:5px;}
.main::-webkit-scrollbar-thumb{background:rgba(26,21,18,.28);border-radius:999px;}
.view{display:none;}
.view.active{display:block;}
.view.deck.active{display:flex;flex-direction:column;min-height:100%;}

/* ---------------- 刷词卡 ---------------- */
.deck-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.deck-meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:.1rem .2rem .45rem;
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.08em;
  color:rgba(26,21,18,.45);flex:none;
}
.deck-meta b{color:var(--ink);}
.deck-stage{position:relative;flex:1;min-height:0;display:flex;}
.stack{position:relative;flex:1;min-height:0;display:flex;}

/* 后面两张卡的“厚度” */
.stack::before,.stack::after{
  content:'';position:absolute;background:var(--card);
  border:3px solid var(--ink);border-radius:24px 24px 24px 10px;
  transition:transform .3s var(--ease);
}
.stack::before{inset:12px -4px -12px 12px;background:#F2EBDD;box-shadow:4px 4px 0 rgba(26,21,18,.55);}
.stack::after{inset:6px -1px -6px 6px;box-shadow:3px 3px 0 rgba(26,21,18,.7);}

.swipe-card{
  position:relative;z-index:3;flex:1;min-height:0;
  display:flex;flex-direction:column;
  background:var(--card);
  border:3px solid var(--ink);
  border-radius:24px 24px 24px 10px;
  box-shadow:5px 5px 0 rgba(26,21,18,.85);
  padding:.62rem .72rem .68rem;
  touch-action:pan-y;
  will-change:transform;
}
.swipe-card.out-up{transition:transform .38s var(--ease),opacity .38s var(--ease);transform:translateY(-120%) rotate(-4deg);opacity:0;}
.swipe-card.out-side{transition:transform .34s var(--ease),opacity .34s var(--ease);transform:translateX(-118%) rotate(-5deg);opacity:0;}
.swipe-card.in{animation:cardIn .46s var(--bounce) backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}

.card-head{display:flex;align-items:center;gap:.34rem;flex:none;margin-bottom:.34rem;}
.root-tag{
  display:inline-flex;align-items:center;gap:.24rem;
  font-family:var(--mono);font-size:.57rem;font-weight:900;letter-spacing:.03em;
  padding:.16rem .5rem .18rem;border-radius:999px;
  border:1.8px solid currentColor;background:#fff;color:var(--rc,var(--clay));
}
.root-tag .dot{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none;}
.mst-tag{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:.55rem;font-weight:900;letter-spacing:.05em;
  padding:.16rem .46rem .18rem;border-radius:999px;
  border:1.8px dashed currentColor;color:var(--ink-2);opacity:.75;
}
.mini-card{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:.18rem;
  font-family:var(--mono);font-size:.57rem;font-weight:900;
  color:var(--ink);background:#fff;border:1.8px solid var(--ink);
  border-radius:999px;padding:.16rem .5rem .18rem;text-decoration:none;
  transition:transform .16s var(--spring),background .16s;
}
.mini-card:active{transform:scale(.92);background:var(--paper);}

.card-main{display:flex;flex-direction:column;flex:1;min-height:0;}
.word-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;flex:none;}
.word{
  font-family:var(--display);
  font-size:clamp(1.8rem,8.6vw,2.5rem);
  line-height:1.02;letter-spacing:-.032em;
  word-break:break-word;
}
.speak{
  appearance:none;cursor:pointer;flex:none;
  width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--ink);background:#fff;color:var(--ink);
  box-shadow:2px 2px 0 rgba(26,21,18,.85);
  display:grid;place-items:center;
  transition:transform .16s var(--spring),box-shadow .16s var(--spring),background .2s;
}
.speak svg{width:19px;height:19px;}
.speak:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(26,21,18,.85);}
.speak.speaking{background:var(--amber);animation:speakPulse .7s ease-in-out infinite;}
@keyframes speakPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

.ipa{font-family:var(--mono);font-size:.82rem;font-weight:900;color:var(--ink-2);margin-top:.18rem;letter-spacing:.01em;}
.pos{font-family:var(--mono);font-size:.6rem;font-weight:900;color:var(--ink-2);opacity:.72;margin-top:.06rem;}
.gloss{font-size:.92rem;font-weight:900;line-height:1.35;margin-top:.16rem;color:var(--ink);}

.art-frame{
  position:relative;flex:none;
  margin-top:.42rem;height:clamp(92px,18vh,148px);
  border:2.5px solid var(--ink);border-radius:16px 16px 16px 8px;
  overflow:hidden;background:var(--ink);
}
.art-frame .di-art{
  width:100%;height:100%;
  display:grid;place-items:center;
}
.art-frame .di-art svg{display:block;width:100%;height:100%;}
.art-frame .art-tag{
  position:absolute;left:8px;bottom:8px;z-index:2;
  font-family:var(--mono);font-size:.53rem;font-weight:900;letter-spacing:.06em;
  padding:.1rem .4rem .12rem;border-radius:999px;
  background:rgba(26,21,18,.72);color:#fff;
}

.scene{
  margin-top:.4rem;font-size:.73rem;font-weight:700;line-height:1.45;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.morph{
  margin-top:.24rem;padding-top:.24rem;
  border-top:1.5px dashed rgba(26,21,18,.2);
  font-size:.66rem;line-height:1.42;color:rgba(26,21,18,.62);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.morph b{font-family:var(--mono);font-size:.54rem;letter-spacing:.1em;color:rgba(26,21,18,.4);margin-right:.2rem;}

.actions{
  display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:.36rem;
  flex:none;margin-top:.5rem;
}
.rate{
  appearance:none;cursor:pointer;
  font-family:var(--sans);font-size:.76rem;font-weight:900;letter-spacing:.01em;
  padding:.6rem .2rem .62rem;border-radius:14px;
  border:2.5px solid var(--ink);
  background:#fff;color:var(--ink);
  box-shadow:3px 3px 0 rgba(26,21,18,.85);
  transition:transform .16s var(--spring),box-shadow .16s var(--spring),background .16s;
  position:relative;overflow:hidden;
}
.rate::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--rc);border-bottom:2px solid var(--ink);}
.rate:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(26,21,18,.85);}
.rate.r0{--rc:var(--rose);}
.rate.r1{--rc:var(--amber);}
.rate.r2{--rc:var(--amber);background:var(--ink);color:#fff;}

.deck-hint{
  flex:none;text-align:center;padding:.5rem 0 .1rem;
  font-family:var(--mono);font-size:.56rem;font-weight:900;letter-spacing:.12em;
  color:rgba(26,21,18,.38);
}
.deck-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  text-align:center;color:var(--ink-2);padding:1.2rem;
}
.deck-empty .big{font-family:var(--display);font-size:1.6rem;letter-spacing:-.02em;}
.deck-empty small{font-size:.72rem;line-height:1.5;opacity:.75;max-width:15rem;}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
</div>

<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">词</span>
        <div class="brand-txt">
          <h1>随身刷词</h1>
          <p id="todayLabel">今天</p>
        </div>
      </div>
      <button class="streak" id="streakBtn" type="button" title="连续学习天数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 3.8 3 6.2 3 6.2S17 8.5 17 13a5 5 0 0 1-10 0c0-3.3 3-4.4 3-4.4S9.2 6.2 9 6.2 9.2 5 12 3Z"/></svg>
        <b id="streakNum">0</b><span>天</span>
      </button>
    </div>
    <div class="goal">
      <div class="goal-row">
        <span class="goal-k">今日 <b id="todayNum">0</b><i>/10</i></span>
        <span class="goal-tip" id="goalTip">刷一张就热身</span>
      </div>
      <div class="goal-track"><i class="goal-fill" id="goalFill"></i></div>
    </div>
  </header>

  <div class="strip" id="weekStrip" aria-hidden="true"></div>

  <main class="main">
    <section class="view deck active" id="view-deck" aria-label="刷词"></section>
    <section class="view" id="view-lib" aria-label="词库"></section>
    <section class="view" id="view-quiz" aria-label="自测"></section>
    <section class="view" id="view-stat" aria-label="数据"></section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <button class="tab active" type="button" data-tab="deck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M18 8.5l3 1.6v9.4l-3-1.6"/></svg>
      <span>刷词</span>
    </button>
    <button class="tab" type="button" data-tab="lib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21.5V5.5Z"/></svg>
      <span>词库</span>
    </button>
    <button class="tab" type="button" data-tab="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5l4.5 4.5-8 8H7v-4.5z"/><path d="M4 20h16"/></svg>
      <span>自测</span>
    </button>
    <button class="tab" type="button" data-tab="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19h-20"/></svg>
      <span>数据</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="words-data.js"></script>
<script>
/*__JS__*/
</script>
</body>
</html>
