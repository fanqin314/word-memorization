<!DOCTYPE html><html><head><meta charset="utf-8"><title>drive</title>
<style>html,body{margin:0;background:#EDE3D1}iframe{display:block;border:0;width:390px;height:844px}</style>
</head><body>
<iframe id="f" src="/mobile/"></iframe>
<script>
const f = document.getElementById('f');
f.onload = () => {
  const w = f.contentWindow;
  const d = w.document;
  w.switchTab('quiz');
  for(let i = 0; i < 10; i++){
    const item = w.eval('quiz.list[quiz.idx]');
    const input = d.querySelector('#qInput');
    if(!input) break;
    input.value = item.a;
    d.querySelector('#qSubmit').click();
    d.querySelector('#qSubmit').click();
  }
};
</script>
</body></html>
