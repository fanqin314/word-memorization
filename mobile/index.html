<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随身刷词">
<title>随身刷词 · 手机版</title>
<style>
/* ============================================================
   随身刷词 · 手机版
   视觉语言取自「课程表」：纸色 + 墨线 + 硬投影 + 有机色块
   ============================================================ */
*,*::before,*::after{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --ink:#1A1512;
  --ink-2:#3B322A;
  --paper:#EDE3D1;
  --paper-2:#F8F3E9;
  --card:#FFFDF8;

  --clay:#B8704B;
  --moss:#6F8B74;
  --amber:#BB9A5A;
  --indigo:#66799E;
  --plum:#8F7898;
  --teal:#6E968F;
  --rose:#BC7E8A;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --bounce:cubic-bezier(.175,.885,.32,1.275);
  --ease:cubic-bezier(.4,0,.2,1);

  --display:'Arial Black','Cooper Black',Impact,'PingFang SC','Microsoft YaHei',sans-serif;
  --sans:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Courier New',monospace;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* ---------------- 背景色块 ---------------- */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.32;}
.blob.b1{width:320px;height:320px;background:#DCC3AE;top:-120px;left:-130px;animation:drift1 22s ease-in-out infinite;}
.blob.b2{width:300px;height:300px;background:#C5D9C2;bottom:-110px;right:-120px;animation:drift2 27s ease-in-out infinite;}
.blob.b3{width:240px;height:240px;background:#E2D4B8;top:44%;left:58%;animation:drift3 31s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(46px,34px) scale(1.18);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,-30px) scale(1.12);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(.88);}}

/* ---------------- APP 容器 ---------------- */
.app{
  position:relative;z-index:1;
  max-width:480px;width:100%;
  height:100vh;height:100dvh;
  background:var(--paper-2);
  border-left:4px solid var(--ink);
  border-right:4px solid var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;
}
@media (min-width:520px){
  body{padding:18px 0;}
  .app{
    height:min(920px,calc(100dvh - 36px));
    border:4px solid var(--ink);
    border-radius:40px;
    box-shadow:12px 12px 0 rgba(26,21,18,.85),0 34px 70px -28px rgba(26,21,18,.55);
  }
}

/* ---------------- 顶部 Hero ---------------- */
.hero{
  position:relative;flex-shrink:0;
  padding:.85rem 1rem .9rem;
  background:var(--ink);
  border-radius:0 0 30px 30px;
  overflow:hidden;z-index:2;
}
.hero::before{
  content:'';position:absolute;width:300px;height:300px;
  top:-170px;right:-110px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(187,154,90,.55),transparent 68%);
  animation:glowFloat 15s ease-in-out infinite;
}
.hero::after{
  content:'';position:absolute;width:240px;height:240px;
  bottom:-180px;left:-90px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(110,150,143,.42),transparent 68%);
  animation:glowFloat 19s ease-in-out infinite reverse;
}
@keyframes glowFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-26px,20px) scale(1.14);}}

.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:.7rem;}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0;}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:12px;
  background:var(--amber);color:var(--ink);
  border:2.5px solid #fff;
  box-shadow:2px 2px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(26,21,18,.18);
  display:grid;place-items:center;
  font-family:var(--display);font-size:1.15rem;line-height:1;
}
.brand-txt h1{
  color:#fff;font-size:1.02rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;
  white-space:nowrap;
}
.brand-txt p{
  margin-top:.18rem;color:rgba(255,255,255,.58);
  font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;
}
.streak{
  appearance:none;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;gap:.32rem;
  padding:.34rem .62rem .36rem;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.5);
  border-radius:999px;color:#fff;
  font-family:var(--mono);font-size:.7rem;font-weight:900;
  transition:transform .18s var(--spring),background .2s;
}
.streak:active{transform:scale(.93);}
.streak svg{width:15px;height:15px;color:var(--amber);}
.streak b{font-size:.95rem;}

.goal{position:relative;z-index:1;margin-top:.8rem;}
.goal-row{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin-bottom:.42rem;}
.goal-k{color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:900;letter-spacing:.02em;}
.goal-k b{font-family:var(--display);font-size:1.45rem;letter-spacing:-.02em;margin-right:.1rem;}
.goal-k i{font-style:normal;color:rgba(255,255,255,.45);font-size:.78rem;}
.goal-tip{color:rgba(255,255,255,.62);font-size:.66rem;font-weight:700;text-align:right;}
.goal-track{
  height:11px;border-radius:999px;background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.28);overflow:hidden;
}
.goal-fill{
  display:block;height:100%;width:0;
  background:repeating-linear-gradient(115deg,var(--amber) 0 12px,#D3B275 12px 22px);
  border-radius:999px;
  transition:width .5s var(--spring);
}

/* ---------------- 近七天 ---------------- */
.strip{
  position:relative;z-index:2;flex-shrink:0;
  display:flex;padding:2px;
  margin:-.7rem .8rem 0;
  background:var(--card);
  border:2.5px solid var(--ink);
  border-radius:0 0 16px 16px;
  box-shadow:3px 3px 0 rgba(26,21,18,.85);
  overflow:hidden;
}
.day-cell{
  flex:1;min-width:0;padding:.34rem 0 .32rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.1rem;color:var(--ink-2);opacity:.55;
  border-left:1.5px solid rgba(26,21,18,.12);
}
.day-cell:first-child{border-left:none;}
.day-cell.is-today{opacity:1;background:var(--amber);border-radius:0 0 12px 12px;
  box-shadow:inset 0 2px 0 rgba(26,21,18,.18);}
.day-cell.has{opacity:.9;}
.day-cell .dc-day{font-size:.6rem;font-weight:900;line-height:1;}
.day-cell .dc-num{font-family:var(--mono);font-size:.56rem;font-weight:900;line-height:1;opacity:.7;}
.day-cell.is-today .dc-num{opacity:1;}
/* ---------------- 主区与视图 ---------------- */
.main{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:.55rem .8rem 1rem;
  position:relative;
  -webkit-overflow-scrolling:touch;
  /* 隐藏可见滚动条，但用 gutter 保留它原本占的宽度，避免隐藏后内容变宽导致重排 */
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.main::-webkit-scrollbar{width:5px;}
.main::-webkit-scrollbar-thumb{background:transparent;}
.main::-webkit-scrollbar-track{background:transparent;}
.view{display:none;}
.view.active{display:block;}
.view.deck.active{display:flex;flex-direction:column;min-height:100%;}

/* ---------------- 刷词卡 ---------------- */
.deck-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.deck-meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:.1rem .2rem .45rem;
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.08em;
  color:rgba(26,21,18,.45);flex:none;
}
.deck-meta b{color:var(--ink);}
.deck-stage{position:relative;flex:1;min-height:0;display:flex;}
.stack{position:relative;flex:1;min-height:0;display:flex;}

/* 后面两张卡的“厚度” */
.stack::before,.stack::after{
  content:'';position:absolute;background:var(--card);
  border:3px solid var(--ink);border-radius:24px 24px 24px 10px;
  transition:transform .3s var(--ease);
}
.stack::before{inset:12px -4px -12px 12px;background:#F2EBDD;box-shadow:4px 4px 0 rgba(26,21,18,.55);}
.stack::after{inset:6px -1px -6px 6px;box-shadow:3px 3px 0 rgba(26,21,18,.7);}

.swipe-card{
  position:relative;z-index:3;flex:1;min-height:0;
  display:flex;flex-direction:column;
  background:transparent;
  padding:0;
  touch-action:none;
  will-change:transform;
}
.swipe-card.out-up{transition:transform .38s var(--ease),opacity .38s var(--ease);transform:translateY(-120%) rotate(-4deg);opacity:0;}
.swipe-card.out-down{transition:transform .38s var(--ease),opacity .38s var(--ease);transform:translateY(120%) rotate(4deg);opacity:0;}
.swipe-card.out-left{transition:transform .34s var(--ease),opacity .34s var(--ease);transform:translateX(-122%) rotate(-6deg);opacity:0;}
.swipe-card.out-right{transition:transform .34s var(--ease),opacity .34s var(--ease);transform:translateX(122%) rotate(6deg);opacity:0;}
.swipe-card.in{animation:cardIn .46s var(--bounce) backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}

/* 双面卡：正面 ↔ 背面 3D 翻转（拖动手势作用在外层 .swipe-card，翻面只转内层） */
.swipe-card{perspective:1100px;}
.flip-inner{
  position:relative;display:flex;flex-direction:column;
  flex:1;min-height:0;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,.05,.2,1);
}
.swipe-card.flipped .flip-inner{transform:rotateY(180deg);}
.swipe-card.flipped{touch-action:pan-y;}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:.62rem .72rem .68rem;
  background:var(--card);
  border:3px solid var(--ink);
  border-radius:24px 24px 24px 10px;
  box-shadow:5px 5px 0 rgba(26,21,18,.85);
  overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg);}

/* 拖动时中央的方向提示 */
.dir-hint{
  position:absolute;left:50%;top:50%;z-index:5;pointer-events:none;
  transform:translate(-50%,-50%) scale(.9);
  opacity:0;transition:opacity .12s,transform .12s;
  font-family:var(--mono);font-size:.72rem;font-weight:900;letter-spacing:.05em;
  padding:.42rem .82rem;border-radius:999px;border:2.5px solid var(--ink);
  background:var(--paper);color:var(--ink);white-space:nowrap;
  box-shadow:3px 3px 0 rgba(26,21,18,.8);
}
.dir-hint.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.dir-hint[data-dir="right"]{background:#DCEBDD;}
.dir-hint[data-dir="left"]{background:#F4DADA;}
.dir-hint[data-dir="up"]{background:#E7E1D6;}
.dir-hint[data-dir="down"]{background:#F6E7C5;}

/* 背面：沿用该词卡自己的纸色/墨色/强调色/hero 渐变/顶部条纹，正面保持统一 */
.face.back{
  transform:rotateY(180deg);
  background:var(--mp,var(--card));
  border-color:var(--mi,var(--ink));
  box-shadow:5px 5px 0 var(--mi,rgba(26,21,18,.85));
  padding:0;
}
.back-band{
  flex:none;height:14px;
  background:var(--mb,var(--ma));
  border-bottom:2.5px solid var(--mi,var(--ink));
}
.back-inner{flex:1;min-height:0;display:flex;flex-direction:column;padding:.46rem .62rem .58rem;}
.back-head{
  display:flex;align-items:center;justify-content:space-between;gap:.4rem;flex:none;
  margin-bottom:.44rem;padding:.34rem .44rem .3rem;
  background:var(--mh,transparent);
  border:2px solid var(--mi,var(--ink));
  border-radius:10px;
  box-shadow:2px 2px 0 var(--mi,rgba(26,21,18,.7));
}
.back-word{font-family:var(--display);font-size:1.12rem;letter-spacing:-.02em;line-height:1.1;color:var(--mi,var(--ink));}
.back-ipa{font-family:var(--mono);font-size:.6rem;font-weight:800;color:var(--ink-2);margin-left:.28rem;}
.back-flip{
  appearance:none;cursor:pointer;flex:none;
  font-family:var(--mono);font-size:.57rem;font-weight:900;
  padding:.18rem .5rem .2rem;border-radius:999px;
  border:1.8px solid var(--mi,var(--ink));background:#fff;color:var(--mi,var(--ink));
  box-shadow:2px 2px 0 var(--ma,rgba(26,21,18,.7));
  transition:transform .16s var(--spring);
}
.back-flip:active{transform:translate(2px,2px);box-shadow:none;}
.back-body{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:.12rem;
  /* 与 .main 一致：隐藏可见条但保留占位，避免出现/隐藏时内容宽度跳变 */
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.back-body::-webkit-scrollbar{width:5px;}
.back-body::-webkit-scrollbar-thumb{background:transparent;}
.back-body::-webkit-scrollbar-track{background:transparent;}
.back-gloss{font-size:1rem;font-weight:900;line-height:1.35;margin:.06rem 0 .52rem;color:var(--mi,var(--ink));}
.back-block{
  margin-bottom:.46rem;padding:.48rem .6rem;
  background:#fff;
  border:2px solid var(--mi,var(--ink));
  border-left:5px solid var(--ma,var(--mi,var(--ink)));
  border-radius:4px 12px 12px 4px;
  box-shadow:2px 2px 0 var(--mi,rgba(26,21,18,.6));
}
.back-block h4{font-family:var(--mono);font-size:.55rem;font-weight:900;letter-spacing:.12em;color:rgba(26,21,18,.45);margin:0 0 .18rem;}
.back-block p{margin:0;font-size:.72rem;line-height:1.55;color:var(--ink-2);}
.back-block .back-ex{font-family:Georgia,serif;font-size:.78rem;color:var(--ink);}
.bz-ans{background:var(--amber);color:var(--ink);padding:0 .16rem;border-radius:4px;font-weight:800;}

/* 背面构词：复刻词卡页 .root-line 的「词素胶囊 + 括号释义 + → 释义」排版 */
.back-root{
  margin:.1rem 0 0;padding:.46rem .5rem;
  background:#FFFCF5;
  border:2px dashed var(--mi,var(--ink));
  border-radius:10px;
  text-align:center;
  font-size:.7rem;line-height:2.05;color:var(--ink-2);
  overflow-wrap:anywhere;
}
.back-root .stem,.back-root .affix{
  display:inline-block;margin:0 .1rem;padding:.02rem .32rem;
  border:2px solid var(--mi,var(--ink));border-radius:999px;
  font-family:var(--mono);font-size:.66rem;font-weight:900;line-height:1.5;
}
.back-root .stem{
  /* 强调色可能是深色甚至等于墨色，用浅色混合底保证任何卡上都能看清字 */
  background:#F3E9D2;
  background:color-mix(in srgb, var(--ma,#F0C97E) 30%, #FFFCF5);
  border-color:var(--ma,var(--mi,var(--ink)));
  color:var(--mi,var(--ink));
  transform:rotate(-1.5deg);
}
.back-root .affix{background:var(--mi,var(--ink));border-color:var(--mi,var(--ink));color:#FFFCF5;transform:rotate(1.5deg);}
.back-root em{font-style:normal;font-weight:900;color:var(--ma,var(--ink));margin:0 .12rem;}
.back-root .sep{font-weight:900;color:var(--ma,var(--ink));margin:0 .22rem;}
.back-root b{font-weight:900;color:var(--mi,var(--ink));}
.back-root.plain{border-style:solid;}

/* 背面拼写：一个字母一个格子 + 下方可拖动的字母块 */
.fill-block{margin-top:.1rem;}
.fill-q{font-size:.68rem;line-height:1.5;color:var(--ink-2);margin:0 0 .34rem;}
.spell-slots,.spell-tiles{
  display:flex;flex-wrap:wrap;gap:.22rem;
  justify-content:center;
}
.spell-slot{
  width:1.36rem;height:1.58rem;flex:none;
  display:grid;place-items:center;padding:0;
  border:2px dashed var(--mi,var(--ink));
  border-radius:7px;
  background:#FFFCF5;
  transition:border-color .15s,background .15s,transform .12s var(--spring);
}
.spell-slot.hot{
  border-style:solid;
  background:#F3E9D2;
  background:color-mix(in srgb, var(--ma,#E8C17B) 26%, #FFFCF5);
  transform:translateY(-2px);
}
.spell-slot.filled{border-style:solid;background:transparent;}
.spell-tiles{
  margin-top:.36rem;padding-top:.36rem;
  border-top:1.5px dashed rgba(26,21,18,.2);
}
.spell-tile{
  appearance:none;cursor:grab;
  width:1.36rem;height:1.58rem;flex:none;
  display:grid;place-items:center;padding:0;
  border:2px solid var(--mi,var(--ink));
  border-radius:7px;
  /* 强调色可能是墨色本身，浅混合底 + 墨字保证任何卡上都能看清 */
  background:#F3E9D2;
  background:color-mix(in srgb, var(--ma,#E8C17B) 30%, #FFFCF5);
  color:var(--mi,var(--ink));
  font-family:var(--mono);font-size:.76rem;font-weight:900;line-height:1;
  box-shadow:2px 2px 0 var(--mi,rgba(26,21,18,.7));
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  transition:transform .12s var(--spring),box-shadow .12s;
}
.spell-slot.filled .spell-tile{width:100%;height:100%;}
.spell-tile:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--mi,rgba(26,21,18,.7));}
.spell-tile.dragging{opacity:.32;}
.spell-ghost{position:fixed;pointer-events:none;z-index:9999;margin:0;}
.fill-msg{font-size:.62rem;font-weight:800;line-height:1.4;margin:.26rem 0 0;min-height:1em;color:var(--ink-2);}
.fill-block.ok .fill-msg{color:#2F6B45;}
.fill-block.ok .spell-slot{border-color:#2F6B45;}
.fill-block.bad .fill-msg{color:#B04A3A;}
.fill-block.bad .spell-slot{border-color:#B04A3A;}
.fill-block.bad{animation:fillShake .3s;}
@keyframes fillShake{20%{transform:translateX(-4px)}55%{transform:translateX(4px)}85%{transform:translateX(-2px)}}
.back-link{margin-top:.1rem;align-self:flex-start;}

.card-head{display:flex;align-items:center;gap:.34rem;flex:none;margin-bottom:.34rem;}
.root-tag{
  display:inline-flex;align-items:center;gap:.24rem;
  font-family:var(--mono);font-size:.57rem;font-weight:900;letter-spacing:.03em;
  padding:.16rem .5rem .18rem;border-radius:999px;
  border:1.8px solid currentColor;background:#fff;color:var(--rc,var(--clay));
}
.root-tag .dot{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none;}
.mst-tag{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:.55rem;font-weight:900;letter-spacing:.05em;
  padding:.16rem .46rem .18rem;border-radius:999px;
  border:1.8px dashed currentColor;color:var(--ink-2);opacity:.75;
}
.mini-card{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:.18rem;
  font-family:var(--mono);font-size:.57rem;font-weight:900;
  color:var(--ink);background:#fff;border:1.8px solid var(--ink);
  border-radius:999px;padding:.16rem .5rem .18rem;text-decoration:none;
  transition:transform .16s var(--spring),background .16s;
}
.mini-card:active{transform:scale(.92);background:var(--paper);}

.card-main{display:flex;flex-direction:column;flex:1;min-height:0;}
.word-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;flex:none;}
.word{
  font-family:var(--display);
  font-size:clamp(1.8rem,8.6vw,2.5rem);
  line-height:1.02;letter-spacing:-.032em;
  word-break:break-word;
}
.speak{
  appearance:none;cursor:pointer;flex:none;
  width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--ink);background:#fff;color:var(--ink);
  box-shadow:2px 2px 0 rgba(26,21,18,.85);
  display:grid;place-items:center;
  transition:transform .16s var(--spring),box-shadow .16s var(--spring),background .2s;
}
.speak svg{width:19px;height:19px;}
.speak:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(26,21,18,.85);}

  display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:.36rem;

}
.rate{
  appearance:none;cursor:pointer;
  font-family:var(--sans);font-size:.76rem;font-weight:900;letter-spacing:.01em;
  padding:.6rem .2rem .62rem;border-radius:14px;
  border:2.5px solid var(--ink);
  background:#fff;color:var(--ink);
  box-shadow:3px 3px 0 rgba(26,21,18,.85);
  transition:transform .16s var(--spring),box-shadow .16s var(--spring),background .16s;
  position:relative;overflow:hidden;
}
.rate::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--rc);border-bottom:2px solid var(--ink);}
.rate:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(26,21,18,.85);}
.rate.r0{--rc:var(--rose);}
.rate.r1{--rc:var(--amber);}
.rate.r2{--rc:var(--amber);background:var(--ink);color:#fff;}

.deck-empty{

}

/* ---------------- 词库 ---------------- */
.lib-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem;}

<script>
/* ============================================================
   数据层：全部读写与 index.html 相同的那几个 localStorage 键
   ============================================================ */
const D = window.WORDS_DATA || {};
const WORDS = (D.words || []).filter(w => w && w.word);
const ART = D.art || {};
const ARTCSS = D.artCss || {};
const MSTCSS = D.mst || {};

/* 背面用该词卡自己的配色：从卡片页 :root 收敛出的 --mst-* 里取纸色/墨色/强调色/hero 渐变/顶部条纹 */
const palCache = {};
function paletteOf(word){
  if(palCache[word]) return palCache[word];
  const css = MSTCSS[word] || '';
  const pick = k => {
    const m = css.match('--mst-' + k + ':\\s*([^;]+)');
    return m ? m[1].trim() : '';
  };
  const paper = pick('paper');
  const ink = pick('ink');
  const accent = pick('accent');
  const hero = pick('hero');
  const band = pick('band');
  const style = [
    paper ? '--mp:' + paper : '',
    ink ? '--mi:' + ink : '',
    accent ? '--ma:' + accent : '',
    hero ? '--mh:' + hero : '',
    band ? '--mb:' + band : ''
  ].filter(Boolean).join(';');
  return (palCache[word] = {paper, ink, accent, hero, band, style});
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 把词卡页 .root-line 的文本还原成「词素胶囊 + 括号释义 + → 释义」的排版 */
function rootAtomHtml(seg, allowBare){
  const raw = String(seg).trim();
  const m = raw.match(/^([^（(]*)[（(]([^）)]*)[）)]/);
  if(!m){
    /* 只有构成部分里不带括号的单个词素（如 reverse 的 -e）做成胶囊，释义段不加 */
    return (allowBare && /^\S+$/.test(raw)) ? '<span class="' + (/-/.test(raw) ? 'affix' : 'stem') + '">' + esc(raw) + '</span>' : null;
  }
  const toks = m[1].trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return null;
  const morpheme = toks.pop();          /* 括号前最后一个词是词素，前面的「古英语 / 拉丁语」等作普通文字 */
  const prefix = toks.join(' ');
  return (prefix ? esc(prefix) + ' ' : '') +
    '<span class="' + (/-/.test(morpheme) ? 'affix' : 'stem') + '">' + esc(morpheme) + '</span>（' + esc(m[2]) + '）';
}
function rootLineHtml(text){
  const raw = String(text || '').trim();
  if(!raw) return '';
  const parts = raw.split(/→/);
  const head = (parts[0] || '').trim();
  const rest = parts.slice(1).map(s => s.trim()).filter(Boolean);
  const atoms = head.split(/[+＋]/).map(s => rootAtomHtml(s, true));
  if(!atoms.length || atoms.some(a => !a)) return '<div class="back-root plain">' + esc(raw) + '</div>';
  let html = '<div class="back-root">' + atoms.join('<em>+</em>');
  if(rest.length){
    html += '<span class="sep">→</span>' +
      rest.map((s, i) => {
        const a = rootAtomHtml(s);
        if(a) return a;
        return i === rest.length - 1 ? '<b>' + esc(s) + '</b>' : esc(s);
      }).join('<span class="sep">→</span>');
  }
  return html + '</div>';
}

const STORE_KEY = 'vocab_workbench_v1';
const MB_KEY = 'wc_mobile_v1';
const QUIZ_KEY = 'wc_quiz_v1';
const MST_KEY = 'vocab_mst_v1';
const REVIEW_DAYS = ['d1','d3','d7','d15'];
const GOAL = 10;

const ROOT_META = {
  vers:  {label:'vers · vert', color:'var(--indigo)'},
  un:    {label:'un · uni',    color:'var(--teal)'},
  ann:   {label:'ann',         color:'var(--amber)'},
  contra:{label:'contra',      color:'var(--clay)'},
  cor:   {label:'cor',         color:'var(--plum)'},
  other: {label:'其他词源',     color:'var(--rose)'}
};
const MST_LABEL = ['未学','学习中','已掌握'];

let store = loadJSON(STORE_KEY, {});
let mb = loadJSON(MB_KEY, {days:{}, total:0});
let mstRule = Object.assign({learnOpens:2, masterOpens:5, decayDays:14}, loadJSON(MST_KEY, {}));

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? (JSON.parse(raw) || fallback) : fallback;
  }catch(e){ return fallback; }
}
function persist(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ toast('本机存储不可用，记录不会保存'); }
}
function rec(word){
  let r = store[word];
  if(!r) r = store[word] = {};
  if(r.fav === undefined) r.fav = false;
  if(r.mastery === undefined) r.mastery = 0;
  if(r.pin === undefined) r.pin = null;
  if(r.note === undefined) r.note = '';
  if(r.opens === undefined) r.opens = 0;
  if(r.lastOpened === undefined) r.lastOpened = 0;
  return r;
}
function daysSince(ts){ return ts ? (Date.now() - ts) / 86400000 : Infinity; }
function masteryOf(word){
  const r = rec(word);
  const auto = r.opens >= mstRule.masterOpens ? 2 : r.opens >= mstRule.learnOpens ? 1 : 0;
  const val = (r.pin === 1 || r.pin === 2) ? r.pin : auto;
  return (val === 2 && daysSince(r.lastOpened) > mstRule.decayDays) ? 1 : val;
}

/* 复习打卡只读，汇总来自卡片页写的 <单词>_review */
let reviewCache = null;
function reviewMap(){
  if(reviewCache) return reviewCache;
  const map = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.slice(-7) !== '_review') continue;
      const v = loadJSON(k, {});
      map[k.slice(0, -7)] = (v && typeof v === 'object') ? v : {};
    }
  }catch(e){}
  reviewCache = map;
  return map;
}
function reviewDone(word){
  const v = reviewMap()[word];
  return v ? REVIEW_DAYS.filter(k => v[k]).length : 0;
}
function isDue(word){
  const n = reviewDone(word);
  return n > 0 && n < REVIEW_DAYS.length && masteryOf(word) !== 2;
}

/* ------------------------------------------------------------
   日期与统计
   ------------------------------------------------------------ */
function keyOf(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey(){ return keyOf(new Date()); }
function todayCount(){ return mb.days[todayKey()] || 0; }
function streakDays(){
  const days = mb.days || {};
  const d = new Date();
  if(!days[keyOf(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while(days[keyOf(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bumpToday(n){
  const k = todayKey();
  mb.days = mb.days || {};
  mb.days[k] = (mb.days[k] || 0) + n;
  mb.total = (mb.total || 0) + n;
  persist(MB_KEY, mb);
}

/* ------------------------------------------------------------
   刷词队列：待复习优先，然后未学 → 学习中 → 已掌握
   ------------------------------------------------------------ */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildQueue(){
  const due = [], rest = [];
  WORDS.forEach(w => (isDue(w.word) ? due : rest).push(w));
  shuffle(due); shuffle(rest);
  rest.sort((a, b) => masteryOf(a.word) - masteryOf(b.word) || rec(a.word).opens - rec(b.word).opens);
  return due.concat(rest);
}

let speakVO = null;
function speakWord(word, btn){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  window.speechSynthesis.cancel();
  const u = speakVO = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  if(btn){
    btn.classList.add('speaking');
    const off = () => { if(speakVO === u){ btn.classList.remove('speaking'); } };
    u.onend = off;
    u.onerror = off;
  }
  window.speechSynthesis.speak(u);
}

/* 记录掌握度：写回 index.html 同一份 store */
function rateWord(word, level){
  const r = rec(word);
  r.opens = (r.opens || 0) + 1;
  r.lastOpened = Date.now();
  if(level === 2) r.pin = 2;
  else if(level === 1) r.pin = 1;
  else { r.pin = null; r.opens = 0; }
  r.mastery = masteryOf(word);
  persist(STORE_KEY, store);
  bumpToday(1);
}

function advance(level, dir){
  if(animating) return;
  const w = queue[pos];
  if(!w) return;
  animating = true;
  if(level === null) toast('已跳过');
  else {
    rateWord(w.word, level);
    toast(level === 2 ? '标记为已掌握' : level === 1 ? '标记为学习中' : '已回到未学，明天再来');
    refreshHeader();
    if(todayCount() === GOAL) setTimeout(() => toast('今日 10 个达成，收工！'), 700);
  }
  const card = document.querySelector('.swipe-card');
  if(card) card.classList.add('out-' + (dir || (level === null ? 'up' : 'right')));
  setTimeout(() => {
    pos += 1;
    animating = false;
    renderCard();
  }, level === null ? 400 : 360);
}

/* ============================================================
   自测：从 q 字段抽 10 题，判题规则与 index.html 完全一致
   ============================================================ */
let quizBuilt = false;
const quiz = {list:[], idx:0, right:0, wrong:0, answered:false};

function quizStat(){
  return Object.assign({rounds:0, total:0, right:0}, loadJSON(QUIZ_KEY, {}));
}
function quizNorm(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function quizPool(){
  const out = [];
  WORDS.forEach(w => {
    (w.q || []).forEach(item => {
      if(item && item.q && item.a) out.push({word:w.word, q:item.q, a:item.a, h:item.h || ''});
    });
  });
  return out;
}
function startQuiz(){
  quiz.list = shuffle(quizPool()).slice(0, 10);
  quiz.idx = 0; quiz.right = 0; quiz.wrong = 0; quiz.answered = false;
  renderQuizQuestion();
}

function renderQuiz(){
  const view = document.getElementById('view-quiz');
  if(!quizBuilt){
    quizBuilt = true;
    view.innerHTML = '<div class="quiz-wrap">' +
        '<div class="quiz-head"><span id="quizProg">首字母填空</span><span>✓ <b id="quizRight">0</b>　✗ <b id="quizWrong">0</b></span></div>' +
        '<div id="quizBody"></div></div>';
  }
  if(!quiz.list.length) startQuiz();
}

function renderQuizQuestion(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  if(quiz.idx >= quiz.list.length){ renderQuizResult(); return; }
  const item = quiz.list[quiz.idx];
  quiz.answered = false;
  const prog = document.getElementById('quizProg');
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(prog) prog.textContent = '第 ' + (quiz.idx + 1) + ' / ' + quiz.list.length + ' 题';
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">首字母填空 · ' + item.word + '</span>' +
      '<p class="q-sentence">' + item.q + '</p>' +
      '<input class="q-input" id="qInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="补全空格处的字母…" aria-label="补全空格">' +
      (item.h ? '<button class="q-btn ghost" type="button" data-hint style="margin-top:.5rem;font-size:.68rem;padding:.3rem .7rem;">看提示</button>' +
                '<p class="q-hint" id="qHint" hidden>' + item.h + '</p>' : '') +
      '<div class="q-foot"><span class="q-feed" id="qFeed"></span>' +
        '<button class="q-btn" type="button" id="qSubmit">检查</button></div>' +
    '</div>';
  const input = document.getElementById('qInput');
  if(input){
    input.focus();
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); quizCheck(); }
    });
  }
}

function quizCheck(){
  if(quiz.answered) return;
  const input = document.getElementById('qInput');
  const item = quiz.list[quiz.idx];
  if(!input || !item) return;
  const val = quizNorm(input.value);
  if(!val){ input.focus(); return; }
  quiz.answered = true;

  const first = (item.q.match(/class="first-letter">([^<]*)</) || ['', ''])[1];
  const ok = val === quizNorm(item.a)
          || val === quizNorm(item.word)
          || val === quizNorm(first + item.a);
  if(ok) quiz.right++; else quiz.wrong++;

  const blank = document.querySelector('#quizBody .qz-blank');
  if(blank){ blank.textContent = item.a; blank.classList.add('on'); }
  input.disabled = true;

  const hint = document.getElementById('qHint');
  if(hint) hint.hidden = false;

  const fb = document.getElementById('qFeed');
  if(fb){
    fb.className = 'q-feed ' + (ok ? 'right' : 'wrong');
    fb.textContent = ok ? '✓ 正确' : '✗ 正确答案：' + item.a;
  }
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;

  const btn = document.getElementById('qSubmit');
  btn.textContent = quiz.idx + 1 >= quiz.list.length ? '看结果' : '下一题';
  btn.classList.add('ghost');
  btn.focus();
}

function quizNext(){
  quiz.idx++;
  if(quiz.idx >= quiz.list.length) renderQuizResult();
  else renderQuizQuestion();
}

function renderQuizResult(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  const total = quiz.right + quiz.wrong;
  const rate = total ? Math.round(quiz.right / total * 100) : 0;
  const stat = quizStat();
  stat.rounds += 1; stat.total += total; stat.right += quiz.right;
  persist(QUIZ_KEY, stat);
  const hist = stat.total ? Math.round(stat.right / stat.total * 100) : 0;
  const prog = document.getElementById('quizProg');
  if(prog) prog.textContent = '本轮完成';
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">本轮完成</span>' +
      '<p class="q-result-num">' + quiz.right + ' / ' + total + '</p>' +
      '<p class="q-result-sub">正确率 ' + rate + '% · 累计 ' + stat.right + ' / ' + stat.total +
        '（' + hist + '%，共 ' + stat.rounds + ' 轮）</p>' +
      '<div class="q-actions"><button class="q-btn ghost" type="button" data-quiz-back>回刷词</button>' +
        '<button class="q-btn" type="button" data-quiz-again>再来一轮</button></div>' +
    '</div>';
}

    '<p class="stat-note">数据与电脑版工作站共用同一份本机记录</p>' +
    '<div class="link-row"><a class="big-link" href="../index.html">打开电脑版工作站' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>' +
    '</a></div>';
}

/* ============================================================
   顶栏 / 近七天 / 轻提示
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function renderStrip(){
  const host = document.getElementById('weekStrip');
  if(!host) return;
  const week = '日一二三四五六';
  let html = '';
  for(let i = 6; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = keyOf(d);
    const n = mb.days[k] || 0;
    html += '<div class="day-cell' + (i === 0 ? ' is-today' : '') + (n ? ' has' : '') + '">' +
        '<span class="dc-day">' + week[d.getDay()] + '</span>' +
        '<span class="dc-num">' + (n || '·') + '</span></div>';
  }
  host.innerHTML = html;
}

function refreshHeader(){
  const today = todayCount();
  const num = document.getElementById('todayNum');
  const fill = document.getElementById('goalFill');
  const tip = document.getElementById('goalTip');
  const streak = document.getElementById('streakNum');
  if(num) num.textContent = today;
  if(fill) fill.style.width = Math.min(100, today / GOAL * 100) + '%';
  if(tip){
    tip.textContent = today === 0 ? '刷一张就热身'
      : today >= GOAL ? '今日达成 · 继续也不亏'
      : '再刷 ' + (GOAL - today) + ' 个就收工';
  }
  if(streak) streak.textContent = streakDays();
  const d = new Date();
  const label = document.getElementById('todayLabel');
  if(label) label.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + '日一二三四五六'[d.getDay()];
  renderStrip();
}

/* ============================================================
   导航与交互（每个容器只绑定一次）
   ============================================================ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById('view-' + name);
  if(view) view.classList.add('active');
  if(name === 'lib') renderLib();
  if(name === 'quiz') renderQuiz();
  if(name === 'stat') renderStat();
  const main = document.querySelector('.main');
  if(main) main.scrollTop = 0;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* 刷词：朗读 / 三档反馈 / 重开一轮 / 点按翻面 */
document.getElementById('view-deck').addEventListener('click', (e) => {
  if(suppressTap){ suppressTap = false; return; }
  if(spellSuppressTap){ spellSuppressTap = false; return; }
  const rateBtn = e.target.closest('[data-rate]');
  if(rateBtn){ e.preventDefault(); e.stopPropagation(); advance(Number(rateBtn.dataset.rate)); return; }
  const restart = e.target.closest('[data-restart]');
  if(restart){ e.preventDefault(); queue = buildQueue(); pos = 0; renderDeckShell(); return; }
  const sp = e.target.closest('[data-speak]');
  if(sp){
    e.preventDefault(); e.stopPropagation();
    const card = sp.closest('.swipe-card');
    speakWord(card ? card.dataset.word : '', sp);
    return;
  }
  if(e.target.closest('.mini-card')) return; /* 词卡链接照常跳转 */
  const sTile = e.target.closest('.spell-tile');
  if(sTile){
    e.preventDefault(); e.stopPropagation();
    const box = sTile.closest('.spell-block');
    if(box && box.dataset.solved !== '1'){
      if(sTile.closest('.spell-slot')) moveTileToTray(sTile);
      else {
        const slot = box.querySelector('.spell-slot:not(.filled)');
        if(slot) moveTileToSlot(sTile, slot);
      }
    }
    return;
  }
  if(e.target.closest('.spell-slot')){ e.preventDefault(); e.stopPropagation(); return; }
  if(e.target.closest('[data-flip]')){ e.preventDefault(); e.stopPropagation(); }
  const card = e.target.closest('.swipe-card');
  if(card) card.classList.toggle('flipped');
});

/* ============================================================
   背面拼写：单词有几个字母就几个格子，下方字母块拖动/点按排布
   ============================================================ */
let spellSuppressTap = false;
let spellDrag = null;

function shuffleWord(word){
  const a = word.split('');
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  if(a.join('') === word && a.length > 1){
    const t = a[0]; a[0] = a[1]; a[1] = t;
  }
  return a;
}

function spellBlockHtml(word){
  const w = word.toLowerCase();
  const slots = Array.from({length: w.length}, () =>
    '<span class="spell-slot"></span>'
  ).join('');
  const tiles = shuffleWord(w).map((ch) =>
    '<button class="spell-tile" type="button" data-ch="' + esc(ch) + '">' + esc(ch) + '</button>'
  ).join('');
  return '<div class="spell-slots">' + slots + '</div>' +
    '<div class="spell-tiles">' + tiles + '</div>' +
    '<p class="fill-msg" role="status"></p>';
}

function syncSpellSlots(box){
  box.querySelectorAll('.spell-slot').forEach((s) => {
    s.classList.toggle('filled', !!s.querySelector('.spell-tile'));
  });
}

/* 把字母块放进格子：目标格已有字母则交换（来源是托盘时，原字母退回托盘） */
function moveTileToSlot(tile, slot){
  const box = slot && slot.closest('.spell-block');
  if(!box || !tile || box.dataset.solved === '1') return;
  if(slot.querySelector('.spell-tile') === tile) return;
  const fromSlot = tile.closest('.spell-slot');
  const prev = slot.querySelector('.spell-tile');
  if(prev){
    if(fromSlot) fromSlot.appendChild(prev);
    else box.querySelector('.spell-tiles').appendChild(prev);
  }
  slot.appendChild(tile);
  syncSpellSlots(box);
  autoCheckSpell(box);
}

function moveTileToTray(tile){
  const box = tile && tile.closest('.spell-block');
  if(!box || box.dataset.solved === '1') return;
  box.querySelector('.spell-tiles').appendChild(tile);
  syncSpellSlots(box);
  autoCheckSpell(box);
}

function autoCheckSpell(box){
  if(!box || box.dataset.solved === '1') return;
  const word = (box.dataset.spellWord || '').toLowerCase();
  const msg = box.querySelector('.fill-msg');
  const slots = Array.from(box.querySelectorAll('.spell-slot'));
  box.classList.remove('ok', 'bad');
  if(!slots.length || slots.some((s) => !s.querySelector('.spell-tile'))){
    if(msg) msg.textContent = '';
    return;
  }
  const ans = slots.map((s) => s.querySelector('.spell-tile').dataset.ch).join('');
  void box.offsetWidth; /* 重排一次，错误抖动动画可重复触发 */
  if(ans === word){
    box.classList.add('ok');
    box.dataset.solved = '1';
    if(msg) msg.textContent = '✓ 拼写正确 · ' + word;
  } else {
    box.classList.add('bad');
    if(msg) msg.textContent = '✗ 顺序不对 · 再调整一下';
  }
}

function slotAtPoint(x, y, box){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  const slot = el.closest('.spell-slot');
  return (slot && box.contains(slot)) ? slot : null;
}

/* 拖动：按下字母块生成跟随手指的幽灵块，松手落到格子或退回托盘 */
document.addEventListener('pointerdown', (e) => {
  const tile = e.target.closest('.spell-tile');
  if(!tile) return;
  const box = tile.closest('.spell-block');
  if(!box || box.dataset.solved === '1') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  tile.setPointerCapture && tile.setPointerCapture(e.pointerId);
  const r = tile.getBoundingClientRect();
  const cs = getComputedStyle(tile);
  const ghost = tile.cloneNode(true);
  ghost.classList.add('spell-ghost');
  ghost.classList.remove('dragging');
  ghost.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;display:grid;place-items:center;pointer-events:none;z-index:9999;' +
    'font-family:' + cs.fontFamily + ';font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';line-height:1;' +
    'color:' + cs.color + ';background:' + cs.backgroundColor + ';border:2px solid ' + cs.borderColor + ';border-radius:' + cs.borderRadius + ';' +
    'box-shadow:3px 3px 0 rgba(26,21,18,.45);transform:rotate(-3deg);';
  document.body.appendChild(ghost);
  spellDrag = {id:e.pointerId, tile, box, ghost, dx:e.clientX - r.left, dy:e.clientY - r.top, sx:e.clientX, sy:e.clientY, moved:false};
  tile.classList.add('dragging');
});

document.addEventListener('pointermove', (e) => {
  if(!spellDrag || e.pointerId !== spellDrag.id) return;
  const d = spellDrag;
  if(!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 6) d.moved = true;
  if(!d.moved) return;
  e.preventDefault();
  d.ghost.style.left = (e.clientX - d.dx) + 'px';
  d.ghost.style.top = (e.clientY - d.dy) + 'px';
  const slot = slotAtPoint(e.clientX, e.clientY, d.box);
  d.box.querySelectorAll('.spell-slot').forEach((s) => {
    s.classList.toggle('hot', s === slot);
  });
}, {passive:false});

function endSpellDrag(e){
  if(!spellDrag) return;
  if(e && e.pointerId !== undefined && e.pointerId !== spellDrag.id) return;
  const d = spellDrag;
  spellDrag = null;
  d.ghost.remove();
  d.tile.classList.remove('dragging');
  d.box.querySelectorAll('.spell-slot.hot').forEach((s) => s.classList.remove('hot'));
  if(!d.moved) return; /* 没有位移 → 交给 click 处理（点按填格 / 点回收回） */
  spellSuppressTap = true;
  setTimeout(() => { spellSuppressTap = false; }, 90);
  const slot = e ? slotAtPoint(e.clientX, e.clientY, d.box) : null;
  if(slot) moveTileToSlot(d.tile, slot);
  else if(d.tile.closest('.spell-slot')) moveTileToTray(d.tile);
}
document.addEventListener('pointerup', endSpellDrag);
document.addEventListener('pointercancel', endSpellDrag);

/* 手势：上滑跳过 / 右滑认识 / 左滑不认识 / 下滑有点印象 / 点按翻面 */
let dragState = null, suppressTap = false;
const DIR_LABEL = {up:'↑ 跳过', right:'→ 认识', left:'← 不认识', down:'↓ 有点印象'};

function hintDir(card, dx, dy){
  const h = card.querySelector('.dir-hint');
  if(!h) return;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax, ay) < 16){ h.classList.remove('show'); return; }
  const dir = ax > ay ? (dx > 0 ? 'right' : 'left') : (dy < 0 ? 'up' : 'down');
  if(h.dataset.dir !== dir){ h.dataset.dir = dir; h.textContent = DIR_LABEL[dir]; }
  h.classList.add('show');
}
function hideHint(card){
  const h = card.querySelector('.dir-hint');
  if(h) h.classList.remove('show');
}

const deckView = document.getElementById('view-deck');
deckView.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.swipe-card');
  if(!card) return;
  if(e.target.closest('.rate') || e.target.closest('.mini-card') || e.target.closest('.speak') || e.target.closest('[data-flip]')) return;
  /* 背面交给浏览器原生滚动，只有点按（无位移）才翻回正面 */
  if(card.classList.contains('flipped') && e.target.closest('.face.back')) return;
  dragState = {id:e.pointerId, card, x:e.clientX, y:e.clientY, dx:0, dy:0, moved:false};
  card.style.transition = 'none';
});
deckView.addEventListener('pointermove', (e) => {
  if(!dragState || e.pointerId !== dragState.id) return;
  dragState.dx = e.clientX - dragState.x;
  dragState.dy = e.clientY - dragState.y;
  if(Math.hypot(dragState.dx, dragState.dy) > 8) dragState.moved = true;
  if(!dragState.moved) return;
  dragState.card.style.transform = 'translate(' + dragState.dx + 'px,' + dragState.dy + 'px) rotate(' + (dragState.dx / 45) + 'deg)';
  hintDir(dragState.card, dragState.dx, dragState.dy);
});
function endDrag(){
  if(!dragState) return;
  const {card, dx, dy, moved} = dragState;
  dragState = null;
  card.style.transition = '';
  card.style.transform = '';
  hideHint(card);
  if(!moved) return; /* 没有位移 → 交给 click 判定为点按翻面 */
  suppressTap = true;
  setTimeout(() => { suppressTap = false; }, 80);
  const TH = 70;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(ax > ay){
    if(ax > TH) advance(dx > 0 ? 2 : 0, dx > 0 ? 'right' : 'left');
  } else if(ay > TH){
    advance(dy < 0 ? null : 1, dy < 0 ? 'up' : 'down');
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* 自测 */
document.getElementById('view-quiz').addEventListener('click', (e) => {
  if(e.target.closest('[data-hint]')){
    const hint = document.getElementById('qHint');
    if(hint) hint.hidden = false;
    const btn = e.target.closest('[data-hint]');
    if(btn) btn.style.display = 'none';
    return;
  }
  if(e.target.closest('[data-quiz-again]')){ startQuiz(); return; }
  if(e.target.closest('[data-quiz-back]')){ switchTab('deck'); return; }
  const submit = e.target.closest('#qSubmit');
  if(submit){ if(quiz.answered) quizNext(); else quizCheck(); }
});

/* 连续天数：点一下看累计 */
document.getElementById('streakBtn').addEventListener('click', () => {
  toast('连续 ' + streakDays() + ' 天 · 累计刷词 ' + (mb.total || 0) + ' 次');
});

/* ============================================================
   启动
   ============================================================ */
queue = buildQueue();
renderDeckShell();
refreshHeader();
</script>
