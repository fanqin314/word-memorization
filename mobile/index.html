<script src="../words-data.js"></script>
<script>
/* ============================================================
   数据层：全部读写与 index.html 相同的那几个 localStorage 键
   ============================================================ */
const D = window.WORDS_DATA || {};
const WORDS = (D.words || []).filter(w => w && w.word);
const ART = D.art || {};
const ARTCSS = D.artCss || {};
const MSTCSS = D.mst || {};

/* 背面用该词卡自己的配色：从卡片页 :root 收敛出的 --mst-* 里取纸色/墨色/强调色 */
const palCache = {};
function paletteOf(word){
  if(palCache[word]) return palCache[word];
  const css = MSTCSS[word] || '';
  const pick = k => {
    const m = css.match('--mst-' + k + ':\\s*([^;]+)');
    return m ? m[1].trim() : '';
  };
  const paper = pick('paper');
  const ink = pick('ink');
  const accent = pick('accent');
  const tint = tintOf(accent);
  const style = [
    paper ? '--mp:' + paper : '',
    ink ? '--mi:' + ink : '',
    accent ? '--ma:' + accent : '',
    '--ctint:' + tint
  ].filter(Boolean).join(';');
  return (palCache[word] = {paper, ink, accent, tint, style});
}

/* 纸色兑入强调色的比例：色相越鲜明兑得越多；
   近中性或很深的强调色少兑一点，避免整张卡变成一片灰 */
function tintOf(hex){
  const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return '16%';
  const n = parseInt(m[1], 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2, d = max - min;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let t;
  if(s < .12) t = 4;
  else if(l < .3) t = 8;
  else t = 16 + 14 * s;
  return Math.round(t) + '%';
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 把词卡页 .root-line 的文本还原成「词素胶囊 + 括号释义 + → 释义」的排版 */
function rootAtomHtml(seg, allowBare){
  const raw = String(seg).trim();
  const m = raw.match(/^([^（(]*)[（(]([^）)]*)[）)]/);
  if(!m){
    /* 只有构成部分里不带括号的单个词素（如 reverse 的 -e）做成胶囊，释义段不加 */
    return (allowBare && /^\S+$/.test(raw)) ? '<span class="' + (/-/.test(raw) ? 'affix' : 'stem') + '">' + esc(raw) + '</span>' : null;
  }
  const toks = m[1].trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return null;
  const morpheme = toks.pop();          /* 括号前最后一个词是词素，前面的「古英语 / 拉丁语」等作普通文字 */
  const prefix = toks.join(' ');
  /* 括号之后的剩余文字（可能还含别的括号）原样保留，不能丢 */
  const tail = raw.slice(m[0].length).trim();
  return (prefix ? esc(prefix) + ' ' : '') +
    '<span class="' + (/-/.test(morpheme) ? 'affix' : 'stem') + '">' + esc(morpheme) + '</span>（' + esc(m[2]) + '）' +
    (tail ? ' ' + esc(tail) : '');
}
function rootLineHtml(text){
  const raw = String(text || '').trim();
  if(!raw) return '';
  const parts = raw.split(/→/);
  const head = (parts[0] || '').trim();
  const rest = parts.slice(1).map(s => s.trim()).filter(Boolean);
  const segs = head.split(/[+＋]/).map(s => s.trim());
  const atoms = segs.map(s => rootAtomHtml(s, true));
  /* 只要有一段能做成胶囊就走胶囊排版，解析失败的段原样输出（不整段退回 plain） */
  if(!atoms.some(a => a)) return '<div class="back-root plain">' + esc(raw) + '</div>';
  let html = '<div class="back-root">' + atoms.map((a, i) => a || esc(segs[i])).join('<em>+</em>');
  if(rest.length){
    html += '<span class="sep">→</span>' +
      rest.map((s, i) => {
        const a = rootAtomHtml(s);
        if(a) return a;
        return i === rest.length - 1 ? '<b>' + esc(s) + '</b>' : esc(s);
      }).join('<span class="sep">→</span>');
  }
  return html + '</div>';
}

const STORE_KEY = 'vocab_workbench_v1';
const MB_KEY = 'wc_mobile_v1';
const QUIZ_KEY = 'wc_quiz_v1';
const MST_KEY = 'vocab_mst_v1';
const REVIEW_DAYS = ['d1','d3','d7','d15'];
const GOAL = 10;

const ROOT_META = {
  vers:  {label:'vers · vert', color:'var(--indigo)'},
  un:    {label:'un · uni',    color:'var(--teal)'},
  ann:   {label:'ann',         color:'var(--amber)'},
  contra:{label:'contra',      color:'var(--clay)'},
  cor:   {label:'cor',         color:'var(--plum)'},
  other: {label:'其他词源',     color:'var(--rose)'}
};
const MST_LABEL = ['未学','学习中','已掌握'];

let store = loadJSON(STORE_KEY, {});
let mb = loadJSON(MB_KEY, {days:{}, total:0});
let mstRule = Object.assign({learnOpens:2, masterOpens:5, decayDays:14}, loadJSON(MST_KEY, {}));

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? (JSON.parse(raw) || fallback) : fallback;
  }catch(e){ return fallback; }
}
function persist(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ toast('本机存储不可用，记录不会保存'); }
}
function rec(word){
  let r = store[word];
  if(!r) r = store[word] = {};
  if(r.fav === undefined) r.fav = false;
  if(r.mastery === undefined) r.mastery = 0;
  if(r.pin === undefined) r.pin = null;
  if(r.note === undefined) r.note = '';
  if(r.opens === undefined) r.opens = 0;
  if(r.lastOpened === undefined) r.lastOpened = 0;
  if(r.dueAt === undefined) r.dueAt = 0;   /* 0 = 从未排期，视为已到期 */
  return r;
}
function daysSince(ts){ return ts ? (Date.now() - ts) / 86400000 : Infinity; }
function masteryOf(word){
  const r = rec(word);
  const auto = r.opens >= mstRule.masterOpens ? 2 : r.opens >= mstRule.learnOpens ? 1 : 0;
  const val = (r.pin === 1 || r.pin === 2) ? r.pin : auto;
  return (val === 2 && daysSince(r.lastOpened) > mstRule.decayDays) ? 1 : val;
}

/* 复习打卡只读，汇总来自卡片页写的 <单词>_review */
let reviewCache = null;
function reviewMap(){
  if(reviewCache) return reviewCache;
  const map = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.slice(-7) !== '_review') continue;
      const v = loadJSON(k, {});
      map[k.slice(0, -7)] = (v && typeof v === 'object') ? v : {};
    }
  }catch(e){}
  reviewCache = map;
  return map;
}
function reviewDone(word){
  const v = reviewMap()[word];
  return v ? REVIEW_DAYS.filter(k => v[k]).length : 0;
}
/* ------------------------------------------------------------
   日期与统计
   ------------------------------------------------------------ */
function keyOf(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey(){ return keyOf(new Date()); }
function startOfDay(ts){
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function todayCount(){ return mb.days[todayKey()] || 0; }
function streakDays(){
  const days = mb.days || {};
  const d = new Date();
  if(!days[keyOf(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while(days[keyOf(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bumpToday(n){
  const k = todayKey();
  mb.days = mb.days || {};
  mb.days[k] = (mb.days[k] || 0) + n;
  mb.total = (mb.total || 0) + n;
  persist(MB_KEY, mb);
}
/* 今天已经评分过的词（刷新后排在队尾，不重复出现在最前面） */
function ratedToday(){
  const set = new Set(((mb.rated || {})[todayKey()]) || []);
  return set;
}
function markRated(word){
  const k = todayKey();
  mb.rated = mb.rated || {};
  const list = mb.rated[k] || (mb.rated[k] = []);
  if(list.indexOf(word) < 0) list.push(word);
  /* 只保留最近 7 天（日期键按 YYYY-MM-DD 排序即时间序），避免记录无限增长 */
  const keys = Object.keys(mb.rated).sort();
  while(keys.length > 7) delete mb.rated[keys.shift()];
  persist(MB_KEY, mb);
}
/* 进度存档：日期 + 当前下标 + 当时的队列词序 */
function savePos(){
  if(!queue.length || deckScoped) return;
  mb.pos = {date: todayKey(), index: pos, queueWords: queue.map(w => w.word), label: deckScopeLabel};
  persist(MB_KEY, mb);
}
/* 恢复队列：优先按存档的词序重建（顺序一致，刷新后停在同一张）；没有存档再新建。
   buildQueue() 每次都 shuffle，只认下标会让刷新后的位置跳到另一个词上。 */
function restoreQueue(){
  const p = mb.pos;
  if(p && p.date === todayKey() && Array.isArray(p.queueWords) && p.queueWords.length){
    const byWord = new Map(WORDS.map(w => [w.word, w]));
    const q = p.queueWords.map(n => byWord.get(n)).filter(Boolean);
    if(q.length){
      let idx = Math.min(Math.max(0, p.index || 0), q.length);
      const curWord = p.queueWords[p.index || 0];
      if(curWord){
        const i = q.findIndex(w => w.word === curWord);
        if(i >= 0) idx = i;
      }
      return {queue: q, pos: idx, label: p.label || ''};
    }
  }
  return {queue: buildQueue(), pos: 0, label: ''};
}

/* ------------------------------------------------------------
   刷词队列：按到期日排序（到期早的先刷），同日按掌握度，再按字母序
   ------------------------------------------------------------ */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildQueue(onlyFresh){
  const rated = ratedToday();
  const all = WORDS.slice().sort((a, b) =>
    rec(a.word).dueAt - rec(b.word).dueAt ||      /* 到期早的先刷 */
    masteryOf(a.word) - masteryOf(b.word) ||       /* 同一到期日按掌握度 */
    a.word.localeCompare(b.word));                 /* 并列时稳定可复现 */
  /* 今天已评分的词排到队尾：不删掉（允许重刷），但不占队首 */
  const fresh = all.filter(w => !rated.has(w.word));
  const done = all.filter(w => rated.has(w.word));
  /* onlyFresh：重开一轮只刷今天还没刷过的（方案 A） */
  return onlyFresh ? fresh : fresh.concat(done);
}
let queue = [];
let pos = 0;
let animating = false;
/* 词库「刷这组」：临时队列，不写全局进度存档 */
let deckScoped = false;
let deckBackup = null;      /* 进入分组前的 {queue, pos, undoSnap} */
let deckScopeLabel = '';    /* 当前分组字母，如 'C' */
let deckPickOpen = false;   /* 牌组选择面板是否展开 */
let deckPickDirty = true;   /* 面板里的计数是否过期（评分后掌握度会变） */
let pickHistory = false;    /* 面板打开时压了一条历史记录，供手机返回键收回 */
let pickIgnorePop = 0;      /* 自己发起的 back() 会触发 popstate，用计数把它忽略掉 */

/* ------------------------------------------------------------
   朗读：优先播放预生成的发音文件（WebView 壳里通常没有系统 TTS），
   文件缺失或不支持播放时再退回系统朗读
   ------------------------------------------------------------ */
const AUDIO_BASE = 'audio/';
let speakAudio = null;
let speakBtn = null;
function stopSpeak(){
  if(speakAudio){ try{ speakAudio.pause(); }catch(e){} }
  if(speakBtn){ speakBtn.classList.remove('speaking'); speakBtn = null; }
}
let speakVO = null;
let ttsWarned = false;
/* 设备没有英文语音引擎时只提示一次，避免每点一下朗读就弹一次 */
function warnNoTts(){
  if(ttsWarned) return;
  ttsWarned = true;
  toast('设备缺少英文语音引擎，请在系统设置里安装');
}
function speakFallback(word, btn){
  if(!('speechSynthesis' in window)){ toast('朗读音频缺失，请检查网络'); return; }
  window.speechSynthesis.cancel();
  const u = speakVO = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  const off = () => { if(btn && speakVO === u && speakBtn === btn){ btn.classList.remove('speaking'); speakBtn = null; } };
  if(btn){ btn.classList.add('speaking'); speakBtn = btn; }
  u.onend = off;
  u.onerror = (e) => {
    off();
    const reason = e && e.error;
    if(reason === 'interrupted' || reason === 'canceled') return;
    warnNoTts();
  };
  window.speechSynthesis.speak(u);
}
/* 预取当前卡和下一张卡的发音，滑卡后按下就能立刻出声 */
const audioPreload = new Map();
const audioMiss = new Set();
function preloadAudio(word){
  if(!word || audioPreload.has(word)) return;
  if(audioPreload.size > 6) audioPreload.clear();
  const a = new Audio();
  a.preload = 'auto';
  a.src = AUDIO_BASE + encodeURIComponent(word) + '.mp3';
  audioPreload.set(word, a);
}
function speakWord(word, btn){
  if(!word) return;
  stopSpeak();
  if(audioMiss.has(word)){ speakFallback(word, btn); return; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(!speakAudio){ speakAudio = new Audio(); speakAudio.preload = 'auto'; }
  const a = speakAudio;
  let done = false;
  const off = () => {
    if(btn && speakBtn === btn){ btn.classList.remove('speaking'); speakBtn = null; }
  };
  const fail = () => {
    if(done) return;
    done = true;
    audioMiss.add(word); /* 记住缺音频的词，下次直接走朗读，不再白请求 */
    off();
    speakFallback(word, btn);
  };
  a.onended = () => { done = true; off(); };
  a.onerror = fail;
  a.src = AUDIO_BASE + encodeURIComponent(word) + '.mp3';
  if(btn){ speakBtn = btn; btn.classList.add('speaking'); }
  try{ a.currentTime = 0; }catch(e){}
  const pr = a.play();
  if(pr && pr.catch) pr.catch(fail);
}

/* ------------------------------------------------------------
   意象卡 CSS 按需注入（每个词一份，避免一次性塞 100KB）
   ------------------------------------------------------------ */
const artCssLoaded = new Set();
function ensureArtCss(word){
  if(artCssLoaded.has(word) || !ARTCSS[word]) return;
  artCssLoaded.add(word);
  const st = document.createElement('style');
  st.textContent = ARTCSS[word];
  document.head.appendChild(st);
}

/* ------------------------------------------------------------
   合成音效（WebAudio，无外部音频资源）
   静音状态单独存 wc_sound_v1，不动既有的几个数据键
   ------------------------------------------------------------ */
const SFX_KEY = 'wc_sound_v1';
let sfxCtx = null;
let sfxMaster = null;
const SFX_ON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
const SFX_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></svg>';

function sfxOn(){
  try{ return localStorage.getItem(SFX_KEY) !== '0'; }catch(e){ return true; }
}
function sfxCtxGet(){
  if(sfxCtx) return sfxCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    sfxCtx = new AC();
    sfxMaster = sfxCtx.createGain();
    sfxMaster.gain.value = .2; /* master gain 固定在 .25 以下 */
    sfxMaster.connect(sfxCtx.destination);
  }catch(e){ sfxCtx = null; sfxMaster = null; }
  return sfxCtx;
}
function sfxTone(freq, offset, dur, type, vol, freqEnd){
  if(!sfxCtx) return;
  const t = sfxCtx.currentTime + offset;
  const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  /* 带一点滑音：从 freq 滑到 freqEnd，刷词的「嗖」感就靠它 */
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(sfxMaster);
  o.start(t); o.stop(t + dur + .02);
}
/* 小铃铛：基音 + 两个泛音，比单纯正弦更有「叮」的质感 */
function sfxBell(freq, offset, dur, vol){
  sfxTone(freq, offset, dur, 'sine', vol);
  sfxTone(freq * 2, offset, dur * .55, 'sine', vol * .34);
  sfxTone(freq * 3, offset, dur * .3, 'sine', vol * .13);
}
function sfxNoise(offset, dur, filterType, freq, vol, freqEnd, q){
  if(!sfxCtx) return;
  const t = sfxCtx.currentTime + offset;
  const len = Math.max(1, Math.floor(sfxCtx.sampleRate * dur));
  const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = sfxCtx.createBufferSource();
  src.buffer = buf;
  const f = sfxCtx.createBiquadFilter();
  f.type = filterType;
  f.frequency.setValueAtTime(freq, t);
  if(freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur); /* 扫频：翻纸/滑走的风声 */
  if(q) f.Q.value = q;
  const g = sfxCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxMaster);
  src.start(t); src.stop(t + dur);
}
/* 轻振一下：和音效一起开关，安卓 Chrome 支持；不支持就静默跳过 */
function sfxHaptic(pattern){
  if(!sfxOn()) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
/* 连续「认识」的连击数：音高逐张升高，连击断了就回落 */
let sfxStreak = 0;
function sfxPlay(name){
  if(!sfxOn()) return;
  const ctx = sfxCtxGet();
  if(!ctx) return; /* 首次手势前 ctx 不会被创建 */
  if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
  if(name === 'rate2') sfxStreak++;
  else if(name === 'rate0' || name === 'skip') sfxStreak = 0;
  switch(name){
    case 'rate2': {
      /* 连击每多一张升高一个半音（最多 5 个），像珠子一颗颗落进碗里 */
      const k = Math.min(Math.max(sfxStreak - 1, 0), 5);
      const f = 523.25 * Math.pow(2, k / 12);
      sfxBell(f, 0, .34, .5);
      sfxNoise(0, .03, 'highpass', 2600, .18, 3200, .6);
      if(sfxStreak >= 3) sfxBell(f * 1.5, .08, .16, .16); /* 连击 3 张起加一颗小亮片 */
      sfxHaptic(12);
      break;
    }
    case 'rate1':
      /* 有点印象：一声短促的软音，尾巴微微下沉，像点头 */
      sfxTone(392, 0, .1, 'sine', .42, 356);
      sfxNoise(0, .04, 'lowpass', 900, .12);
      sfxHaptic(8);
      break;
    case 'rate0':
      /* 不认识：低沉但不惩罚，一声闷响带点风声落地 */
      sfxTone(196, 0, .11, 'triangle', .4, 168);
      sfxNoise(0, .09, 'lowpass', 420, .2, 240);
      sfxHaptic(22);
      break;
    case 'skip':
      /* 跳过：空气被划开的长「嗖」，不占评分音的记忆点 */
      sfxNoise(0, .17, 'highpass', 700, .28, 1500, .8);
      sfxTone(330, 0, .1, 'sine', .16, 294);
      sfxHaptic(6);
      break;
    case 'flip':
      /* 翻面：两段纸声——先掀起，再落下 */
      sfxNoise(0, .08, 'bandpass', 2200, .24, 900, 1.1);
      sfxNoise(.07, .1, 'lowpass', 1300, .2, 700, .8);
      sfxTone(170, .07, .07, 'sine', .1);
      sfxHaptic(6);
      break;
    case 'drop':
      /* 拼写落格：一粒小扣子落进格子的「哒」 */
      sfxNoise(0, .03, 'bandpass', 1700, .22, 2400, 2);
      sfxTone(880, 0, .025, 'square', .1);
      sfxHaptic(4);
      break;
    case 'ok':
      /* 拼写完成：三级小铃，一声比一声亮 */
      sfxBell(523.25, 0, .3, .42);
      sfxBell(659.25, .06, .3, .4);
      sfxBell(783.99, .12, .34, .4);
      sfxHaptic([10, 24, 12]);
      break;
    case 'bad':
      /* 拼错：两声轻闷的「嘟嘟」，音量压得很低 */
      sfxTone(190, 0, .08, 'square', .18, 176);
      sfxTone(150, .09, .1, 'square', .15, 140);
      sfxHaptic(18);
      break;
    case 'goal':
      /* 今日达标：四音上行 + 一把细碎亮片 */
      sfxBell(523.25, 0, .34, .42);
      sfxBell(659.25, .08, .34, .42);
      sfxBell(783.99, .16, .36, .4);
      sfxBell(1046.5, .24, .46, .46);
      sfxNoise(.1, .3, 'highpass', 2400, .16, 4200, 1.4);
      sfxHaptic([10, 30, 10, 30, 16]);
      break;
    case 'panelOpen':
      /* 牌架拉开：一段纸滑声 + 一声轻铃 */
      sfxNoise(0, .16, 'bandpass', 780, .2, 1700, .9);
      sfxBell(440, .03, .26, .2);
      sfxHaptic(8);
      break;
    case 'panelClose':
      /* 牌架收回：比拉开低一档、短一截 */
      sfxNoise(0, .12, 'lowpass', 900, .14, 420, .8);
      sfxHaptic(4);
      break;
    case 'pick':
      /* 选中一档：一粒小扣子落定 */
      sfxNoise(0, .03, 'bandpass', 1700, .2, 2400, 2);
      sfxTone(700, 0, .07, 'sine', .26, 620);
      sfxHaptic(8);
      break;
  }
}

/* 间隔按「天」算，统一落到当天 0 点 */
function dueAfter(level){
  const today = startOfDay(Date.now());
  if(level === 0) return today;                   /* 不认识 → 次日回到到期队列前排 */
  if(level === 1) return today + 86400000;        /* 有点印象 → 明天 0 点 */
  return today + 3 * 86400000;                    /* 认识 → 3 天后 0 点 */
}

/* 记录掌握度：写回 index.html 同一份 store */
function rateWord(word, level){
  const r = rec(word);
  r.opens = (r.opens || 0) + 1;
  r.lastOpened = Date.now();
  if(level === 2) r.pin = 2;
  else if(level === 1) r.pin = 1;
  else { r.pin = null; r.opens = 0; }
  r.mastery = masteryOf(word);
  r.dueAt = dueAfter(level);
  deckPickDirty = true; /* 掌握度分布变了，下次开面板要重算 */
  persist(STORE_KEY, store);
  markRated(word);
  bumpToday(1);
  sfxPlay('rate' + level);
  /* 今日首次达标：进度线扫光一次 + 达成音，当天只触发一次 */
  if(todayCount() === GOAL){
    shineGoal();
    sfxPlay('goal');
  }
}

function shineGoal(){
  const fill = document.getElementById('goalFill');
  if(!fill) return;
  fill.classList.remove('shine');
  void fill.offsetWidth;
  fill.classList.add('shine');
  fill.addEventListener('animationend', () => fill.classList.remove('shine'), {once:true});
}

function tickPos(){
  const el = document.getElementById('deckPos');
  if(!el) return;
  el.classList.remove('tick');
  void el.offsetWidth;
  el.classList.add('tick');
  el.addEventListener('animationend', () => el.classList.remove('tick'), {once:true});
}

/* ------------------------------------------------------------
   撤回：滑走一张后状态条出现「撤回」，把这张卡与今天的记录一起退回
   ------------------------------------------------------------ */
let undoSnap = null;

function setUndoVisible(v){
  const btn = document.getElementById('undoBtn');
  if(btn) btn.hidden = !v;
}

/* 在评分/跳过发生前拍快照，撤回时原样还原 */
function takeUndoSnap(word){
  undoSnap = {
    word: word,
    pos: pos,
    wordRec: store[word] ? Object.assign({}, store[word]) : null,
    days: Object.assign({}, mb.days || {}),
    total: mb.total || 0,
    rated: JSON.parse(JSON.stringify(mb.rated || {})),
    savedPos: mb.pos ? Object.assign({}, mb.pos) : null
  };
}

function undoLast(){
  if(!undoSnap || animating) return;
  const u = undoSnap;
  undoSnap = null;
  if(u.wordRec) store[u.word] = u.wordRec;
  else delete store[u.word];
  persist(STORE_KEY, store);
  mb.days = u.days;
  mb.total = u.total;
  mb.rated = u.rated;
  if(u.savedPos) mb.pos = u.savedPos;
  else delete mb.pos;
  persist(MB_KEY, mb);
  pos = u.pos;
  renderCard();
  tickPos();
  refreshHeader();
  setUndoVisible(false);
  toast('已撤回：' + u.word);
}

function advance(level, dir){
  if(animating) return;
  const w = queue[pos];
  if(!w) return;
  animating = true;
  takeUndoSnap(w.word);
  setUndoVisible(false);
  if(level === null) toast('已跳过');
  else {
    rateWord(w.word, level);
    toast(level === 2 ? '标记为已掌握' : level === 1 ? '标记为学习中' : '已回到未学，明天再来');
    refreshHeader();
    if(todayCount() === GOAL) setTimeout(() => toast('今日 10 个达成，收工！'), 700);
  }
  if(level === null) sfxPlay('skip'); /* 跳过单独音色，避免与评分音重复 */
  const card = document.querySelector('.swipe-card');
  if(card) card.classList.add('out-' + (dir || (level === null ? 'up' : 'right')));
  /* 系统开了「减少动态效果」时出卡几乎瞬间完成，不必再空等 */
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  setTimeout(() => {
    pos += 1;
    animating = false;
    savePos();
    renderCard(true);      /* 连刷不重放内部的错落入场 */
    tickPos();
    setUndoVisible(true);
  }, reduce ? 0 : (level === null ? 400 : 360));
}

    libBuilt = true;
    view.innerHTML =
      '<div class="lib-stat"><b id="libStatCount">' + WORDS.length + '</b> 个词 · ' +
        '<b id="libStatLetters">0</b> 个字母</div>' +
      '<div class="lib-top"><div class="search-box">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>' +
        '<input id="libSearch" type="search" placeholder="搜单词或释义…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button class="clear" id="libClear" type="button" aria-label="清空" hidden>×</button>' +
      '</div></div>' +
      '<div class="lib-mst" id="libMst"></div>' +
      '<div class="lib-stage"><div class="lib-grid" id="libGrid"></div>' +
        '<div class="lib-detail" id="libDetail"></div></div>';

    const qEl = document.getElementById('libSearch');
    const clearBtn = document.getElementById('libClear');
    qEl.addEventListener('input', (e) => {
      clearBtn.hidden = !e.target.value;
      const v = e.target.value;
      clearTimeout(libTimer);
      libTimer = setTimeout(() => {
        if(libCurrent) hardCloseLib();
        renderLibGrid(v.trim().toLowerCase());
      }, 140);
    });
    clearBtn.addEventListener('click', () => {
      qEl.value = '';
      clearBtn.hidden = true;
      libFilter = '';
      if(libCurrent) hardCloseLib();
      renderLibGrid('');
      qEl.focus();
    });

    /* 掌握度分类：切换筛选，或直接按这一类开刷 */
    document.getElementById('libMst').addEventListener('click', (e) => {
      const chip = e.target.closest('.m-chip');
      if(chip){
        const v = chip.dataset.mst;
        if(v === libMst) return;
        libMst = v;
        if(libCurrent) hardCloseLib();
        renderLibGrid(libFilter);
        return;
      }
      if(e.target.closest('#libMstBrush')) queueLibMst();
    });

    /* 下滑关闭详情层；列表已滚动时不拦 */
    const detail = document.getElementById('libDetail');
    let touchY = 0, touchBlocked = false;
    detail.addEventListener('touchstart', (e) => {
      if(!libCurrent) return;
      const scroller = detail.querySelector('.detail-scroll');
      touchBlocked = !!(scroller && scroller.scrollTop > 0);
      touchY = e.touches[0].clientY;
    }, {passive: true});
    detail.addEventListener('touchmove', (e) => {
      if(!libCurrent || touchBlocked) return;
      if(e.touches[0].clientY - touchY > 80){ closeLibLetter(); touchBlocked = true; }
    }, {passive: true});

    document.getElementById('libGrid').addEventListener('click', (e) => {
      const spec = e.target.closest('.spec');
      if(!spec) return;
      openLibLetter(spec.dataset.letter);
    });
  }
  if(libCurrent) hardCloseLib();
  renderLibGrid(libFilter);
}

/* 关键词过滤（匹配单词或释义） */
function libSearchWords(q){
  const s = (q || '').toLowerCase();
  if(!s) return WORDS.slice();
  return WORDS.filter(w => w.word.toLowerCase().includes(s) || (w.gloss || '').toLowerCase().includes(s));
}

/* 关键词 + 掌握度过滤后的全部词 */
function libMstWords(q){
  const base = libSearchWords(q);
  return libMst === 'all' ? base : base.filter(w => String(masteryOf(w.word)) === libMst);
}

/* 某个字母的全部词：只跟关键词走，不套外面那行的掌握度筛选——
   详情层有自己的分类条，打开一个字母就是翻开它自己那一页 */
function libLetterWords(L){
  return libSearchWords(libFilter).filter(w => ((w.word[0] || '#').toUpperCase()) === L);
}

/* 按首字母分组 */
function libGroupsOf(q){
  const map = new Map();
  libMstWords(q).forEach(w => {
    const L = (w.word[0] || '#').toUpperCase();
    if(!map.has(L)) map.set(L, []);
    map.get(L).push(w);
  });
  map.forEach(list => list.sort((a, b) => a.word.localeCompare(b)));
  return map;
}

/* 方块颜色 = 该组掌握状态的聚合：全灰 / 琥珀 / 苔绿 */
function libGroupColor(list){
  const n = list.length;
  const m1 = list.filter(w => masteryOf(w.word) === 1).length;
  const m2 = list.filter(w => masteryOf(w.word) === 2).length;
  if(n > 0 && m2 === n) return '#6F8B74';
  if(m1 + m2 === 0) return '#8F9296';
  return '#BB9A5A';
}

/* 字体样本册：每个字母一副面孔，名字印在字脚下 */
const LIB_FACE = {
  a:'Helvetica Black', b:'Georgia Regular', c:'Impact Condensed', d:'Outline 2pt',
  e:'Helvetica Extended', f:'Brush Script', h:'Drop Shadow', i:'Helvetica Narrow',
  l:'Italic Slant', n:'Halftone Dot', o:'Helvetica Round', p:'Rule Underline',
  r:'Mirror Reverse', s:'Inverse Block', t:'Georgia Boxed', u:'Double Rule',
  w:'Helvetica Wide'
};

/* 字母 → 字体样本键：字母墙与详情徽章共用同一副面孔 */
function libFaceKey(L){
  return /^[A-Z]$/.test(L) ? L.toLowerCase() : 'o';
}

let libGlyphSeq = 0;
/* 内联 SVG 字形：颜色全部走 currentColor，尺寸交给 .gl 的 CSS，
   halftone 那副面孔用点阵 pattern，id 每次自增避免重复 */
function libGlyph(sty){
  const g = LIB_GLYPH[sty] || LIB_GLYPH.a;
  let defs = '', fill = 'currentColor';
  if(sty === 'n'){
    const id = 'ht' + (++libGlyphSeq);
    defs = '<defs><pattern id="' + id + '" width="7" height="7" patternUnits="userSpaceOnUse">' +
      '<circle cx="1.8" cy="1.8" r="1.55" fill="currentColor"/></pattern></defs>';
    fill = 'url(#' + id + ')';
  }
  return '<svg class="gl" viewBox="0 0 ' + g.w + ' 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">' +
    defs + '<path d="' + g.d + '" fill="' + fill + '"/></svg>';
}

/* 字号与卡面尺寸随词量长大：1 词 56px 宽，9 词 128px 宽 */
function libSpecSize(n){
  const w = 56 + (Math.min(Math.max(n, 1), 9) - 1) * 9;
  const fs = Math.round(w * .86);
  return {w, fs, h: Math.round(fs * 1.08) + 48};
}

function libSorted(list){
  return list.slice().sort((a, b) =>
    masteryOf(a.word) - masteryOf(b.word) || a.word.localeCompare(b.word));
}

function renderLibGrid(q){
  libFilter = q || '';
  libGroups = libGroupsOf(libFilter);
  const used = Array.from(libGroups.keys()).sort();
  const total = used.reduce((n, L) => n + libGroups.get(L).length, 0);
  const cEl = document.getElementById('libStatCount');
  const lEl = document.getElementById('libStatLetters');
  if(cEl) cEl.textContent = total;
  if(lEl) lEl.textContent = used.length;

  /* 掌握度分类栏：数字按当前关键词过滤后的口径统计 */
  const base = libSearchWords(libFilter);
  const mrow = document.getElementById('libMst');
  if(mrow){
    const chips = [
      ['all', '全部', base.length],
      ['0', '未学', base.filter(w => masteryOf(w.word) === 0).length],
      ['1', '学习中', base.filter(w => masteryOf(w.word) === 1).length],
      ['2', '已掌握', base.filter(w => masteryOf(w.word) === 2).length]
    ];
    mrow.innerHTML = chips.map(c =>
      '<button class="m-chip' + (libMst === c[0] ? ' on' : '') + '" type="button" data-mst="' + c[0] + '">' +
        c[1] + '<b>' + c[2] + '</b></button>').join('') +
      '<button class="m-brush" type="button" id="libMstBrush"' + (total ? '' : ' hidden') + '>刷这些</button>';
  }

  const grid = document.getElementById('libGrid');
  if(!grid) return;
  if(!used.length){
    grid.innerHTML = '<div class="wempty">' +
      (libMst === 'all'
        ? '没有匹配的词，换个关键词试试'
        : (libFilter
          ? '「' + esc(libFilter) + '」里没有' + MST_LABEL[Number(libMst)] + '的词'
          : '这一类还没有词，换个掌握度试试')) + '</div>';
    return;
  }
  grid.classList.toggle('no-anim', !!libFilter);
  grid.innerHTML = used.map((L, i) => {
    const list = libGroups.get(L);
    const n = list.length;
    const done = list.filter(w => masteryOf(w.word) === 2).length;
    const sz = libSpecSize(n);
    const sty = libFaceKey(L);
    const state = done === 0 ? 0 : (done >= n ? 2 : 1);
    const stateLabel = MST_LABEL[state];
    const pct = Math.round(done / n * 100);
    return '<button class="spec" type="button" data-letter="' + esc(L) + '" data-style="' + sty + '"' +
      ' data-state="' + state + '"' +
      ' style="--w:' + sz.w + 'px;--h:' + sz.h + 'px;--fs:' + sz.fs + 'px;--i:' + i + '"' +
      ' aria-label="' + esc(L + ' 组，' + n + ' 个词，' + stateLabel + ' ' + done + '/' + n) + '">' +
      '<span class="glyph">' + libGlyph(sty) + '</span>' +
      '<span class="meta">' +
        '<span class="spec-letter">' + esc(L) + ' · ' + sz.fs + ' PT</span>' +
        '<span class="spec-font">' + (LIB_FACE[sty] || LIB_FACE.o) + '</span>' +
        '<span class="spec-state">' +
          '<span class="st"><i></i>' + stateLabel + '</span>' +
          '<span class="sn">' + done + '/' + n + '</span>' +
        '</span>' +
        '<span class="spec-bar"><i style="width:' + pct + '%"></i></span>' +
      '</span>' +
    '</button>';
  }).join('');
}

        '<div class="bm-row"><span class="bm-k">Face</span><span class="bm-v">' + esc(LIB_FACE[sty] || LIB_FACE.o) + '</span></div>' +
        '<div class="bm-row"><span class="bm-k">Studied</span><span class="bm-v">' + done + ' / ' + n + '</span></div>' +
        '<div class="bm-bar"><i style="width:' + pct + '%;background:var(--ink)"></i></div>' +
      '</div>' +
    '</div>' +
    '<div class="detail-scroll">' +
      (cards
        ? '<div class="w-grid">' + cards + '</div>'
        : '<div class="wempty">' + (libLetterMst === 'all'
          ? '这个词母下还没有词'
          : '这个字母里没有' + MST_LABEL[Number(libLetterMst)] + '的词') + '</div>') +
    '</div>';

  /* 从字母墙飞进来时徽章要等落地才现身；在详情层里换分类时它已经在台上，保持可见 */
  if(keepBadge){
    const badge = document.getElementById('libBadge');
    if(badge) badge.style.visibility = 'visible';
    /* 换分类后重排的词卡直接入场，不必再等飞行动画那一拍 */
    detail.querySelectorAll('.w-card').forEach((el, i) => {
      el.style.animationDelay = (i * 24) + 'ms';
      el.classList.add('in');
    });
  }

  /* 标本牌就是返回键：招牌左边那道折线箭头是它，点整块牌子也一样翻回去 */
  document.getElementById('libBadge').addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    closeLibLetter();
  });
  document.getElementById('libBadge').addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); e.stopPropagation();
    closeLibLetter();
  });
  document.getElementById('libBulk').addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    queueLibLetter(L, shown);
  });
  /* 本字母内的分类：只重排这一组的词卡，不离开详情层 */
  document.getElementById('libDetailMst').addEventListener('click', (e) => {
    const chip = e.target.closest('.m-chip');
    if(!chip) return;
    e.preventDefault(); e.stopPropagation();
    if(chip.dataset.lmst === libLetterMst) return;
    libLetterMst = chip.dataset.lmst;
    renderLibDetail(L, list, hex, true);
  });
  detail.querySelectorAll('.w-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const w = shown.find(x => x.word === card.dataset.word);
      if(w) location.href = '../' + w.file;
    });
  });
}

/* 不受 transform 影响的布局矩形：方块按下时的 scale(.92) 不会污染起点 */
function libRect(el){
  const r = el.getBoundingClientRect();
  const w = el.offsetWidth || r.width, h = el.offsetHeight || r.height;
  return {left:r.left + r.width / 2 - w / 2, top:r.top + r.height / 2 - h / 2, width:w, height:h};
}

/* 飞行动画：搬的是字形本体（内联 SVG），起落两端都取字形的真实盒子，
   缩放由外层统一做，克隆体自己保留原字形的倾斜/拉伸，落地不会变形 */
function libFly(fromRect, toRect, L, hex, fromEl, toEl){
  const srcG = fromEl.querySelector ? fromEl.querySelector('.gl') : null;
  const dstG = toEl.querySelector ? toEl.querySelector('.gl') : null;
  if(!srcG || !dstG) return null;

  const sR = srcG.getBoundingClientRect(), dR = dstG.getBoundingClientRect();
  const sCS = getComputedStyle(srcG), dCS = getComputedStyle(dstG);
  /* 未变形的布局盒：CSS 变体（拉伸/镜像）留在克隆体上，外层只做位移动画 */
  const lw = srcG.offsetWidth || Math.round(sR.width);
  const lh = srcG.offsetHeight || Math.round(sR.height);

  /* 反白字(S)无论在哪一侧都是墨块白字，飞行途中不跟着换色 */
  const inverse = libFaceKey(L) === 's';
  const f = document.createElement('div');
  f.className = 'flyer';
  f.dataset.style = libFaceKey(L);
  f.style.color = inverse ? '#20242A' : sCS.color;
  f.style.left = (sR.left + sR.width / 2 - lw / 2) + 'px';
  f.style.top = (sR.top + sR.height / 2 - lh / 2) + 'px';
  f.style.width = lw + 'px';
  f.style.height = lh + 'px';

  const c = srcG.cloneNode(true);
  c.style.width = lw + 'px';
  c.style.height = lh + 'px';
  c.style.boxSizing = 'border-box';
  f.appendChild(c);
  document.body.appendChild(f);

  const dx = (dR.left + dR.width / 2) - (sR.left + sR.width / 2);
  const dy = (dR.top + dR.height / 2) - (sR.top + sR.height / 2);
  const sx = dR.width / sR.width, sy = dR.height / sR.height;
  const ease = 'cubic-bezier(.22,.61,.36,1)';

  requestAnimationFrame(() => {
    f.style.transition = 'transform .38s ' + ease + ',color .3s ease';
    f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    /* 颜色只写 color：字形填充、描边、点阵都跟着 currentColor 一起过渡 */
    if(!inverse) f.style.color = dCS.color;
  });
  return f;
}

/* 等 transform 真正到终点再交接，避免提前一帧造成落点错位 */
function libFlyEnd(f, done){
  if(!f){ done(); return; }
  let fired = false;
  const fire = () => { if(fired) return; fired = true; done(); };
  f.addEventListener('transitionend', (e) => { if(e.propertyName === 'transform') fire(); });
  setTimeout(fire, 480);
}

/* 详情层顶到外面那行分类条的位置：上沿和那一行齐平，
   打开后那一行就被同一张白纸盖住，位置正好交还给顶部条里的索引条；
   再往上就压到搜索框的下边缘了，所以只到这一行为止 */
function libDetailTopAtMst(detail){
  const row = document.getElementById('libMst');
  const stage = detail.parentElement;
  if(!row || !stage) return;
  detail.style.top = (row.getBoundingClientRect().top - stage.getBoundingClientRect().top) + 'px';
}

/* 外面那行分类条在详情层展开时让位：同一块地方只留一层芯片，不做两层叠加 */
function libMstAway(away){
  const row = document.getElementById('libMst');
  if(row) row.classList.toggle('away', !!away);
}

function openLibLetter(L){
  if(libAnimating) return;
  const grid = document.getElementById('libGrid');
  const detail = document.getElementById('libDetail');
  const src = grid.querySelector('[data-letter="' + L + '"]');
  if(!src) return;
  /* 翻开的是这个字母自己的一页：只跟当前关键词走，不套外面那行的分类 */
  const list = libLetterWords(L);
  if(!list.length) return;
  libAnimating = true;
  libCurrent = L;
  libLetterMst = 'all';     /* 每次翻开都从「全部」看起 */
  const hex = libGroupColor(libGroups.get(L) || list);

  const fromRect = libRect(src);
  src.classList.add('hide');
  grid.classList.add('fade-out');
  /* 外面那行和字母墙一起退场：180ms 内淡干净，早于详情层的淡入，两层不会撞在一起 */
  libMstAway(true);

  renderLibDetail(L, list, hex);
  detail.classList.add('show');
  detail.style.opacity = '0';
  libDetailTopAtMst(detail);
  const badge = document.getElementById('libBadge');
  const toRect = libRect(badge);

  const f = libFly(fromRect, toRect, L, hex, src, badge);

  /* 快落地时卡片层先淡入，落地那一刻再显出徽章，交接不闪 */
  setTimeout(() => {
    if(!libCurrent || libCurrent !== L) return;
    detail.style.transition = 'opacity .26s ease';
    detail.style.opacity = '1';
    detail.querySelectorAll('.w-card').forEach((el, i) => {
      el.style.animationDelay = (i * 24) + 'ms';
      el.classList.add('in');
    });
  }, 210);

  libFlyEnd(f, () => {
    if(!libCurrent || libCurrent !== L) return;
    f.remove();
    badge.style.visibility = 'visible';
    libAnimating = false;
  });
}

function closeLibLetter(){
  if(libAnimating || !libCurrent) return;
  const L = libCurrent;
  const list = libGroups.get(L);
  if(!list){ hardCloseLib(); return; }
  const grid = document.getElementById('libGrid');
  const detail = document.getElementById('libDetail');
  const badge = document.getElementById('libBadge');
  const src = grid.querySelector('[data-letter="' + L + '"]');
  if(!badge || !src){ hardCloseLib(); return; }

  libAnimating = true;
  const hex = libGroupColor(list);
  const fromRect = libRect(badge);
  /* 目标和网格一起回场：飞行途中就能看到落点，落地时不会出现空位或整屏跳变 */
  src.classList.remove('hide');
  grid.classList.remove('fade-out');
  const toRect = libRect(src);
  badge.style.visibility = 'hidden';
  detail.style.transition = 'opacity .2s ease';
  detail.style.opacity = '0';
  /* 等这一页淡干净再把外面那行放回来，中间不会出现两层芯片 */
  setTimeout(() => {
    if(libCurrent) libMstAway(false);
  }, 200);

  const f = libFly(fromRect, toRect, L, hex, badge, src);
  libFlyEnd(f, hardCloseLib);
}

function hardCloseLib(){
  document.querySelectorAll('.flyer').forEach(el => el.remove());
  const detail = document.getElementById('libDetail');
  if(detail){
    detail.classList.remove('show');
    detail.innerHTML = '';
    detail.dataset.style = '';
    detail.style.opacity = '';
    detail.style.transition = '';
    detail.style.top = '';
  }
  const grid = document.getElementById('libGrid');
  if(grid){
    grid.classList.remove('fade-out');
    grid.querySelectorAll('.spec.hide').forEach(el => el.classList.remove('hide'));
  }
  libMstAway(false);
  libCurrent = null;
  libAnimating = false;
}

/* 刷这一组：临时替换刷词队列，不写全局进度存档 */
function queueWords(label, list){
  if(!list || !list.length || animating) return;
  if(!deckScoped) deckBackup = {queue: queue.slice(), pos: pos, undoSnap: undoSnap, label: deckScopeLabel};
  deckScoped = true;
  deckScopeLabel = label;
  queue = libSorted(list);
  pos = 0;
  undoSnap = null;
  hardCloseLib();
  renderDeckShell();
  switchTab('deck');
  toast('已切到 ' + label + ' · ' + queue.length + ' 个词');
}

/* ------------------------------------------------------------
   首字母球阵：向上漂的浮力球
   向上有浮力，撞边界/彼此轻弹，可以抓起甩出去，松手继续往上飘。
   只在面板打开时跑 rAF，收起立刻停，不白耗电。
   ------------------------------------------------------------ */
const BALL_G = -150;      /* 浮力加速度 px/s²（负值向上） */
const BALL_DAMP = .45;    /* 速度半衰：每秒保留比例，越小越快停 */
const BALL_WALL = .45;    /* 撞墙保留速度 */
const BALL_PAIR = .30;    /* 球撞球保留速度 */
const BALL_STEP = 1 / 60;

let ballScene = null;

function ballSceneInit(){
  ballSceneStop();
  const stage = document.getElementById('letterStage');
  if(!stage){ ballScene = null; return; }
  const w = stage.clientWidth || 320;
  const h = stage.clientHeight || 196;
  const els = Array.from(stage.querySelectorAll('.letter-tile'));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const balls = els.map((el, i) => {
    const r = el.offsetWidth / 2 || 24;
    const b = {
      el, r, m: r * r, x: 0, y: 0, vx: 0, vy: 0, held: false,
      phase: Math.random() * Math.PI * 2
    };
    if(reduce){
      /* 减少动效：直接摆成整齐几行，不再跑物理 */
      const cols = Math.max(1, Math.floor((w + 7) / (r * 2 + 7)));
      b.x = r + (i % cols) * (r * 2 + 7);
      b.y = r + Math.floor(i / cols) * (r * 2 + 7);
    }else{
      /* 从底部一片区域里出发，浮上来 */
      b.x = r + Math.random() * Math.max(1, w - r * 2);
      b.y = h - r - Math.random() * (h * .6);
      b.vx = (Math.random() - .5) * 60;
      b.vy = -50 - Math.random() * 80;
    }
    return b;
  });
  /* 随机落点会叠在一起，先就地推开再开始浮：开局不会有一团球黏在一起 */
  if(!reduce) ballSceneSettle(balls, w, h);
  ballScene = {
    stage, w, h, balls, raf: 0, last: 0, acc: 0, t: 0,
    held: null, gx: 0, gy: 0, lx: 0, ly: 0, lt: 0, svx: 0, svy: 0, moved: false
  };
  if(!stage.__ballBound){ ballSceneBind(stage); stage.__ballBound = true; }
  ballSceneRender();
  if(!reduce) ballSceneStart();
}

/* 开局把叠在一起的球就地推开（只修正位置，不加冲量） */
function ballSceneSettle(balls, w, h){
  for(let it = 0; it < 16; it++){
    for(let i = 0; i < balls.length; i++){
      const a = balls[i];
      for(let j = i + 1; j < balls.length; j++){
        const b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if(d2 >= rr * rr) continue;
        let d = Math.sqrt(d2);
        if(d < .001){ dx = 1; dy = 0; d = 1; }
        const nx = dx / d, ny = dy / d;
        const pen = (rr - Math.sqrt(d2)) * .5;
        a.x -= nx * pen; a.y -= ny * pen;
        b.x += nx * pen; b.y += ny * pen;
        a.x = Math.max(a.r, Math.min(w - a.r, a.x));
        a.y = Math.max(a.r, Math.min(h - a.r, a.y));
        b.x = Math.max(b.r, Math.min(w - b.r, b.x));
        b.y = Math.max(b.r, Math.min(h - b.r, b.y));
      }
    }
  }
}

function ballSceneBind(stage){
  stage.addEventListener('pointerdown', e => {
    const s = ballScene; if(!s) return;
    const el = e.target.closest('.letter-tile'); if(!el) return;
    const b = s.balls.find(x => x.el === el); if(!b) return;
    const rect = stage.getBoundingClientRect();
    b.held = true; s.held = b; s.moved = false;
    s.gx = e.clientX - rect.left - b.x;
    s.gy = e.clientY - rect.top - b.y;
    s.lx = e.clientX; s.ly = e.clientY; s.lt = performance.now();
    s.svx = 0; s.svy = 0;
    el.classList.add('dragging');
    ballSceneStart();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });

  stage.addEventListener('pointermove', e => {
    const s = ballScene; if(!s || !s.held) return;
    const b = s.held;
    const rect = stage.getBoundingClientRect();
    const nx = Math.max(b.r, Math.min(s.w - b.r, e.clientX - rect.left - s.gx));
    const ny = Math.max(b.r, Math.min(s.h - b.r, e.clientY - rect.top - s.gy));
    /* 带时间窗指数平滑：甩出去才有手感，又不会飞得太夸张 */
    const now = performance.now();
    const dtp = Math.max(1, now - s.lt) / 1000;
    s.svx = s.svx * .55 + ((e.clientX - s.lx) / dtp) * .45;
    s.svy = s.svy * .55 + ((e.clientY - s.ly) / dtp) * .45;
    s.lx = e.clientX; s.ly = e.clientY; s.lt = now;
    if(Math.abs(nx - b.x) + Math.abs(ny - b.y) > 2) s.moved = true;
    b.x = nx; b.y = ny; b.vx = 0; b.vy = 0;
    ballSceneRender();
  });

  const release = () => {
    const s = ballScene; if(!s || !s.held) return;
    const b = s.held;
    s.held = null; b.held = false;
    b.el.classList.remove('dragging');
    const cap = 1600;
    b.vx = Math.max(-cap, Math.min(cap, s.svx * .85));
    b.vy = Math.max(-cap, Math.min(cap, s.svy * .85));
    /* 甩到容器外先拉回来 */
    if(b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx) * .4; }
    if(b.x + b.r > s.w){ b.x = s.w - b.r; b.vx = -Math.abs(b.vx) * .4; }
    if(b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy) * .4; }
    if(b.y + b.r > s.h){ b.y = s.h - b.r; b.vy = -Math.abs(b.vy) * .4; }
  };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);

  /* 拖动结束的那一下不算「选牌组」；轻点才算 */
  stage.addEventListener('click', e => {
    const s = ballScene; if(!s) return;
    if(s.moved){ e.preventDefault(); e.stopPropagation(); s.moved = false; }
  }, true);
}

function ballSceneStep(dt){
  const s = ballScene; if(!s) return;
  const damp = Math.pow(BALL_DAMP, dt);
  /* 贴边：撞到四壁按 BALL_WALL 弹回，并把球推回框内 */
  const walls = () => {
    for(const b of s.balls){
      if(b.held) continue;
      if(b.x - b.r < 0){ b.x = b.r; if(b.vx < 0) b.vx = -b.vx * BALL_WALL; }
      if(b.x + b.r > s.w){ b.x = s.w - b.r; if(b.vx > 0) b.vx = -b.vx * BALL_WALL; }
      if(b.y - b.r < 0){ b.y = b.r; if(b.vy < 0) b.vy = -b.vy * BALL_WALL; }
      if(b.y + b.r > s.h){ b.y = s.h - b.r; if(b.vy > 0) b.vy = -b.vy * BALL_WALL; }
    }
  };
  for(const b of s.balls){
    if(b.held) continue;
    b.vy += BALL_G * dt;
    /* 缓慢横向摇摆：让贴在顶上的球也一直轻轻挪动，不显得死板 */
    b.vx += Math.sin(s.t * .9 + b.phase) * 30 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= damp;
    b.vy *= damp;
  }
  walls();
  /* 球与球：位置修正 + 冲量，质量按半径平方，大球推小球 */
  for(let it = 0; it < 2; it++){
    for(let i = 0; i < s.balls.length; i++){
      const a = s.balls[i];
      for(let j = i + 1; j < s.balls.length; j++){
        const b = s.balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if(d2 >= rr * rr) continue;
        const d = Math.sqrt(d2);
        /* 完全重合时法线取不到，给一个默认方向，否则这对球永远分不开 */
        let nx = 1, ny = 0;
        if(d > .001){ nx = dx / d; ny = dy / d; }
        const pen = rr - d;
        const ia = a.held ? 0 : 1 / a.m;
        const ib = b.held ? 0 : 1 / b.m;
        if(ia + ib > 0){
          const tot = ia + ib;
          if(ia > 0){ a.x -= nx * pen * (ia / tot) * .7; a.y -= ny * pen * (ia / tot) * .7; }
          if(ib > 0){ b.x += nx * pen * (ib / tot) * .7; b.y += ny * pen * (ib / tot) * .7; }
        }
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if(vn >= 0 || ia + ib === 0) continue;
        const J = (1 + BALL_PAIR) * vn / (ia + ib);
        if(ia > 0){ a.vx += J * nx * ia; a.vy += J * ny * ia; }
        if(ib > 0){ b.vx -= J * nx * ib; b.vy -= J * ny * ib; }
      }
    }
  }
  /* 挤在一起的球会被推得穿出边界，再贴一次边，别让球压到框外 */
  walls();
}

function ballSceneRender(){
  const s = ballScene; if(!s) return;
  for(const b of s.balls){
    b.el.style.transform = 'translate3d(' + (b.x - b.r) + 'px,' + (b.y - b.r) + 'px,0)';
  }
}

function ballSceneFrame(now){
  const s = ballScene; if(!s) return;
  if(!deckPickOpen){ s.raf = 0; return; }   /* 面板收起就停 */
  if(!s.last) s.last = now;
  let dt = (now - s.last) / 1000;
  s.last = now;
  if(dt > .1) dt = .1;
  s.acc += dt; s.t += dt;
  let guard = 0;
  while(s.acc >= BALL_STEP && guard < 4){ ballSceneStep(BALL_STEP); s.acc -= BALL_STEP; guard++; }
  if(s.acc > BALL_STEP) s.acc = 0;
  ballSceneRender();
  s.raf = requestAnimationFrame(ballSceneFrame);
}

function ballSceneStart(){
  const s = ballScene; if(!s || s.raf) return;
  s.last = 0; s.acc = 0;
  s.raf = requestAnimationFrame(ballSceneFrame);
}
function ballSceneStop(){
  const s = ballScene; if(!s || !s.raf) return;
  cancelAnimationFrame(s.raf); s.raf = 0;
}

/* 面板内容提前渲染好（面板此时是隐藏的），点开时只切类，省掉打开瞬间的排版 */
function deckPickPrebuild(){
  const box = document.getElementById('deckPick');
  if(!box) return;
  box.innerHTML = deckPickHtml();
  deckPickDirty = false;
}

/* 面板打开时压一条历史记录：手机的返回键就能把面板收回去。
   用自己点遮罩/选牌组关掉时再退掉这条记录，不留空条目 */
function pushPickHistory(){
  if(pickHistory) return;
  try{ history.pushState({ deckPick: 1 }, ''); pickHistory = true; }catch(e){}
}
function popPickHistory(){
  if(!pickHistory) return;
  pickHistory = false;
  pickIgnorePop++;   /* 这次后退是我们自己发的，popstate 里不要再去关一次 */
  try{ history.back(); }catch(e){}
}

function closeDeckPick(){
  const wasOpen = deckPickOpen;
  deckPickOpen = false;
  const stage = document.getElementById('deckStage');
  const btn = document.getElementById('deckScope');
  if(stage) stage.classList.remove('pick-open');
  if(btn){
    btn.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }
  if(wasOpen) popPickHistory();
  ballSceneStop();
}

function toggleDeckPick(){
  const box = document.getElementById('deckPick');
  const btn = document.getElementById('deckScope');
  const stage = document.getElementById('deckStage');
  if(!box || !btn || !stage) return;
  if(deckPickOpen){ closeDeckPick(); sfxPlay('panelClose'); return; }
  if(deckPickDirty || !box.firstElementChild){
    box.innerHTML = deckPickHtml();
    deckPickDirty = false;
  }
  syncMiniCard();
  box.scrollTop = 0;
  deckPickOpen = true;
  pushPickHistory();
  ballSceneInit();
  ballSceneStart();
  btn.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
  sfxPlay('panelOpen');
  /* 先让面板安静地排完版，下一帧再起过渡：开头就不会顿一下 */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if(!deckPickOpen) return;
    stage.classList.add('pick-open');
  }));
}

/* 选中某个牌组：从头开始刷这一组 */
function pickDeck(key){
  if(animating) return;
  closeDeckPick();
  sfxPlay('pick');
  if(key === 'all'){
    deckScoped = false;
    deckBackup = null;
    deckScopeLabel = '';
    queue = buildQueue();
    pos = 0;
    undoSnap = null;
    savePos();
    renderDeckShell();
    return;
  }
  if(key === 'review'){ startReviewToday(); return; }
  const kind = key.charAt(0);
  if(kind === 'm'){
    const lv = Number(key.slice(1));
    const list = WORDS.filter(w => masteryOf(w.word) === lv);
    if(!list.length){ toast(MST_LABEL[lv] + ' 还没有词'); return; }
    queueWords(MST_LABEL[lv], list);
    return;
  }
  if(kind === 'l'){
    const L = key.slice(1);
    const list = WORDS.filter(w => (w.word[0] || '#').toUpperCase() === L);
    if(!list.length){ toast('没有 ' + L + ' 开头的词'); return; }
    queueWords(L + ' 组', list);
  }
}

/* 字母方块里的「刷这组」 */
function queueLibLetter(L, list){
  queueWords(L + ' 组', list);
}

/* 按当前筛选（关键词 + 掌握度）整批刷 */
function queueLibMst(){
  const list = libSorted(libMstWords(libFilter));
  if(!list.length) return;
  const label = libMst === 'all'
    ? (libFilter ? '含 “' + libFilter + '”' : '全部词')
    : MST_LABEL[Number(libMst)];
  queueWords(label, list);
}

/* 复习今天刷过的：把今天已评分的词按掌握度重排一遍（掌握度照常更新） */
function startReviewToday(){
  if(animating) return;
  const rated = ratedToday();
  const list = WORDS.filter(w => rated.has(w.word));
  if(!list.length){ toast('今天还没有刷过的词'); return; }
  deckScoped = false;
  deckBackup = null;
  deckScopeLabel = '今天复习';
  queue = libSorted(list);
  pos = 0;
  undoSnap = null;
  savePos();
  renderDeckShell();
  toast('复习今天刷过的 ' + queue.length + ' 个词');
}

/* 退出分组：原样回到进入前那张 */
function exitDeckScope(){
  if(!deckScoped || animating) return;
  if(deckBackup){
    queue = deckBackup.queue;
    pos = deckBackup.pos;
    undoSnap = deckBackup.undoSnap;
    deckScopeLabel = deckBackup.label || '';   /* 回到进入分组前的卡组名 */
  } else {
    /* 兜底：没有备份时按今天的存档重建 */
    const restored = restoreQueue();
    queue = restored.queue;
    pos = restored.pos;
    undoSnap = null;
    deckScopeLabel = restored.label || '';
  }
  deckBackup = null;
  deckScoped = false;
  renderDeckShell();
  toast('已回到 ' + (deckScopeLabel || '全部单词'));
}

/* 再刷一遍这组：位置归零，词序不变 */
function replayDeckScope(){
  if(!deckScoped || animating) return;
  pos = 0;
  undoSnap = null;
  renderDeckShell();
  toast('再刷一遍 ' + deckScopeLabel);
}

/* ============================================================
   自测：从 q 字段抽 10 题，判题规则与 index.html 完全一致
   ============================================================ */
let quizBuilt = false;
const quiz = {list:[], idx:0, right:0, wrong:0, answered:false};

function quizStat(){
  return Object.assign({rounds:0, total:0, right:0}, loadJSON(QUIZ_KEY, {}));
}
function quizNorm(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function quizPool(){
  const out = [];
  WORDS.forEach(w => {
    (w.q || []).forEach(item => {
      if(item && item.q && item.a) out.push({word:w.word, q:item.q, a:item.a, h:item.h || ''});
    });
  });
  return out;
}
function startQuiz(){
  quiz.list = shuffle(quizPool()).slice(0, 10);
  quiz.idx = 0; quiz.right = 0; quiz.wrong = 0; quiz.answered = false;
  renderQuizQuestion();
}

function renderQuiz(){
  const view = document.getElementById('view-quiz');
  if(!quizBuilt){
    quizBuilt = true;
    view.innerHTML = '<div class="quiz-wrap">' +
        '<div class="quiz-head"><span id="quizProg">首字母填空</span><span>✓ <b id="quizRight">0</b>　✗ <b id="quizWrong">0</b></span></div>' +
        '<div id="quizBody"></div></div>';
  }
  if(!quiz.list.length) startQuiz();
}

function renderQuizQuestion(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  if(quiz.idx >= quiz.list.length){ renderQuizResult(); return; }
  const item = quiz.list[quiz.idx];
  quiz.answered = false;
  const prog = document.getElementById('quizProg');
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(prog) prog.textContent = '第 ' + (quiz.idx + 1) + ' / ' + quiz.list.length + ' 题';
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">首字母填空 · ' + item.word + '</span>' +
      '<p class="q-sentence">' + item.q + '</p>' +
      '<input class="q-input" id="qInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="补全空格处的字母…" aria-label="补全空格">' +
      (item.h ? '<button class="q-btn ghost" type="button" data-hint style="margin-top:.5rem;font-size:.68rem;padding:.3rem .7rem;">看提示</button>' +
                '<p class="q-hint" id="qHint" hidden>' + item.h + '</p>' : '') +
      '<div class="q-foot"><span class="q-feed" id="qFeed"></span>' +
        '<button class="q-btn" type="button" id="qSubmit">检查</button></div>' +
    '</div>';
  const input = document.getElementById('qInput');
  if(input){
    /* 触屏设备不自动聚焦，避免切到自测就弹键盘；桌面键盘/鼠标环境才自动聚焦 */
    if(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches) input.focus();
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); quiz.answered ? quizNext() : quizCheck(); }
    });
  }
}

function quizCheck(){
  if(quiz.answered) return;
  const input = document.getElementById('qInput');
  const item = quiz.list[quiz.idx];
  if(!input || !item) return;
  const val = quizNorm(input.value);
  if(!val){ input.focus(); return; }
  quiz.answered = true;

  const first = (item.q.match(/class="first-letter">([^<]*)</) || ['', ''])[1];
  const ok = val === quizNorm(item.a)
          || val === quizNorm(item.word)
          || val === quizNorm(first + item.a);
  if(ok) quiz.right++; else quiz.wrong++;

  const blank = document.querySelector('#quizBody .qz-blank');
  if(blank){ blank.textContent = item.a; blank.classList.add('on'); }
  input.disabled = true;

  const hint = document.getElementById('qHint');
  if(hint) hint.hidden = false;

  const fb = document.getElementById('qFeed');
  if(fb){
    fb.className = 'q-feed ' + (ok ? 'right' : 'wrong');
    fb.textContent = ok ? '✓ 正确' : '✗ 正确答案：' + item.a;
  }
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;

  const btn = document.getElementById('qSubmit');
  btn.textContent = quiz.idx + 1 >= quiz.list.length ? '看结果' : '下一题';
  btn.classList.add('ghost');
  btn.focus();
}

function quizNext(){
  quiz.idx++;
  if(quiz.idx >= quiz.list.length) renderQuizResult();
  else renderQuizQuestion();
}

function renderQuizResult(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  const total = quiz.right + quiz.wrong;
  const rate = total ? Math.round(quiz.right / total * 100) : 0;
  const stat = quizStat();
  stat.rounds += 1; stat.total += total; stat.right += quiz.right;
  persist(QUIZ_KEY, stat);
  const hist = stat.total ? Math.round(stat.right / stat.total * 100) : 0;
  const prog = document.getElementById('quizProg');
  if(prog) prog.textContent = '本轮完成';
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">本轮完成</span>' +
      '<p class="q-result-num">' + quiz.right + ' / ' + total + '</p>' +
      '<p class="q-result-sub">正确率 ' + rate + '% · 累计 ' + stat.right + ' / ' + stat.total +
        '（' + hist + '%，共 ' + stat.rounds + ' 轮）</p>' +
      '<div class="q-actions"><button class="q-btn ghost" type="button" data-quiz-back>回刷词</button>' +
        '<button class="q-btn" type="button" data-quiz-again>再来一轮</button></div>' +
    '</div>';
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* 贡献墙：近 26 周，每列一周、每格一天；颜色深浅按当天刷词量 */
const CW_WEEKS = 26;
const CW_STEP = 13; /* 10px 方块 + 3px 间隔 */
function cwLevel(n){
  if(!n) return 0;
  if(n < 5) return 1;
  if(n < 10) return 2;
  if(n < 20) return 3;
  return 4;
}
function renderWall(){
  const host = document.getElementById('cwGrid');
  if(!host) return;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - (CW_WEEKS - 1) * 7);
  const todayK = keyOf(today);
  let cells = '', active = 0, total = 0;
  const marks = [];
  let lastMonth = -1, lastCol = -99;
  for(let c = 0; c < CW_WEEKS; c++){
    const col = new Date(start);
    col.setDate(start.getDate() + c * 7);
    const mth = col.getMonth();
    /* 月份标：同月只在首次出现处标一次，且与上一个标至少隔 3 列 */
    if(mth !== lastMonth && c - lastCol >= 3){
      marks.push({col: c, label: String(mth + 1) + '月'});
      lastMonth = mth; lastCol = c;
    }
    for(let r = 0; r < 7; r++){
      const d = new Date(start);
      d.setDate(start.getDate() + c * 7 + r);
      if(d > today){ cells += '<i class="cw-cell future"></i>'; continue; }
      const k = keyOf(d);
      const n = mb.days[k] || 0;
      if(n){ active++; total += n; }
      cells += '<i class="cw-cell lv' + cwLevel(n) + (k === todayK ? ' today' : '') +
          '" data-day="' + k + '" data-n="' + n + '" title="' + k + ' · ' + n + ' 个"></i>';
    }
  }
  host.innerHTML = cells;
  const monthHost = document.getElementById('cwMonths');
  if(monthHost){
    monthHost.style.width = (CW_WEEKS * CW_STEP - 3) + 'px';
    monthHost.innerHTML = marks.map(m =>
      '<span style="left:' + (m.col * CW_STEP) + 'px">' + m.label + '</span>').join('');
  }
  const sum = document.getElementById('cwSum');
  if(sum) sum.innerHTML = '共 <b>' + active + '</b> 天 · <b>' + total + '</b> 次';
  const scroller = document.getElementById('cwScroll');
  if(scroller) scroller.scrollLeft = scroller.scrollWidth; /* 默认停在最近这一周 */
}

function refreshHeader(){
  const today = todayCount();
  const num = document.getElementById('todayNum');

  if(num) num.textContent = today;
  if(fill) fill.style.width = Math.min(100, today / GOAL * 100) + '%';

      : today >= GOAL ? '今日达成 · 继续也不亏'
      : '再刷 ' + (GOAL - today) + ' 个就收工';
  }
  renderWall();
}

/* ============================================================
   导航与交互（每个容器只绑定一次）
   ============================================================ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById('view-' + name);
  if(view) view.classList.add('active');
  if(name === 'lib'){
    renderLib();
    /* 从别的页回到字母墙，从第一张样本看起 */
    const lg = document.getElementById('libGrid');
    if(lg) lg.scrollTop = 0;
  }
  if(name === 'quiz') renderQuiz();
  if(name === 'stat') renderStat();
  if(name !== 'lib') hardCloseLib();
  const main = document.querySelector('.main');
  if(main){
    main.scrollTop = 0;
    main.classList.toggle('lib-on', name === 'lib');
  }
  syncKeyboardBar();
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* 贡献墙：点一格看当天的刷词记录 */
document.getElementById('view-stat').addEventListener('click', (e) => {
  const cell = e.target.closest('.cw-cell[data-day]');
  if(!cell) return;
  const n = Number(cell.dataset.n || 0);
  const p = cell.dataset.day.split('-');
  toast(Number(p[1]) + '月' + Number(p[2]) + '日 · ' + (n ? '刷了 ' + n + ' 个词' : '没有记录'));
});

/* 刷词：朗读 / 三档反馈 / 重开一轮 / 点按翻面 */
document.getElementById('view-deck').addEventListener('click', (e) => {
  if(suppressTap){ suppressTap = false; return; }
  if(spellSuppressTap){ spellSuppressTap = false; return; }
  if(e.target.closest('#deckScope')){
    e.preventDefault(); e.stopPropagation();
    toggleDeckPick();
    return;
  }
  if(e.target.closest('#deckMini') || e.target.closest('#deckMask')){
    e.preventDefault(); e.stopPropagation();
    if(deckPickOpen){ closeDeckPick(); sfxPlay('panelClose'); }
    return;
  }
  const dChip = e.target.closest('[data-deck]');
  if(dChip){
    e.preventDefault(); e.stopPropagation();
    pickDeck(dChip.dataset.deck);
    return;
  }
  if(e.target.closest('#deckPick')) return; /* 面板留白处不翻面 */
  const undoBtn = e.target.closest('#undoBtn');
  if(undoBtn){
    e.preventDefault(); e.stopPropagation();
    undoLast();
    return;
  }
  if(e.target.closest('#scopeExitBtn') || e.target.closest('[data-scope-exit]')){
    e.preventDefault(); e.stopPropagation();
    exitDeckScope();
    return;
  }
  if(e.target.closest('[data-scope-again]')){
    e.preventDefault(); e.stopPropagation();
    replayDeckScope();
    return;
  }
  const rateBtn = e.target.closest('[data-rate]');
  if(rateBtn){
    e.preventDefault(); e.stopPropagation();
    rateBtn.classList.add('stamp');
    rateBtn.addEventListener('animationend', () => rateBtn.classList.remove('stamp'), {once:true});
    advance(Number(rateBtn.dataset.rate));
    return;
  }
  if(e.target.closest('#sfxBtn')) return; /* 音效开关交给 document 级委托，不参与翻面 */
  if(e.target.closest('#hideGlossBtn')) return; /* 遮住答案开关同样走 document 级委托 */
  if(e.target.closest('[data-review]')){
    e.preventDefault(); e.stopPropagation();
    startReviewToday();
    return;
  }
  const tabGo = e.target.closest('[data-tabgo]');
  if(tabGo){
    e.preventDefault(); e.stopPropagation();
    switchTab(tabGo.dataset.tabgo);
    return;
  }
  const restart = e.target.closest('[data-restart]');
  if(restart){ e.preventDefault(); deckScoped = false; deckBackup = null; deckScopeLabel = ''; queue = buildQueue(true); pos = 0; savePos(); undoSnap = null; renderDeckShell(); return; }
  const sp = e.target.closest('[data-speak]');
  if(sp){
    e.preventDefault(); e.stopPropagation();
    const card = sp.closest('.swipe-card');
    speakWord(card ? card.dataset.word : '', sp);
    return;
  }
  if(e.target.closest('.mini-card')) return; /* 词卡链接照常跳转 */
  const sTile = e.target.closest('.spell-tile');
  if(sTile){
    e.preventDefault(); e.stopPropagation();
    const box = sTile.closest('.spell-block');
    if(box && box.dataset.solved !== '1'){
      if(sTile.closest('.spell-slot')) moveTileToTray(sTile);
      else {
        const slot = box.querySelector('.spell-slot:not(.filled)');
        if(slot) moveTileToSlot(sTile, slot);
      }
    }
    return;
  }
  if(e.target.closest('.spell-slot')){ e.preventDefault(); e.stopPropagation(); return; }
  if(e.target.closest('[data-flip]')){ e.preventDefault(); e.stopPropagation(); }
  const card = e.target.closest('.swipe-card');
  if(card){ card.classList.toggle('flipped'); sfxPlay('flip'); }
});

/* 点面板与卡组名以外的地方，收起牌组选择 */
document.addEventListener('click', (e) => {
  if(!deckPickOpen) return;
  if(e.target.closest('#deckPick') || e.target.closest('#deckScope')) return;
  closeDeckPick();
});

/* ============================================================
   背面拼写：单词有几个字母就几个格子，下方字母块拖动/点按排布
   ============================================================ */
let spellSuppressTap = false;
let spellDrag = null;

function shuffleWord(word){
  const a = word.split('');
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  if(a.join('') === word && a.length > 1){
    const t = a[0]; a[0] = a[1]; a[1] = t;
  }
  return a;
}

function spellBlockHtml(word){
  const w = word.toLowerCase();
  const n = w.length;
  /* 一行最多 7 个格子，超过就折行且各行尽量均分（11 个 → 6+5） */
  const rows = Math.ceil(n / 7);
  const cols = Math.ceil(n / rows);
  const slotArr = Array.from({length: n}, () => '<span class="spell-slot"></span>');
  let slotHtml = '';
  for(let i = 0; i < n; i += cols){
    slotHtml += '<div class="spell-row">' + slotArr.slice(i, i + cols).join('') + '</div>';
  }
  const tiles = shuffleWord(w).map((ch) =>
    '<button class="spell-tile" type="button" data-ch="' + esc(ch) + '">' + esc(ch) + '</button>'
  ).join('');
  return '<div class="spell-slots">' + slotHtml + '</div>' +
    '<div class="spell-tiles">' + tiles + '</div>' +
    '<p class="fill-msg" role="status"></p>';
}

function syncSpellSlots(box){
  box.querySelectorAll('.spell-slot').forEach((s) => {
    s.classList.toggle('filled', !!s.querySelector('.spell-tile'));
  });
}

/* 把字母块放进格子：目标格已有字母则交换（来源是托盘时，原字母退回托盘） */
function moveTileToSlot(tile, slot){
  const box = slot && slot.closest('.spell-block');
  if(!box || !tile || box.dataset.solved === '1') return;
  if(slot.querySelector('.spell-tile') === tile) return;
  const fromSlot = tile.closest('.spell-slot');
  const prev = slot.querySelector('.spell-tile');
  if(prev){
    if(fromSlot) fromSlot.appendChild(prev);
    else box.querySelector('.spell-tiles').appendChild(prev);
  }
  slot.appendChild(tile);
  syncSpellSlots(box);
  sfxPlay('drop');
  autoCheckSpell(box);
}

function moveTileToTray(tile){
  const box = tile && tile.closest('.spell-block');
  if(!box || box.dataset.solved === '1') return;
  box.querySelector('.spell-tiles').appendChild(tile);
  syncSpellSlots(box);
  autoCheckSpell(box);
}

function autoCheckSpell(box){
  if(!box || box.dataset.solved === '1') return;
  const word = (box.dataset.spellWord || '').toLowerCase();
  const msg = box.querySelector('.fill-msg');
  const slots = Array.from(box.querySelectorAll('.spell-slot'));
  box.classList.remove('ok', 'bad');
  if(!slots.length || slots.some((s) => !s.querySelector('.spell-tile'))){
    if(msg) msg.textContent = '';
    return;
  }
  const ans = slots.map((s) => s.querySelector('.spell-tile').dataset.ch).join('');
  void box.offsetWidth; /* 重排一次，错误抖动动画可重复触发 */
  if(ans === word){
    box.classList.add('ok');
    box.dataset.solved = '1';
    if(msg) msg.textContent = '✓ 拼写正确 · ' + word;
    sfxPlay('ok');
  } else {
    box.classList.add('bad');
    if(msg) msg.textContent = '✗ 顺序不对 · 再调整一下';
    sfxPlay('bad');
  }
}

function slotAtPoint(x, y, box){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  const slot = el.closest('.spell-slot');
  return (slot && box.contains(slot)) ? slot : null;
}

/* 拖动：按下字母块生成跟随手指的幽灵块，松手落到格子或退回托盘 */
document.addEventListener('pointerdown', (e) => {
  const tile = e.target.closest('.spell-tile');
  if(!tile) return;
  const box = tile.closest('.spell-block');
  if(!box || box.dataset.solved === '1') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const r = tile.getBoundingClientRect();
  const cs = getComputedStyle(tile);
  const ghost = tile.cloneNode(true);
  ghost.classList.add('spell-ghost');
  ghost.classList.remove('dragging');
  ghost.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;display:grid;place-items:center;pointer-events:none;z-index:9999;' +
    'font-family:' + cs.fontFamily + ';font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';line-height:1;' +
    'color:' + cs.color + ';background:' + cs.backgroundColor + ';border:2px solid ' + cs.borderColor + ';border-radius:' + cs.borderRadius + ';' +
    'box-shadow:0 8px 18px -8px rgba(32,36,42,.45);transform:rotate(-3deg);';
  document.body.appendChild(ghost);
  spellDrag = {id:e.pointerId, tile, box, ghost, dx:e.clientX - r.left, dy:e.clientY - r.top, sx:e.clientX, sy:e.clientY, moved:false};
  tile.classList.add('dragging');
});

document.addEventListener('pointermove', (e) => {
  if(!spellDrag || e.pointerId !== spellDrag.id) return;
  const d = spellDrag;
  if(!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 9) d.moved = true;
  if(!d.moved) return;
  e.preventDefault();
  d.ghost.style.left = (e.clientX - d.dx) + 'px';
  d.ghost.style.top = (e.clientY - d.dy) + 'px';
  const slot = slotAtPoint(e.clientX, e.clientY, d.box);
  d.box.querySelectorAll('.spell-slot').forEach((s) => {
    s.classList.toggle('hot', s === slot);
  });
}, {passive:false});

function endSpellDrag(e){
  if(!spellDrag) return;
  if(e && e.pointerId !== undefined && e.pointerId !== spellDrag.id) return;
  const d = spellDrag;
  spellDrag = null;
  d.ghost.remove();
  d.tile.classList.remove('dragging');
  d.box.querySelectorAll('.spell-slot.hot').forEach((s) => s.classList.remove('hot'));
  if(!d.moved) return; /* 没有位移 → 交给 click 处理（点按填格 / 点回收回） */
  spellSuppressTap = true;
  setTimeout(() => { spellSuppressTap = false; }, 90);
  const slot = e ? slotAtPoint(e.clientX, e.clientY, d.box) : null;
  if(slot) moveTileToSlot(d.tile, slot);
  else if(d.tile.closest('.spell-slot')) moveTileToTray(d.tile);
}
document.addEventListener('pointerup', endSpellDrag);
document.addEventListener('pointercancel', endSpellDrag);

/* 手势：上滑跳过 / 右滑认识 / 左滑不认识 / 下滑有点印象 / 点按翻面 */
let dragState = null, suppressTap = false;
const HINT_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>';
const DIR_LABEL = {up:'跳过', right:'认识', left:'不认识', down:'有点印象'};

function hintDir(card, dx, dy){
  const h = card.querySelector('.dir-hint');
  if(!h) return;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax, ay) < 16){ h.classList.remove('show'); return; }
  const dir = ax > ay ? (dx > 0 ? 'right' : 'left') : (dy < 0 ? 'up' : 'down');
  if(h.dataset.dir !== dir){
    h.dataset.dir = dir;
    h.innerHTML = '<span class="dh-ico">' + HINT_ARROW + '</span>' + DIR_LABEL[dir];
  }
  h.classList.add('show');
}
function hideHint(card){
  const h = card.querySelector('.dir-hint');
  if(h) h.classList.remove('show');
}

const deckView = document.getElementById('view-deck');
deckView.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.swipe-card');
  if(!card) return;
  if(e.target.closest('.rate') || e.target.closest('.mini-card') || e.target.closest('.speak') || e.target.closest('[data-flip]')) return;
  /* 背面拼写块的拖动/点按交给 spellDrag 处理，不参与切卡手势 */
  if(e.target.closest('.spell-tile') || e.target.closest('.spell-slot')) return;
  /* 背面：仍记录起点，但只接管水平滑动；垂直方向留给 back-body 原生滚动 */
  const back = card.classList.contains('flipped') && !!e.target.closest('.face.back');
  dragState = {id:e.pointerId, card, x:e.clientX, y:e.clientY, dx:0, dy:0, moved:false, back, fired:false};
  if(!back) card.style.transition = 'none';
});
deckView.addEventListener('pointermove', (e) => {
  if(!dragState || e.pointerId !== dragState.id) return;
  const st = dragState;
  st.dx = e.clientX - st.x;
  st.dy = e.clientY - st.y;
  if(!st.moved && Math.hypot(st.dx, st.dy) > 8) st.moved = true;
  if(!st.moved) return;
  if(st.back){
    /* 背面不做位移反馈，只在横向明显滑动时切卡；纵向交给浏览器滚动 */
    if(!st.fired && Math.abs(st.dx) > Math.abs(st.dy) && Math.abs(st.dx) > 55){
      st.fired = true;
      advance(st.dx > 0 ? 2 : 0, st.dx > 0 ? 'right' : 'left');
    }
    return;
  }
  st.card.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' + (st.dx / 45) + 'deg)';
  hintDir(st.card, st.dx, st.dy);
});
function endDrag(){
  if(!dragState) return;
  const {card, dx, dy, moved, back} = dragState;
  dragState = null;
  if(!back){
    card.style.transition = '';
    card.style.transform = '';
    hideHint(card);
  }
  if(!moved) return; /* 没有位移 → 交给 click 判定为点按翻面 */
  if(back){
    /* 背面有位移就不当点按：横向已切卡，纵向是滚动，都不该翻回正面 */
    suppressTap = true;
    setTimeout(() => { suppressTap = false; }, 80);
    return;
  }
  suppressTap = true;
  setTimeout(() => { suppressTap = false; }, 80);
  const TH = 70;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(ax > ay){
    if(ax > TH) advance(dx > 0 ? 2 : 0, dx > 0 ? 'right' : 'left');
  } else if(ay > TH){
    advance(dy < 0 ? null : 1, dy < 0 ? 'up' : 'down');
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* 手机返回键 / 浏览器后退：面板开着就先收面板，不直接退出页面。
   这条历史记录是我们压的，返回键已经把它吃掉，所以这里只关面板、不再 back() */
window.addEventListener('popstate', () => {
  /* 自己点遮罩/选牌组关闭时退记录，这一次 popstate 不处理，
     否则快速再点开会被它顺手关掉 */
  if(pickIgnorePop){ pickIgnorePop--; return; }
  if(!deckPickOpen) return;
  pickHistory = false;
  closeDeckPick();
  sfxPlay('panelClose');
});

/* 自测 */
document.getElementById('view-quiz').addEventListener('click', (e) => {
  if(e.target.closest('[data-hint]')){
    const hint = document.getElementById('qHint');
    if(hint) hint.hidden = false;
    const btn = e.target.closest('[data-hint]');
    if(btn) btn.style.display = 'none';
    return;
  }
  if(e.target.closest('[data-quiz-again]')){ startQuiz(); return; }
  if(e.target.closest('[data-quiz-back]')){ switchTab('deck'); return; }
  const submit = e.target.closest('#qSubmit');
  if(submit){ if(quiz.answered) quizNext(); else quizCheck(); }
});

/* ============================================================
   手机键盘：键入时收起底栏
   键盘弹出会让可视高度变矮，底栏会被一起顶到键盘上方；
   这里在输入框获得焦点（键盘弹出）时收起底栏，失焦后恢复
   ============================================================ */
function syncKeyboardBar(){
  const app = document.querySelector('.app');
  if(!app) return;
  const phoneLike = window.innerWidth < 520 ||
    (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  const ae = document.activeElement;
  const typing = phoneLike && !!ae &&
    (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
  app.classList.toggle('kb-typing', typing);
}
document.addEventListener('focusin', syncKeyboardBar, true);
document.addEventListener('focusout', () => setTimeout(syncKeyboardBar, 0), true);

/* ============================================================
   启动
   ============================================================ */
const restored = restoreQueue();
queue = restored.queue;
pos = restored.pos;
deckScopeLabel = restored.label || '';   /* 复习模式等非分组的卡组名跟着存档回来 */
savePos();          /* 把队列与当前下标同步回存档 */
renderDeckShell();
refreshHeader();
</script>
