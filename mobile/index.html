<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随身刷词">
<title>随身刷词 · 手机版</title>
<style>
/* ============================================================
   随身刷词 · 手机版
   外层界面：瓷白 + 石墨 + 发丝线的柔光界面；
   词卡本身保留各自词卡的纸色/墨色/强调色
   ============================================================ */
*,*::before,*::after{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  /* 外层界面：瓷白 + 石墨灰的发丝线界面，不再沿用课程表的纸墨配色 */
  --ink:#20242A;
  --ink-2:#40464E;
  --paper:#E7E9E7;
  --paper-2:#FCFCFB;
  --card:#FFFFFF;

  --rule:rgba(32,36,42,.10);
  --rule-2:rgba(32,36,42,.18);
  --soft:0 1px 2px rgba(32,36,42,.05),0 8px 20px -10px rgba(32,36,42,.20);
  --soft-lg:0 2px 6px rgba(32,36,42,.05),0 26px 60px -24px rgba(32,36,42,.36);
  /* 界面强调色：默认雾青，刷词时会被当前词卡自己的强调色覆盖 */
  --ac:#5F7F86;

  --clay:#B8704B;
  --moss:#6F8B74;
  --amber:#BB9A5A;
  --indigo:#66799E;
  --plum:#8F7898;
  --teal:#6E968F;
  --rose:#BC7E8A;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --bounce:cubic-bezier(.175,.885,.32,1.275);
  --ease:cubic-bezier(.4,0,.2,1);

  /* 黄金比例间距阶梯：只用于刷词卡正面 */
  --phi:1.618;
  --sx1:.382rem;
  --sx2:.618rem;
  --sx3:1rem;
  --sx4:1.618rem;

  --display:'Arial Black','Cooper Black',Impact,'PingFang SC','Microsoft YaHei',sans-serif;
  --sans:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Courier New',monospace;
}

body{
  background:
    radial-gradient(1100px 640px at 18% -12%, #FFFFFF 0%, transparent 62%),
    radial-gradient(900px 620px at 92% 112%, #E8ECEB 0%, transparent 66%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* ---------------- 背景色块 ---------------- */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;}
.blob.b1{width:360px;height:360px;background:#DCE7E7;top:-140px;left:-140px;animation:drift1 22s ease-in-out infinite;}
.blob.b2{width:340px;height:340px;background:#E3E6EA;bottom:-130px;right:-130px;animation:drift2 27s ease-in-out infinite;}
.blob.b3{width:260px;height:260px;background:#E6EBE9;top:44%;left:58%;animation:drift3 31s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(46px,34px) scale(1.18);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,-30px) scale(1.12);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(.88);}}

/* ---------------- APP 容器 ---------------- */
.app{
  position:relative;z-index:1;
  max-width:480px;width:100%;
  height:100vh;height:100dvh;
  background:var(--paper-2);
  border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  overflow:hidden;
  /* 强调色的「深一级」版本：用于浅底上的文字/图标，保证对比度。
     写在 .app 上，才能随刷词时覆盖的 --ac 一起重新计算 */
  --ac-deep:color-mix(in srgb,var(--ac) 30%,var(--ink));
}
@media (min-width:520px){
  body{padding:18px 0;}
  .app{
    height:min(920px,calc(100dvh - 36px));
    border:1px solid var(--rule);
    border-radius:34px;
    box-shadow:var(--soft-lg);
  }
}

/* ---------------- 顶部状态条 ---------------- */
.hero{
  position:relative;flex-shrink:0;
  padding:.46rem 1rem .62rem;
  /* 刘海屏 / 挖孔屏：顶部再让出状态栏高度，状态条不被遮住 */
  padding-top:calc(.46rem + env(safe-area-inset-top, 0px));
  background:var(--paper-2);
  border-bottom:1px solid var(--rule);
  overflow:hidden;z-index:2;
}
.hero-bar{
  position:relative;z-index:1;
  display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;
}
.hero-bar .hk{
  color:var(--ink);font-family:var(--mono);font-size:.68rem;font-weight:900;
  letter-spacing:.02em;white-space:nowrap;
}
.hero-bar .hk b{font-family:var(--display);font-size:1.16rem;letter-spacing:-.02em;margin:0 .1rem;color:var(--ac-deep);}
.hero-bar .hk i{font-style:normal;color:color-mix(in srgb,var(--ink) 42%,transparent);font-size:.72rem;}
.hero-tip{
  color:color-mix(in srgb,var(--ink) 55%,transparent);font-size:.64rem;font-weight:700;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
/* 「遮住答案」开关：挪到刷词状态条，和撤回、音效开关排在一起 */
.gloss-btn{
  flex:none;width:24px;height:24px;padding:0;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--rule-2);border-radius:7px;
  background:var(--card);color:var(--ink);
  transition:transform .14s var(--spring),background .16s,border-color .16s,color .16s;
}
.gloss-btn svg{width:14px;height:14px;display:block;}
.gloss-btn:active{transform:scale(.94);}
.gloss-btn.on{background:color-mix(in srgb,var(--ac) 20%,transparent);
  border-color:color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac-deep);}
/* 进度条压成状态条底边的 2px 强调线，不再单独占一行 */
.hero-fill{
  position:absolute;left:0;bottom:0;height:2px;width:0;
  background:#4E6B72;
  background:var(--ac-deep,#4E6B72);
  border-radius:0 2px 2px 0;
  transition:width .5s var(--spring);
  overflow:hidden;
}
/* 今日达标扫光：进度线一遍高光掠过 */
.hero-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-100%);
}
@keyframes heroShine{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
.hero-fill.shine::after{animation:heroShine 1.2s ease-out;}

/* ---------------- 近七天（放在数据页） ---------------- */
.week-row{display:flex;margin:.34rem -.2rem 0;}
.day-cell{
  flex:1;min-width:0;padding:.3rem 0 .28rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.1rem;color:color-mix(in srgb,var(--ink) 60%,transparent);
  border-left:1px solid var(--rule);
}
.day-cell:first-child{border-left:none;}
.day-cell.is-today{opacity:1;background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:8px;
  box-shadow:none;color:var(--ink);}
.day-cell.has{opacity:.9;}
.day-cell .dc-day{font-size:.6rem;font-weight:900;line-height:1;}
.day-cell .dc-num{font-family:var(--mono);font-size:.56rem;font-weight:900;line-height:1;opacity:.7;}
.day-cell.is-today .dc-num{opacity:1;}
/* ---------------- 主区与视图 ---------------- */
.main{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:.55rem .8rem 1rem;
  position:relative;
  -webkit-overflow-scrolling:touch;
  /* 隐藏可见滚动条，但用 gutter 保留它原本占的宽度，避免隐藏后内容变宽导致重排 */
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.main::-webkit-scrollbar{width:5px;}
.main::-webkit-scrollbar-thumb{background:transparent;}
.main::-webkit-scrollbar-track{background:transparent;}
.view{display:none;}
.view.active{display:block;}
.view.deck.active{display:flex;flex-direction:column;min-height:100%;}

/* ---------------- 刷词卡 ---------------- */
.deck-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.deck-meta{
  display:flex;align-items:center;justify-content:space-between;
  gap:.4rem;
  padding:.1rem .2rem .45rem;
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.08em;
  color:color-mix(in srgb,var(--ink) 48%,transparent);flex:none;
}
.deck-meta b{color:var(--ink);display:inline-block;}
/* 分组标记：与统计小字同高 */
.deck-meta b.deck-tag{
  font-family:var(--mono);font-size:.52rem;font-weight:900;letter-spacing:.04em;
  padding:1px 5px;margin-right:3px;border-radius:5px;
  color:var(--ac-deep);
  background:color-mix(in srgb,var(--ac) 16%,transparent);
}
.deck-tools{display:flex;align-items:center;gap:.3rem;flex:none;}
/* 撤回：滑走一张后才出现，与音效开关同高 */
.undo-btn{
  flex:none;height:24px;padding:0 .46rem;
  display:inline-flex;align-items:center;cursor:pointer;
  border:1px solid var(--rule-2);border-radius:7px;
  background:var(--card);color:var(--ink);
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.06em;
  transition:transform .14s var(--spring),background .16s,color .16s;
}
.undo-btn:active{transform:scale(.94);}
/* display 会盖掉 hidden 属性，这里显式还原 */
.undo-btn[hidden]{display:none;}
/* 音效开关：24px，状态只记在 wc_sound_v1 */
.sfx-btn{
  flex:none;width:24px;height:24px;padding:0;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--rule-2);border-radius:7px;
  background:var(--card);color:var(--ink);
  box-shadow:none;
  transition:transform .14s var(--spring),background .16s,color .16s;
}
.sfx-btn svg{width:14px;height:14px;display:block;}
.sfx-btn:active{transform:scale(.94);}
.sfx-btn.off{background:color-mix(in srgb,var(--ink) 5%,var(--paper-2));color:color-mix(in srgb,var(--ink) 40%,transparent);border-color:var(--rule);}
.deck-stage{position:relative;flex:1;min-height:0;display:flex;}
.stack{position:relative;flex:1;min-height:0;display:flex;}

/* 后面两张卡的“厚度” */
.stack::before,.stack::after{
  content:'';position:absolute;background:color-mix(in srgb,var(--card) 88%,var(--paper));
  border:1px solid var(--rule);border-radius:20px;
  transition:transform .3s var(--ease);
}
.stack::before{inset:12px -4px -12px 12px;box-shadow:0 2px 12px rgba(32,36,42,.07);}
.stack::after{inset:6px -1px -6px 6px;box-shadow:0 2px 12px rgba(32,36,42,.09);}

.swipe-card{
  position:relative;z-index:3;flex:1;min-height:0;
  display:flex;flex-direction:column;
  background:transparent;
  padding:0;
  touch-action:none;
  will-change:transform;
  /* 精修版配色：纸色从纯白兑入该词卡自己的强调色，色相干净不发灰；
     墨色/强调色仍取自词卡自身的调色 */
  --cf:color-mix(in srgb,var(--ma,#4E7A8A) var(--ctint,20%),#FFFFFF);
  --ci:var(--mi,#24201B);
  --ca:var(--ma,#4E7A8A);
  /* 强调色的「落下去」版本：用作实心按钮/图标的底色，浅色强调色也能压住 */
  --cink:color-mix(in srgb,var(--ca) 30%,var(--ci));
  --cline:color-mix(in srgb,var(--ci) 12%,transparent);
  --csoft:color-mix(in srgb,var(--ca) 16%,var(--cf));
  --cmute:color-mix(in srgb,var(--ci) 55%,transparent);
}
.swipe-card.out-up{transition:transform .38s var(--ease),opacity .38s var(--ease);transform:translateY(-120%) rotate(-4deg);opacity:0;}
.swipe-card.out-down{transition:transform .38s var(--ease),opacity .38s var(--ease);transform:translateY(120%) rotate(4deg);opacity:0;}
.swipe-card.out-left{transition:transform .34s var(--ease),opacity .34s var(--ease);transform:translateX(-122%) rotate(-6deg);opacity:0;}
.swipe-card.out-right{transition:transform .34s var(--ease),opacity .34s var(--ease);transform:translateX(122%) rotate(6deg);opacity:0;}
.swipe-card.in{animation:cardIn .46s var(--bounce) backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}

/* 双面卡：正面 ↔ 背面 3D 翻转（拖动手势作用在外层 .swipe-card，翻面只转内层） */
.swipe-card{perspective:1100px;}
.flip-inner{
  position:relative;display:flex;flex-direction:column;
  flex:1;min-height:0;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,.05,.2,1);
}
.swipe-card.flipped .flip-inner{transform:rotateY(180deg);}
.swipe-card.flipped{touch-action:pan-y;}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:.92rem 1.05rem 0;
  /* 先给一条纯色兜底，再用词卡自己的纸色/墨色覆盖（老内核不支持 color-mix 也不会变透明） */
  background:#FFFDF8;
  background:var(--cf,#FFFDF8);
  color:#24201B;
  color:var(--ci,#24201B);
  border:1px solid rgba(36,32,27,.12);
  border-color:var(--cline,rgba(36,32,27,.12));
  border-radius:20px;
  box-shadow:0 4px 22px -6px rgba(32,36,42,.18),0 0 0 1px rgba(32,36,42,.04);
  overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg);}
/* 正面顶部一条强调色押边：词卡自己的颜色先声夺人，和背面的色带呼应 */
.face.front::before{
  content:'';position:absolute;left:0;right:0;top:0;height:6px;z-index:1;
  background:var(--ca);pointer-events:none;
}

/* 拖动时中央的方向提示 */
.dir-hint{
  position:absolute;left:50%;top:50%;z-index:5;pointer-events:none;
  transform:translate(-50%,-50%) scale(.9);
  opacity:0;transition:opacity .12s,transform .12s;
  font-family:var(--mono);font-size:.72rem;font-weight:900;letter-spacing:.05em;
  padding:.42rem .82rem;border-radius:999px;border:1px solid var(--cline);
  background:var(--cf);color:var(--ci);white-space:nowrap;
  box-shadow:0 6px 18px rgba(36,32,27,.14);
}
.dir-hint.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.dir-hint[data-dir="right"]{background:color-mix(in srgb,#6F8B74 20%,var(--cf));border-color:color-mix(in srgb,#6F8B74 42%,transparent);}
.dir-hint[data-dir="left"]{background:color-mix(in srgb,#BC7E8A 20%,var(--cf));border-color:color-mix(in srgb,#BC7E8A 42%,transparent);}
.dir-hint[data-dir="up"]{background:color-mix(in srgb,var(--ci) 8%,var(--cf));}
.dir-hint[data-dir="down"]{background:color-mix(in srgb,#BB9A5A 24%,var(--cf));border-color:color-mix(in srgb,#BB9A5A 42%,transparent);}

/* 正反面都沿用该词卡自己的纸色/墨色/强调色，不再套用外层界面的配色 */
.face.back{
  transform:rotateY(180deg);
  padding:0;
}
.back-band{
  flex:none;height:6px;
  background:var(--ca);
}
.back-inner{flex:1;min-height:0;display:flex;flex-direction:column;padding:.8rem 1.05rem .9rem;}
.back-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex:none;
  margin-bottom:.4rem;padding:0;
  background:transparent;border:0;box-shadow:none;
}
.back-word{font-family:var(--display);font-size:1.4rem;letter-spacing:-.03em;line-height:1.1;color:var(--ci);}
.back-ipa{font-family:var(--mono);font-size:.72rem;font-weight:800;color:var(--cmute);margin-left:.3rem;}
.back-body{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column; /* 让下面的信息块按容器高度自适应撑开 */
  padding-right:.12rem;
  /* 与 .main 一致：隐藏可见条但保留占位，避免出现/隐藏时内容宽度跳变 */
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.back-body::-webkit-scrollbar{width:5px;}
.back-body::-webkit-scrollbar-thumb{background:transparent;}
.back-body::-webkit-scrollbar-track{background:transparent;}
.back-gloss{font-size:1.0625rem;font-weight:800;line-height:1.4;margin:.05rem 0 .35rem;color:var(--ci);flex:none;}
/* 信息块：细线分隔的批注区，按内容自身高度排布，不强行平分剩余高度 */
.back-block{
  margin:0;padding:.62rem 0 .55rem;
  background:transparent;
  border:0;border-top:1px solid var(--cline);
  border-radius:0;box-shadow:none;
  flex:0 0 auto;
  display:block;
}
.back-block h4{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.14em;color:var(--cmute);margin:0 0 .3rem;text-transform:uppercase;}
.back-block p{margin:0;font-size:.82rem;line-height:1.65;color:color-mix(in srgb,var(--ci) 82%,transparent);}
.back-block .back-ex{font-family:Georgia,serif;font-size:.86rem;color:var(--ci);}
.bz-ans{background:color-mix(in srgb,var(--ca) 20%,transparent);color:var(--ci);padding:0 .16rem;border-radius:3px;font-weight:800;box-shadow:0 2px 0 color-mix(in srgb,var(--ca) 45%,transparent);}

/* 背面构词：复刻词卡页 .root-line 的「词素胶囊 + 括号释义 + → 释义」排版 */
.back-root{
  margin:.1rem 0 0;padding:0;
  background:transparent;
  border:0;border-radius:0;
  text-align:left;
  font-size:.8rem;line-height:2;color:color-mix(in srgb,var(--ci) 82%,transparent);
  overflow-wrap:anywhere;
}
.back-root .stem,.back-root .affix{
  display:inline-block;margin:0 .08rem;padding:.04rem .3rem;
  border:0;border-radius:5px;
  font-family:var(--mono);font-size:.76rem;font-weight:900;line-height:1.35;
}
.back-root .stem{
  background:color-mix(in srgb, var(--ca,#F0C97E) 22%, var(--cf, #FFFCF5));
  color:color-mix(in srgb, var(--ca,#F0C97E) 62%, var(--ci,#24201B));
}
.back-root .affix{
  background:var(--ci);color:var(--cf);
}
.back-root em{font-style:normal;font-weight:800;color:color-mix(in srgb,var(--ca) 70%,var(--ci));margin:0 .12rem;}
.back-root .sep{font-weight:800;color:color-mix(in srgb,var(--ca) 70%,var(--ci));margin:0 .22rem;}
.back-root b{font-weight:900;color:var(--ci);}
.back-root.plain{border:0;}

/* 背面拼写：一个字母一个格子 + 下方可拖动的字母块 */
.fill-block{margin-top:.1rem;}
.fill-q{font-size:.78rem;line-height:1.5;color:var(--cmute);margin:0 0 .4rem;}
.spell-slots{
  display:flex;flex-direction:column;align-items:flex-start;
  gap:.26rem;width:max-content;max-width:100%;margin:0 auto;
}
.spell-row{
  display:flex;flex-wrap:nowrap;gap:.28rem;
}
.spell-tiles{
  display:flex;flex-wrap:wrap;gap:.28rem;
  justify-content:center;
}
.spell-slot{
  width:2.35rem;height:2.65rem;flex:none;
  display:grid;place-items:center;padding:0;
  border:1.5px dashed var(--cline);
  border-radius:8px;
  background:color-mix(in srgb,var(--ci) 4%,var(--cf));
  overflow:hidden;
  transition:border-color .15s,background .15s,transform .12s var(--spring);
}
.spell-slot.hot{
  border-style:solid;border-color:var(--ca);
  background:var(--csoft);
  transform:translateY(-2px);
}
.spell-slot.filled{
  border-style:solid;border-color:var(--ca);
  background:var(--csoft);
}
.spell-tiles{
  margin-top:.5rem;padding-top:.5rem;
  border-top:1px solid var(--cline);
}
.spell-tiles:empty{display:none;}
.spell-tile{
  appearance:none;cursor:grab;
  width:2.35rem;height:2.65rem;flex:none;
  display:grid;place-items:center;padding:0;
  border:1px solid var(--cline);
  border-radius:8px;
  background:var(--csoft);
  color:var(--ci);
  font-family:var(--mono);font-size:1.12rem;font-weight:900;line-height:1;
  box-shadow:none;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  transition:transform .12s var(--ease),background .15s;
}
/* 已落格的字母块去掉自身描边，和格子合成一个整体 */
.spell-slot.filled .spell-tile{
  width:100%;height:100%;
  border:0;border-radius:0;box-shadow:none;background:transparent;
}
.spell-tile:active{transform:scale(.95);}
.spell-tile.dragging{opacity:.32;}
.spell-ghost{position:fixed;pointer-events:none;z-index:9999;margin:0;}
.fill-msg{font-size:.72rem;font-weight:700;line-height:1.4;margin:.26rem 0 0;min-height:1em;color:var(--cmute);}
.fill-block.ok .fill-msg{color:#2F6B45;}
.fill-block.ok .spell-slot{border-color:#2F6B45;}
.fill-block.bad .fill-msg{color:#B04A3A;}
.fill-block.bad .spell-slot{border-color:#B04A3A;}
.fill-block.bad{animation:fillShake .3s;}
@keyframes fillShake{20%{transform:translateX(-4px)}55%{transform:translateX(4px)}85%{transform:translateX(-2px)}}

.card-head{display:flex;align-items:center;gap:.4rem;flex:none;margin-bottom:.5rem;}
.root-tag{
  display:inline-flex;align-items:center;gap:.26rem;
  font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.03em;
  padding:.2rem .46rem;border-radius:6px;
  border:0;background:var(--csoft);
  color:color-mix(in srgb,var(--ca) 62%,var(--ci));
}
.root-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--ca);flex:none;}
.mst-tag{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.04em;
  padding:0;border:0;background:transparent;color:var(--cmute);
}
.mini-card{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:.18rem;
  font-family:var(--mono);font-size:.66rem;font-weight:700;
  color:var(--cmute);background:transparent;border:0;
  border-radius:0;padding:0;text-decoration:none;
  transition:opacity .16s;
}
.mini-card:active{opacity:.55;}

.card-main{display:flex;flex-direction:column;flex:1;min-height:0;}
.word-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sx2);flex:none;}
.word{
  font-family:var(--display);
  font-size:clamp(2.05rem,9.6vw,2.5rem);
  line-height:1.02;letter-spacing:-.035em;color:var(--ci);
  word-break:break-word;
}
.speak{
  appearance:none;cursor:pointer;flex:none;
  width:40px;height:40px;border-radius:10px;
  border:1px solid var(--cink);background:var(--cink);color:var(--cf);
  box-shadow:none;
  display:grid;place-items:center;
  transition:transform .14s var(--ease),background .2s;
}
.speak svg{width:18px;height:18px;}
.speak:active{transform:scale(.94);}
.speak.speaking{animation:speakPulse .7s ease-in-out infinite;}
@keyframes speakPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* 词头下方一行：音标 | 词性 */
.meta{display:flex;align-items:baseline;gap:.6rem;margin:.18rem 0 .68rem;flex:none;}
.meta .ipa{font-family:var(--mono);font-size:.8rem;font-weight:800;color:var(--cmute);letter-spacing:.01em;}
.meta .pos{font-family:var(--mono);font-size:.72rem;font-weight:800;letter-spacing:.02em;
  padding:.08rem .42rem .05rem;border-radius:5px;
  background:color-mix(in srgb,var(--ca) 26%,#FFFFFF);
  color:var(--cink);}
.gloss{font-size:1.125rem;font-weight:800;line-height:1.4;margin-top:.16rem;color:var(--ci);transition:filter .18s var(--ease);}
/* 顶部开关打开时：正面模糊释义、背面模糊单词，字号与布局完全不变 */
.app.hide-gloss .face.front .gloss{filter:blur(7px);user-select:none;}
.app.hide-gloss .face.back .back-word-txt{filter:blur(7px);user-select:none;}
.back-word-txt{transition:filter .18s var(--ease);}

.art-frame{
  position:relative;flex:0 1 auto;
  /* 高度同时受 30vh、200px 上限和「卡片可用内宽」约束：保证黄金矩形永不横向溢出
     场景/构词多占一行时，允许图形框按比例收缩（不低于 84px），避免文字被裁切 */
  height:clamp(96px,min(30vh,calc((100vw - 84px) / 1.618)),200px);width:auto;
  min-height:84px;
  aspect-ratio:1.618 / 1;
  margin:.3rem auto .55rem;
  border:0;border-radius:12px;
  box-shadow:none;
  overflow:hidden;background:var(--ci);
}
.art-frame .di-art{
  width:100%;height:100%;
  display:grid;place-items:center;
}
.art-frame .di-art svg{display:block;width:100%;height:100%;}
.art-frame .art-tag{
  position:absolute;left:6px;bottom:6px;z-index:2;
  font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.08em;
  padding:.1rem .38rem .12rem;border-radius:4px;
  background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(4px);
}

.scene{
  margin-top:.5rem;padding-left:.55rem;border-left:3px solid var(--ca);
  font-size:.8125rem;font-weight:600;line-height:1.55;color:color-mix(in srgb,var(--ci) 80%,transparent);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.morph{
  margin-top:.45rem;padding-top:.42rem;
  border-top:1px solid var(--cline);
  font-size:.72rem;line-height:1.5;color:var(--cmute);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.morph b{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--cmute);margin-right:.2rem;}

.actions{
  display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:.5rem;
  flex:none;margin:.6rem -1.05rem 0;
  padding:.7rem 1.05rem .85rem;
  border-top:1px solid var(--cline);background:var(--cf);
}
.rate{
  appearance:none;cursor:pointer;
  font-family:var(--sans);font-size:.82rem;font-weight:700;letter-spacing:0;
  padding:.78rem .2rem;border-radius:10px;
  border:0;
  background:color-mix(in srgb,var(--ci) 6%,var(--cf));color:var(--ci);
  box-shadow:none;
  transition:transform .12s var(--ease),background .18s;
  position:relative;overflow:hidden;
}
/* 评分压印环：点击后由语义色扩散一圈 */
.rate::after{
  content:'';position:absolute;left:50%;top:50%;
  width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;background:var(--rc);opacity:0;
  transform:scale(0);pointer-events:none;
}
@keyframes stampRing{from{opacity:.55;transform:scale(1);}to{opacity:0;transform:scale(14);}}
.rate.stamp::after{animation:stampRing .32s ease-out;}
.rate:active{transform:scale(.97);box-shadow:none;}
.rate.r0{--rc:var(--rose);}
.rate.r1{--rc:var(--amber);background:color-mix(in srgb,var(--ca) 12%,var(--cf));color:var(--ci);}
.rate.r2{--rc:var(--moss);background:var(--cink);color:var(--cf);}

/* ---------------- 正面分层入场 / 呼吸 / 数字 tick ---------------- */
@keyframes rvIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.face.front .rv1{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 0ms backwards;}
.face.front .rv2{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 40ms backwards;}
.face.front .rv3{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 80ms backwards;}
.face.front .rv4{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 120ms backwards;}
.face.front .rv5{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 160ms backwards;}
.face.front .rv5b{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 180ms backwards;}
.face.front .rv6{animation:rvIn .4s cubic-bezier(.16,1,.3,1) 200ms backwards;}

@keyframes artIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.face.front .di-art{animation:artIn .5s cubic-bezier(.16,1,.3,1) 120ms backwards;}

@keyframes posTick{from{transform:scale(1.25);}to{transform:scale(1);}}
.deck-meta b.tick{animation:posTick .28s cubic-bezier(.16,1,.3,1);}

.deck-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  text-align:center;color:var(--ink-2);padding:1.2rem;
}
.deck-empty .big{font-family:var(--display);font-size:1.6rem;letter-spacing:-.02em;}
.deck-empty .empty-actions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.2rem;}
/* ---------------- 词库：字母方块 + 分组详情 ---------------- */
#view-lib.active{display:flex;flex-direction:column;height:100%;}
.main.lib-on{overflow:hidden;padding-bottom:.55rem;}
.lib-stat{
  flex:none;display:flex;align-items:baseline;gap:.3rem;margin:0 .12rem .42rem;
  font-family:var(--mono);font-size:.58rem;font-weight:900;letter-spacing:.06em;
  color:color-mix(in srgb,var(--ink) 48%,transparent);
}
.lib-stat b{color:var(--ink);}
.lib-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
.search-box{position:relative;flex:1;min-width:0;}
.search-box svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:color-mix(in srgb,var(--ink) 42%,transparent);pointer-events:none;
}
.search-box input{
  width:100%;height:42px;
  font-family:var(--sans);font-size:.82rem;font-weight:700;color:var(--ink);
  background:var(--card);border:1px solid var(--rule-2);border-radius:12px;
  padding:0 38px 0 34px;outline:none;
  box-shadow:var(--soft);
  transition:border-color .16s,box-shadow .16s;
}
.search-box input::placeholder{color:color-mix(in srgb,var(--ink) 38%,transparent);font-weight:700;}
.search-box input:focus{background:#fff;border-color:color-mix(in srgb,var(--ac) 45%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent);}
.search-box .clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;padding:0;border:0;border-radius:50%;
  background:rgba(32,36,42,.10);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;font-size:13px;line-height:1;font-weight:700;
  transition:background .16s;
}
.search-box .clear:active{background:rgba(32,36,42,.18);}
.search-box .clear[hidden]{display:none;}

.lib-stage{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:.1rem;}
.lib-grid{
  position:absolute;inset:0;padding-bottom:.4rem;
  display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center;
  --cols:5;
  transition:opacity .28s var(--ease),transform .28s var(--ease);
}
.lib-grid.fade-out{opacity:0;transform:scale(.94);pointer-events:none;}
.cell{
  position:relative;appearance:none;border:0;cursor:pointer;
  flex:0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols));
  max-width:80px;aspect-ratio:1;
  border-radius:12px;
  background:color-mix(in srgb,var(--lc) 12%,#FFFFFF);
  color:color-mix(in srgb,var(--lc) 72%,var(--ink));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:8px 8px 12px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lc) 18%,transparent);
  transition:transform .14s var(--spring),background .2s,box-shadow .2s;
}
.cell:active{transform:scale(.92);}
.cell-letter{font-family:var(--display);font-size:22px;font-weight:900;line-height:1;letter-spacing:-.02em;}
.cell-count{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.02em;opacity:.7;}
.cell-progress{
  position:absolute;left:8px;right:8px;bottom:7px;height:3px;
  border-radius:99px;overflow:hidden;display:flex;
  background:rgba(0,0,0,.04);
}
.cell-progress i{display:block;height:100%;}
.cell-progress .p0{background:#C8CBCE;}
.cell-progress .p1{background:#BB9A5A;}
.cell-progress .p2{background:#6F8B74;}
.cell.hide{visibility:hidden;}
.wempty{padding:1.6rem .8rem;text-align:center;color:color-mix(in srgb,var(--ink) 45%,transparent);font-size:.76rem;font-weight:700;}

/* 详情层 */
.lib-detail{position:absolute;inset:0;display:none;flex-direction:column;}
.lib-detail.show{display:flex;}
.detail-top{flex:none;display:flex;align-items:center;gap:.5rem;padding:.1rem 0 0;}
.back-btn{
  appearance:none;border:1px solid var(--rule-2);cursor:pointer;flex:none;
  width:34px;height:34px;border-radius:10px;
  background:var(--card);color:var(--ink);
  display:grid;place-items:center;
  transition:transform .14s,background .16s;
}
.back-btn:active{transform:scale(.94);}
.back-btn svg{width:16px;height:16px;display:block;}
.detail-title{
  flex:1;text-align:center;min-width:0;
  font-family:var(--mono);font-size:.62rem;font-weight:900;letter-spacing:.1em;
  color:color-mix(in srgb,var(--ink) 50%,transparent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bulk-btn{
  appearance:none;border:0;cursor:pointer;flex:none;
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.04em;
  padding:7px 10px;border-radius:8px;
  background:var(--ink);color:#fff;
  transition:transform .14s,background .16s;
}
.bulk-btn:active{transform:scale(.94);}
.badge{
  width:84px;height:84px;flex:none;
  margin:.7rem auto .85rem;border-radius:16px;
  display:grid;place-items:center;
  font-family:var(--display);font-size:38px;font-weight:900;letter-spacing:-.03em;
  color:#FFFFFF;visibility:hidden;
}
.detail-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:.6rem;scrollbar-width:none;}
.detail-scroll::-webkit-scrollbar{display:none;}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.w-card{
  background:var(--card);border-radius:12px;
  border-left:4px solid var(--rc,#BC7E8A);
  padding:.68rem .72rem .72rem;
  box-shadow:0 1px 2px rgba(32,36,42,.05),0 8px 18px -10px rgba(32,36,42,.18);
  cursor:pointer;opacity:0;transform:translateY(14px) scale(.96);
}
.w-card.in{animation:cardIn .42s cubic-bezier(.34,1.3,.64,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.w-word{font-family:var(--display);font-size:.94rem;font-weight:900;letter-spacing:-.01em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.w-ipa{font-family:var(--mono);font-size:.55rem;font-weight:700;color:color-mix(in srgb,var(--ink) 48%,transparent);
  margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.w-gloss{font-size:.64rem;font-weight:700;line-height:1.35;margin-top:.36rem;
  color:color-mix(in srgb,var(--ink) 60%,transparent);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.w-meta{display:flex;align-items:center;gap:.34rem;margin-top:.46rem;}
.w-mst{
  font-family:var(--mono);font-size:.5rem;font-weight:900;letter-spacing:.04em;
  padding:1px 6px;border-radius:5px;border:0;
  background:color-mix(in srgb,currentColor 12%,transparent);
}
.w-mst.m0{color:#7C7972;}
.w-mst.m1{color:#9A7B34;}
.w-mst.m2{color:#4C6B52;}
.w-chk{font-family:var(--mono);font-size:.5rem;font-weight:900;color:color-mix(in srgb,var(--ink) 42%,transparent);}

.flyer{
  position:fixed;z-index:999;pointer-events:none;
  display:grid;place-items:center;
  font-family:var(--display);font-weight:900;letter-spacing:-.02em;
  border-radius:12px;transform-origin:top left;will-change:transform;
  box-shadow:0 14px 32px -12px rgba(32,36,42,.42);
}

/* ---------------- 自测 ---------------- */
.quiz-wrap{display:flex;flex-direction:column;gap:.6rem;}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.06em;color:color-mix(in srgb,var(--ink) 50%,transparent);}
.quiz-head b{color:var(--ink);}
.quiz-card{
  background:var(--card);border:1px solid var(--rule);border-radius:20px;
  box-shadow:var(--soft);
  padding:.9rem .9rem 1rem;
}
.q-kicker{
  display:inline-block;font-family:var(--mono);font-size:.55rem;font-weight:900;letter-spacing:.08em;
  padding:.14rem .48rem .16rem;border-radius:6px;border:0;
  background:color-mix(in srgb,var(--ac) 14%,transparent);
  color:color-mix(in srgb,var(--ac) 58%,var(--ink));
  margin-bottom:.6rem;
}
.q-sentence{font-size:1rem;font-weight:700;line-height:1.75;letter-spacing:.01em;word-break:break-word;}
.q-sentence .first-letter{font-weight:900;border-bottom:2px solid color-mix(in srgb,var(--ac) 70%,var(--ink));}
.q-sentence .qz-blank{
  display:inline-block;min-width:3.4rem;
  border-bottom:2px solid color-mix(in srgb,var(--ac) 70%,var(--ink));margin:0 .1rem;
  vertical-align:baseline;color:color-mix(in srgb,var(--ac) 62%,var(--ink));font-weight:900;text-align:center;
}
.q-input{
  width:100%;height:48px;margin-top:.8rem;
  font-family:var(--mono);font-size:1.05rem;font-weight:900;color:var(--ink);letter-spacing:.02em;
  background:#fff;border:1px solid var(--rule-2);border-radius:12px;
  padding:0 .7rem;outline:none;
  box-shadow:none;
  transition:border-color .16s,box-shadow .16s;
}
.q-input:focus{border-color:color-mix(in srgb,var(--ac) 45%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent);}
.q-input:disabled{background:color-mix(in srgb,var(--ink) 4%,var(--paper-2));color:color-mix(in srgb,var(--ink) 55%,transparent);}
.q-hint{
  margin-top:.55rem;padding:.42rem .6rem;
  background:color-mix(in srgb,var(--ink) 4%,var(--paper-2));border:1px dashed var(--rule-2);border-radius:10px;
  font-size:.68rem;line-height:1.45;font-weight:700;color:var(--ink-2);
}
.q-foot{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;}
.q-feed{flex:1;min-width:0;font-size:.72rem;font-weight:900;line-height:1.4;}
.q-feed.right{color:#2E7A4B;}
.q-feed.wrong{color:#A33A1E;}
.q-btn{
  appearance:none;cursor:pointer;flex:none;
  font-family:var(--sans);font-size:.8rem;font-weight:900;
  padding:.52rem 1rem .54rem;border-radius:12px;
  background:var(--ink);color:#fff;border:0;
  box-shadow:0 4px 12px -6px rgba(32,36,42,.55);
  transition:transform .16s var(--spring),box-shadow .16s var(--ease),background .16s;
}
.q-btn:active{transform:scale(.97);box-shadow:none;}
.q-btn.ghost{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);box-shadow:none;}
.q-result-num{font-family:var(--display);font-size:2.4rem;letter-spacing:-.03em;line-height:1.1;margin:.2rem 0 .3rem;}
.q-result-sub{font-size:.72rem;font-weight:700;line-height:1.5;color:color-mix(in srgb,var(--ink) 60%,transparent);}
.q-actions{display:flex;gap:.5rem;margin-top:.9rem;}
.q-actions .q-btn{flex:1;}

/* ---------------- 数据 ---------------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.tile{
  background:var(--card);border:1px solid var(--rule);border-radius:16px;
  box-shadow:var(--soft);
  padding:.6rem .7rem .64rem;
}
.tile.wide{grid-column:span 2;}
.tile .tk{
  font-family:var(--mono);font-size:.54rem;font-weight:900;letter-spacing:.1em;
  color:color-mix(in srgb,var(--ink) 45%,transparent);display:block;margin-bottom:.16rem;
}
.tile .tv{font-family:var(--display);font-size:1.6rem;letter-spacing:-.03em;line-height:1.1;}
.tile .tv small{font-family:var(--mono);font-size:.6rem;font-weight:900;color:color-mix(in srgb,var(--ink) 45%,transparent);margin-left:.14rem;}
.tile .ts{font-size:.62rem;font-weight:700;color:color-mix(in srgb,var(--ink) 52%,transparent);margin-top:.14rem;line-height:1.4;}
.mst-bars{display:flex;flex-direction:column;gap:.34rem;margin-top:.2rem;}
.mst-bar{display:flex;align-items:center;gap:.45rem;}
.mst-bar .lab{flex:none;width:3.4rem;font-size:.6rem;font-weight:900;color:var(--ink-2);}
.mst-bar .track{flex:1;height:10px;border:1px solid var(--rule);border-radius:999px;background:color-mix(in srgb,var(--ink) 5%,var(--paper-2));overflow:hidden;}
.mst-bar .fill{display:block;height:100%;border-radius:999px;background:var(--bc);transition:width .5s var(--spring);}
.mst-bar .num{flex:none;width:1.6rem;text-align:right;font-family:var(--mono);font-size:.6rem;font-weight:900;}
.link-row{display:flex;align-items:center;gap:.5rem;margin-top:.55rem;}
.big-link{
  flex:1;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.62rem .7rem;background:var(--ink);color:#fff;text-decoration:none;
  border:0;border-radius:12px;
  font-size:.76rem;font-weight:900;
  box-shadow:0 6px 16px -8px rgba(32,36,42,.55);
  transition:transform .16s var(--spring),box-shadow .16s var(--ease);
}
.big-link:active{transform:scale(.985);box-shadow:none;}
.big-link svg{width:16px;height:16px;flex:none;}
.stat-note{
  margin-top:.6rem;text-align:center;
  font-family:var(--mono);font-size:.54rem;font-weight:900;letter-spacing:.08em;color:color-mix(in srgb,var(--ink) 34%,transparent);
}

/* ---------------- 底部导航 ---------------- */
.tabbar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.24rem;
  flex:none;position:relative;z-index:5;
  padding:.42rem .5rem calc(.42rem + env(safe-area-inset-bottom,0px));
  background:var(--paper-2);
  border-top:1px solid var(--rule);
}
.tab{
  appearance:none;cursor:pointer;
  background:transparent;border:0;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.16rem;
  padding:.34rem 0 .3rem;
  color:color-mix(in srgb,var(--ink) 45%,transparent);
  font-family:var(--sans);font-size:.6rem;font-weight:900;
  transition:transform .22s var(--spring),background .2s,color .2s;
}
.tab svg{width:21px;height:21px;transition:color .2s;}
.tab:active{transform:scale(.94);}
.tab.active{
  background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);
}
.tab.active svg{color:var(--ac-deep);}

/* ---------------- 轻提示 ---------------- */
.toast{
  position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);z-index:50;
  background:var(--ink);color:#fff;
  font-size:.72rem;font-weight:800;letter-spacing:.01em;
  padding:.5rem .9rem;border-radius:10px;border:0;
  box-shadow:0 10px 24px -10px rgba(32,36,42,.55);
  opacity:0;pointer-events:none;white-space:nowrap;
  max-width:calc(100% - 2rem);overflow:hidden;text-overflow:ellipsis;
  transition:opacity .2s var(--ease),transform .26s var(--spring);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* 窄屏：高度按可用内宽反推，保证黄金矩形不横向溢出 */
@media (max-width:389px){
  .art-frame{max-width:100%;}
}
@media (max-width:350px){
  .word{font-size:1.7rem;}
  .scene,.morph{display:none;}

/* 矮屏逐级减负：保证一屏一张卡，不出现内部滚动 */

  .morph{display:none;}
  /* 矮屏背面收紧留白（字号不变），尽量一屏放下 */

}

  .art-frame{display:none;}

  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}

<div class="app">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../words-data.js"></script>
<script>
/* ============================================================
   数据层：全部读写与 index.html 相同的那几个 localStorage 键
   ============================================================ */
const D = window.WORDS_DATA || {};
const WORDS = (D.words || []).filter(w => w && w.word);
const ART = D.art || {};
const ARTCSS = D.artCss || {};
const MSTCSS = D.mst || {};

/* 背面用该词卡自己的配色：从卡片页 :root 收敛出的 --mst-* 里取纸色/墨色/强调色 */
const palCache = {};
function paletteOf(word){
  if(palCache[word]) return palCache[word];
  const css = MSTCSS[word] || '';
  const pick = k => {
    const m = css.match('--mst-' + k + ':\\s*([^;]+)');
    return m ? m[1].trim() : '';
  };
  const paper = pick('paper');
  const ink = pick('ink');
  const accent = pick('accent');
  const tint = tintOf(accent);
  const style = [
    paper ? '--mp:' + paper : '',
    ink ? '--mi:' + ink : '',
    accent ? '--ma:' + accent : '',
    '--ctint:' + tint
  ].filter(Boolean).join(';');
  return (palCache[word] = {paper, ink, accent, tint, style});
}

/* 纸色兑入强调色的比例：色相越鲜明兑得越多；
   近中性或很深的强调色少兑一点，避免整张卡变成一片灰 */
function tintOf(hex){
  const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return '16%';
  const n = parseInt(m[1], 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2, d = max - min;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let t;
  if(s < .12) t = 4;
  else if(l < .3) t = 8;
  else t = 16 + 14 * s;
  return Math.round(t) + '%';
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 把词卡页 .root-line 的文本还原成「词素胶囊 + 括号释义 + → 释义」的排版 */
function rootAtomHtml(seg, allowBare){
  const raw = String(seg).trim();
  const m = raw.match(/^([^（(]*)[（(]([^）)]*)[）)]/);
  if(!m){
    /* 只有构成部分里不带括号的单个词素（如 reverse 的 -e）做成胶囊，释义段不加 */
    return (allowBare && /^\S+$/.test(raw)) ? '<span class="' + (/-/.test(raw) ? 'affix' : 'stem') + '">' + esc(raw) + '</span>' : null;
  }
  const toks = m[1].trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return null;
  const morpheme = toks.pop();          /* 括号前最后一个词是词素，前面的「古英语 / 拉丁语」等作普通文字 */
  const prefix = toks.join(' ');
  /* 括号之后的剩余文字（可能还含别的括号）原样保留，不能丢 */
  const tail = raw.slice(m[0].length).trim();
  return (prefix ? esc(prefix) + ' ' : '') +
    '<span class="' + (/-/.test(morpheme) ? 'affix' : 'stem') + '">' + esc(morpheme) + '</span>（' + esc(m[2]) + '）' +
    (tail ? ' ' + esc(tail) : '');
}
function rootLineHtml(text){
  const raw = String(text || '').trim();
  if(!raw) return '';
  const parts = raw.split(/→/);
  const head = (parts[0] || '').trim();
  const rest = parts.slice(1).map(s => s.trim()).filter(Boolean);
  const segs = head.split(/[+＋]/).map(s => s.trim());
  const atoms = segs.map(s => rootAtomHtml(s, true));
  /* 只要有一段能做成胶囊就走胶囊排版，解析失败的段原样输出（不整段退回 plain） */
  if(!atoms.some(a => a)) return '<div class="back-root plain">' + esc(raw) + '</div>';
  let html = '<div class="back-root">' + atoms.map((a, i) => a || esc(segs[i])).join('<em>+</em>');
  if(rest.length){
    html += '<span class="sep">→</span>' +
      rest.map((s, i) => {
        const a = rootAtomHtml(s);
        if(a) return a;
        return i === rest.length - 1 ? '<b>' + esc(s) + '</b>' : esc(s);
      }).join('<span class="sep">→</span>');
  }
  return html + '</div>';
}

const STORE_KEY = 'vocab_workbench_v1';
const MB_KEY = 'wc_mobile_v1';
const QUIZ_KEY = 'wc_quiz_v1';
const MST_KEY = 'vocab_mst_v1';
const REVIEW_DAYS = ['d1','d3','d7','d15'];
const GOAL = 10;

const ROOT_META = {
  vers:  {label:'vers · vert', color:'var(--indigo)'},
  un:    {label:'un · uni',    color:'var(--teal)'},
  ann:   {label:'ann',         color:'var(--amber)'},
  contra:{label:'contra',      color:'var(--clay)'},
  cor:   {label:'cor',         color:'var(--plum)'},
  other: {label:'其他词源',     color:'var(--rose)'}
};
const MST_LABEL = ['未学','学习中','已掌握'];

let store = loadJSON(STORE_KEY, {});
let mb = loadJSON(MB_KEY, {days:{}, total:0});
let mstRule = Object.assign({learnOpens:2, masterOpens:5, decayDays:14}, loadJSON(MST_KEY, {}));

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? (JSON.parse(raw) || fallback) : fallback;
  }catch(e){ return fallback; }
}
function persist(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ toast('本机存储不可用，记录不会保存'); }
}
function rec(word){
  let r = store[word];
  if(!r) r = store[word] = {};
  if(r.fav === undefined) r.fav = false;
  if(r.mastery === undefined) r.mastery = 0;
  if(r.pin === undefined) r.pin = null;
  if(r.note === undefined) r.note = '';
  if(r.opens === undefined) r.opens = 0;
  if(r.lastOpened === undefined) r.lastOpened = 0;
  return r;
}
function daysSince(ts){ return ts ? (Date.now() - ts) / 86400000 : Infinity; }
function masteryOf(word){
  const r = rec(word);
  const auto = r.opens >= mstRule.masterOpens ? 2 : r.opens >= mstRule.learnOpens ? 1 : 0;
  const val = (r.pin === 1 || r.pin === 2) ? r.pin : auto;
  return (val === 2 && daysSince(r.lastOpened) > mstRule.decayDays) ? 1 : val;
}

/* 复习打卡只读，汇总来自卡片页写的 <单词>_review */
let reviewCache = null;
function reviewMap(){
  if(reviewCache) return reviewCache;
  const map = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.slice(-7) !== '_review') continue;
      const v = loadJSON(k, {});
      map[k.slice(0, -7)] = (v && typeof v === 'object') ? v : {};
    }
  }catch(e){}
  reviewCache = map;
  return map;
}
function reviewDone(word){
  const v = reviewMap()[word];
  return v ? REVIEW_DAYS.filter(k => v[k]).length : 0;
}
function isDue(word){
  const n = reviewDone(word);
  return n > 0 && n < REVIEW_DAYS.length && masteryOf(word) !== 2;
}

/* ------------------------------------------------------------
   日期与统计
   ------------------------------------------------------------ */
function keyOf(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey(){ return keyOf(new Date()); }
function todayCount(){ return mb.days[todayKey()] || 0; }
function streakDays(){
  const days = mb.days || {};
  const d = new Date();
  if(!days[keyOf(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while(days[keyOf(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bumpToday(n){
  const k = todayKey();
  mb.days = mb.days || {};
  mb.days[k] = (mb.days[k] || 0) + n;
  mb.total = (mb.total || 0) + n;
  persist(MB_KEY, mb);
}
/* 今天已经评分过的词（刷新后排在队尾，不重复出现在最前面） */
function ratedToday(){
  const set = new Set(((mb.rated || {})[todayKey()]) || []);
  return set;
}
function markRated(word){
  const k = todayKey();
  mb.rated = mb.rated || {};
  const list = mb.rated[k] || (mb.rated[k] = []);
  if(list.indexOf(word) < 0) list.push(word);
  /* 只保留最近 7 天（日期键按 YYYY-MM-DD 排序即时间序），避免记录无限增长 */
  const keys = Object.keys(mb.rated).sort();
  while(keys.length > 7) delete mb.rated[keys.shift()];
  persist(MB_KEY, mb);
}
/* 进度存档：日期 + 当前下标 + 当时的队列词序 */
function savePos(){
  if(!queue.length || deckScoped) return;
  mb.pos = {date: todayKey(), index: pos, queueWords: queue.map(w => w.word)};
  persist(MB_KEY, mb);
}
/* 恢复进度：已刷过的词已被排到队尾，直接按“今天已刷到第几张”续上即可 */
function restorePos(q){
  const p = mb.pos;
  if(!p || p.date !== todayKey() || !q.length) return 0;
  return Math.min(Math.max(0, p.index || 0), q.length);
}

/* ------------------------------------------------------------
   刷词队列：待复习优先，然后未学 → 学习中 → 已掌握
   ------------------------------------------------------------ */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildQueue(onlyFresh){
  const due = [], rest = [];
  WORDS.forEach(w => (isDue(w.word) ? due : rest).push(w));
  shuffle(due); shuffle(rest);
  rest.sort((a, b) => masteryOf(a.word) - masteryOf(b.word) || rec(a.word).opens - rec(b.word).opens);
  const all = due.concat(rest);
  /* 今天已评分的词排到队尾：不删掉（允许重刷），但不占队首 */
  const rated = ratedToday();
  const fresh = all.filter(w => !rated.has(w.word));
  const done = all.filter(w => rated.has(w.word));
  /* onlyFresh：重开一轮只刷今天还没刷过的（方案 A） */
  return onlyFresh ? fresh : fresh.concat(done);
}
let queue = [];
let pos = 0;
let animating = false;
/* 词库「刷这组」：临时队列，不写全局进度存档 */
let deckScoped = false;
let deckBackup = null;      /* 进入分组前的 {queue, pos, undoSnap} */
let deckScopeLabel = '';    /* 当前分组字母，如 'C' */

/* ------------------------------------------------------------
   朗读：优先播放预生成的发音文件（WebView 壳里通常没有系统 TTS），
   文件缺失或不支持播放时再退回系统朗读
   ------------------------------------------------------------ */
const AUDIO_BASE = 'audio/';
let speakAudio = null;
let speakBtn = null;
function stopSpeak(){
  if(speakAudio){ try{ speakAudio.pause(); }catch(e){} }
  if(speakBtn){ speakBtn.classList.remove('speaking'); speakBtn = null; }
}
let speakVO = null;
let ttsWarned = false;
/* 设备没有英文语音引擎时只提示一次，避免每点一下朗读就弹一次 */
function warnNoTts(){
  if(ttsWarned) return;
  ttsWarned = true;
  toast('设备缺少英文语音引擎，请在系统设置里安装');
}
function speakFallback(word, btn){
  if(!('speechSynthesis' in window)){ toast('朗读音频缺失，请检查网络'); return; }
  window.speechSynthesis.cancel();
  const u = speakVO = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  const off = () => { if(btn && speakVO === u && speakBtn === btn){ btn.classList.remove('speaking'); speakBtn = null; } };
  if(btn){ btn.classList.add('speaking'); speakBtn = btn; }
  u.onend = off;
  u.onerror = (e) => {
    off();
    const reason = e && e.error;
    if(reason === 'interrupted' || reason === 'canceled') return;
    warnNoTts();
  };
  window.speechSynthesis.speak(u);
}
/* 预取当前卡和下一张卡的发音，滑卡后按下就能立刻出声 */
const audioPreload = new Map();
const audioMiss = new Set();
function preloadAudio(word){
  if(!word || audioPreload.has(word)) return;
  if(audioPreload.size > 6) audioPreload.clear();
  const a = new Audio();
  a.preload = 'auto';
  a.src = AUDIO_BASE + encodeURIComponent(word) + '.mp3';
  audioPreload.set(word, a);
}
function speakWord(word, btn){
  if(!word) return;
  stopSpeak();
  if(audioMiss.has(word)){ speakFallback(word, btn); return; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(!speakAudio){ speakAudio = new Audio(); speakAudio.preload = 'auto'; }
  const a = speakAudio;
  let done = false;
  const off = () => {
    if(btn && speakBtn === btn){ btn.classList.remove('speaking'); speakBtn = null; }
  };
  const fail = () => {
    if(done) return;
    done = true;
    audioMiss.add(word); /* 记住缺音频的词，下次直接走朗读，不再白请求 */
    off();
    speakFallback(word, btn);
  };
  a.onended = () => { done = true; off(); };
  a.onerror = fail;
  a.src = AUDIO_BASE + encodeURIComponent(word) + '.mp3';
  if(btn){ speakBtn = btn; btn.classList.add('speaking'); }
  try{ a.currentTime = 0; }catch(e){}
  const pr = a.play();
  if(pr && pr.catch) pr.catch(fail);
}

/* ------------------------------------------------------------
   意象卡 CSS 按需注入（每个词一份，避免一次性塞 100KB）
   ------------------------------------------------------------ */
const artCssLoaded = new Set();
function ensureArtCss(word){
  if(artCssLoaded.has(word) || !ARTCSS[word]) return;
  artCssLoaded.add(word);
  const st = document.createElement('style');
  st.textContent = ARTCSS[word];
  document.head.appendChild(st);
}

/* ------------------------------------------------------------
   合成音效（WebAudio，无外部音频资源）
   静音状态单独存 wc_sound_v1，不动既有的几个数据键
   ------------------------------------------------------------ */
const SFX_KEY = 'wc_sound_v1';
let sfxCtx = null;
let sfxMaster = null;
const SFX_ON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
const SFX_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></svg>';

function sfxOn(){
  try{ return localStorage.getItem(SFX_KEY) !== '0'; }catch(e){ return true; }
}
function sfxCtxGet(){
  if(sfxCtx) return sfxCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    sfxCtx = new AC();
    sfxMaster = sfxCtx.createGain();
    sfxMaster.gain.value = .2; /* master gain 固定在 .25 以下 */
    sfxMaster.connect(sfxCtx.destination);
  }catch(e){ sfxCtx = null; sfxMaster = null; }
  return sfxCtx;
}
function sfxTone(freq, offset, dur, type, vol, freqEnd){
  if(!sfxCtx) return;
  const t = sfxCtx.currentTime + offset;
  const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  /* 带一点滑音：从 freq 滑到 freqEnd，刷词的「嗖」感就靠它 */
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(sfxMaster);
  o.start(t); o.stop(t + dur + .02);
}
/* 小铃铛：基音 + 两个泛音，比单纯正弦更有「叮」的质感 */
function sfxBell(freq, offset, dur, vol){
  sfxTone(freq, offset, dur, 'sine', vol);
  sfxTone(freq * 2, offset, dur * .55, 'sine', vol * .34);
  sfxTone(freq * 3, offset, dur * .3, 'sine', vol * .13);
}
function sfxNoise(offset, dur, filterType, freq, vol, freqEnd, q){
  if(!sfxCtx) return;
  const t = sfxCtx.currentTime + offset;
  const len = Math.max(1, Math.floor(sfxCtx.sampleRate * dur));
  const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = sfxCtx.createBufferSource();
  src.buffer = buf;
  const f = sfxCtx.createBiquadFilter();
  f.type = filterType;
  f.frequency.setValueAtTime(freq, t);
  if(freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur); /* 扫频：翻纸/滑走的风声 */
  if(q) f.Q.value = q;
  const g = sfxCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxMaster);
  src.start(t); src.stop(t + dur);
}
/* 轻振一下：和音效一起开关，安卓 Chrome 支持；不支持就静默跳过 */
function sfxHaptic(pattern){
  if(!sfxOn()) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
/* 连续「认识」的连击数：音高逐张升高，连击断了就回落 */
let sfxStreak = 0;
function sfxPlay(name){
  if(!sfxOn()) return;
  const ctx = sfxCtxGet();
  if(!ctx) return; /* 首次手势前 ctx 不会被创建 */
  if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
  if(name === 'rate2') sfxStreak++;
  else if(name === 'rate0' || name === 'skip') sfxStreak = 0;
  switch(name){
    case 'rate2': {
      /* 连击每多一张升高一个半音（最多 5 个），像珠子一颗颗落进碗里 */
      const k = Math.min(Math.max(sfxStreak - 1, 0), 5);
      const f = 523.25 * Math.pow(2, k / 12);
      sfxBell(f, 0, .34, .5);
      sfxNoise(0, .03, 'highpass', 2600, .18, 3200, .6);
      if(sfxStreak >= 3) sfxBell(f * 1.5, .08, .16, .16); /* 连击 3 张起加一颗小亮片 */
      sfxHaptic(12);
      break;
    }
    case 'rate1':
      /* 有点印象：一声短促的软音，尾巴微微下沉，像点头 */
      sfxTone(392, 0, .1, 'sine', .42, 356);
      sfxNoise(0, .04, 'lowpass', 900, .12);
      sfxHaptic(8);
      break;
    case 'rate0':
      /* 不认识：低沉但不惩罚，一声闷响带点风声落地 */
      sfxTone(196, 0, .11, 'triangle', .4, 168);
      sfxNoise(0, .09, 'lowpass', 420, .2, 240);
      sfxHaptic(22);
      break;
    case 'skip':
      /* 跳过：空气被划开的长「嗖」，不占评分音的记忆点 */
      sfxNoise(0, .17, 'highpass', 700, .28, 1500, .8);
      sfxTone(330, 0, .1, 'sine', .16, 294);
      sfxHaptic(6);
      break;
    case 'flip':
      /* 翻面：两段纸声——先掀起，再落下 */
      sfxNoise(0, .08, 'bandpass', 2200, .24, 900, 1.1);
      sfxNoise(.07, .1, 'lowpass', 1300, .2, 700, .8);
      sfxTone(170, .07, .07, 'sine', .1);
      sfxHaptic(6);
      break;
    case 'drop':
      /* 拼写落格：一粒小扣子落进格子的「哒」 */
      sfxNoise(0, .03, 'bandpass', 1700, .22, 2400, 2);
      sfxTone(880, 0, .025, 'square', .1);
      sfxHaptic(4);
      break;
    case 'ok':
      /* 拼写完成：三级小铃，一声比一声亮 */
      sfxBell(523.25, 0, .3, .42);
      sfxBell(659.25, .06, .3, .4);
      sfxBell(783.99, .12, .34, .4);
      sfxHaptic([10, 24, 12]);
      break;
    case 'bad':
      /* 拼错：两声轻闷的「嘟嘟」，音量压得很低 */
      sfxTone(190, 0, .08, 'square', .18, 176);
      sfxTone(150, .09, .1, 'square', .15, 140);
      sfxHaptic(18);
      break;
    case 'goal':
      /* 今日达标：四音上行 + 一把细碎亮片 */
      sfxBell(523.25, 0, .34, .42);
      sfxBell(659.25, .08, .34, .42);
      sfxBell(783.99, .16, .36, .4);
      sfxBell(1046.5, .24, .46, .46);
      sfxNoise(.1, .3, 'highpass', 2400, .16, 4200, 1.4);
      sfxHaptic([10, 30, 10, 30, 16]);
      break;
  }
}

/* 记录掌握度：写回 index.html 同一份 store */
function rateWord(word, level){
  const r = rec(word);
  r.opens = (r.opens || 0) + 1;
  r.lastOpened = Date.now();
  if(level === 2) r.pin = 2;
  else if(level === 1) r.pin = 1;
  else { r.pin = null; r.opens = 0; }
  r.mastery = masteryOf(word);
  persist(STORE_KEY, store);
  markRated(word);
  bumpToday(1);
  sfxPlay('rate' + level);
  /* 今日首次达标：进度线扫光一次 + 达成音，当天只触发一次 */
  if(todayCount() === GOAL){
    shineGoal();
    sfxPlay('goal');
  }
}

function shineGoal(){
  const fill = document.getElementById('goalFill');
  if(!fill) return;
  fill.classList.remove('shine');
  void fill.offsetWidth;
  fill.classList.add('shine');
  fill.addEventListener('animationend', () => fill.classList.remove('shine'), {once:true});
}

function tickPos(){
  const el = document.getElementById('deckPos');
  if(!el) return;
  el.classList.remove('tick');
  void el.offsetWidth;
  el.classList.add('tick');

/* ------------------------------------------------------------
   撤回：滑走一张后状态条出现「撤回」，把这张卡与今天的记录一起退回
   ------------------------------------------------------------ */
let undoSnap = null;

function setUndoVisible(v){
  const btn = document.getElementById('undoBtn');
  if(btn) btn.hidden = !v;
}

/* 在评分/跳过发生前拍快照，撤回时原样还原 */
function takeUndoSnap(word){
  undoSnap = {
    word: word,
    pos: pos,
    wordRec: store[word] ? Object.assign({}, store[word]) : null,
    days: Object.assign({}, mb.days || {}),
    total: mb.total || 0,
    rated: JSON.parse(JSON.stringify(mb.rated || {})),
    savedPos: mb.pos ? Object.assign({}, mb.pos) : null
  };
}

function undoLast(){
  if(!undoSnap || animating) return;
  const u = undoSnap;
  undoSnap = null;
  if(u.wordRec) store[u.word] = u.wordRec;
  else delete store[u.word];
  persist(STORE_KEY, store);
  mb.days = u.days;
  mb.total = u.total;
  mb.rated = u.rated;
  if(u.savedPos) mb.pos = u.savedPos;
  else delete mb.pos;
  persist(MB_KEY, mb);
  pos = u.pos;
  renderCard();
  tickPos();
  refreshHeader();
  setUndoVisible(false);
  toast('已撤回：' + u.word);
}

function advance(level, dir){
  if(animating) return;
  const w = queue[pos];
  if(!w) return;
  animating = true;
  takeUndoSnap(w.word);
  setUndoVisible(false);
  if(level === null) toast('已跳过');
  else {
    rateWord(w.word, level);
    toast(level === 2 ? '标记为已掌握' : level === 1 ? '标记为学习中' : '已回到未学，明天再来');
    refreshHeader();
    if(todayCount() === GOAL) setTimeout(() => toast('今日 10 个达成，收工！'), 700);
  }
  if(level === null) sfxPlay('skip'); /* 跳过单独音色，避免与评分音重复 */
  const card = document.querySelector('.swipe-card');
  if(card) card.classList.add('out-' + (dir || (level === null ? 'up' : 'right')));
  setTimeout(() => {
    pos += 1;
    animating = false;
    savePos();
    renderCard();
    tickPos();
    setUndoVisible(true);
  }, level === null ? 400 : 360);
}

      '<div class="lib-top"><div class="search-box">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>' +
        '<input id="libSearch" type="search" placeholder="搜单词或释义…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button class="clear" id="libClear" type="button" aria-label="清空" hidden>×</button>' +
      '</div></div>' +
      '<div class="lib-stage"><div class="lib-grid" id="libGrid"></div>' +
        '<div class="lib-detail" id="libDetail"></div></div>';

    const qEl = document.getElementById('libSearch');
    const clearBtn = document.getElementById('libClear');
    qEl.addEventListener('input', (e) => {
      clearBtn.hidden = !e.target.value;
      const v = e.target.value;
      clearTimeout(libTimer);
      libTimer = setTimeout(() => {
        if(libCurrent) hardCloseLib();
        renderLibGrid(v.trim().toLowerCase());
      }, 140);
    });
    clearBtn.addEventListener('click', () => {
      qEl.value = '';
      clearBtn.hidden = true;
      libFilter = '';
      if(libCurrent) hardCloseLib();
      renderLibGrid('');
      qEl.focus();
    });

    /* 下滑关闭详情层；列表已滚动时不拦 */
    const detail = document.getElementById('libDetail');
    let touchY = 0, touchBlocked = false;
    detail.addEventListener('touchstart', (e) => {
      if(!libCurrent) return;
      const scroller = detail.querySelector('.detail-scroll');
      touchBlocked = !!(scroller && scroller.scrollTop > 0);
      touchY = e.touches[0].clientY;
    }, {passive: true});
    detail.addEventListener('touchmove', (e) => {
      if(!libCurrent || touchBlocked) return;
      if(e.touches[0].clientY - touchY > 80){ closeLibLetter(); touchBlocked = true; }
    }, {passive: true});

    document.getElementById('libGrid').addEventListener('click', (e) => {
      const cell = e.target.closest('.cell');
      if(!cell) return;
      openLibLetter(cell.dataset.letter);
    });
  }
  if(libCurrent) hardCloseLib();
  renderLibGrid(libFilter);
}

/* 按首字母分组；q 非空时按单词/释义过滤 */
function libGroupsOf(q){
  const map = new Map();
  WORDS.forEach(w => {
    if(q && !(w.word.toLowerCase().includes(q) || (w.gloss || '').toLowerCase().includes(q))) return;
    const L = (w.word[0] || '#').toUpperCase();
    if(!map.has(L)) map.set(L, []);
    map.get(L).push(w);
  });
  map.forEach(list => list.sort((a, b) => a.word.localeCompare(b.word)));
  return map;
}

/* 方块颜色 = 该组掌握状态的聚合：全灰 / 琥珀 / 苔绿 */
function libGroupColor(list){
  const n = list.length;
  const m1 = list.filter(w => masteryOf(w.word) === 1).length;
  const m2 = list.filter(w => masteryOf(w.word) === 2).length;
  if(n > 0 && m2 === n) return '#6F8B74';
  if(m1 + m2 === 0) return '#8F9296';
  return '#BB9A5A';
}

/* 列数按字母数量自适应 */
function libBestCols(n){
  if(n <= 2) return Math.max(n, 1);
  if(n === 3) return 3;
  if(n === 4) return 2;
  if(n <= 6) return 3;
  if(n <= 8) return 4;
  return 5;
}

function libSorted(list){
  return list.slice().sort((a, b) =>
    masteryOf(a.word) - masteryOf(b.word) || a.word.localeCompare(b.word));
}

function renderLibGrid(q){
  libFilter = q || '';
  libGroups = libGroupsOf(libFilter);
  const used = Array.from(libGroups.keys()).sort();
  const total = used.reduce((n, L) => n + libGroups.get(L).length, 0);
  const cEl = document.getElementById('libStatCount');
  const lEl = document.getElementById('libStatLetters');
  if(cEl) cEl.textContent = total;
  if(lEl) lEl.textContent = used.length;

  const grid = document.getElementById('libGrid');
  if(!grid) return;
  if(!used.length){
    grid.innerHTML = '<div class="wempty">没有匹配的词，换个关键词试试</div>';
    return;
  }
  grid.style.setProperty('--cols', libBestCols(used.length));
  grid.innerHTML = used.map(L => {
    const list = libGroups.get(L);
    const hex = libGroupColor(list);
    const m0 = list.filter(w => masteryOf(w.word) === 0).length;
    const m1 = list.filter(w => masteryOf(w.word) === 1).length;
    const m2 = list.filter(w => masteryOf(w.word) === 2).length;
    const bars = [];
    if(m0) bars.push('<i class="p0" style="flex:' + m0 + '"></i>');
    if(m1) bars.push('<i class="p1" style="flex:' + m1 + '"></i>');
    if(m2) bars.push('<i class="p2" style="flex:' + m2 + '"></i>');
    return '<button class="cell" type="button" data-letter="' + esc(L) + '" style="--lc:' + hex + '">' +
      '<span class="cell-letter">' + esc(L) + '</span>' +
      '<span class="cell-count">' + list.length + ' 词</span>' +
      '<span class="cell-progress">' + bars.join('') + '</span>' +
    '</button>';
  }).join('');
}

function renderLibDetail(L, list, hex){
  const detail = document.getElementById('libDetail');
  const cards = libSorted(list).map(w => {
    const m = masteryOf(w.word);
    const n = reviewDone(w.word);
    return '<div class="w-card" data-word="' + esc(w.word) + '" style="--rc:' + rootOf(w).color + '">' +
      '<div class="w-word">' + esc(w.word) + '</div>' +
      (w.ipa ? '<div class="w-ipa">' + esc(w.ipa) + '</div>' : '') +
      '<div class="w-gloss">' + esc(w.gloss) + '</div>' +
      '<div class="w-meta">' +
        '<span class="w-mst m' + m + '">' + MST_LABEL[m] + '</span>' +
        '<span class="w-chk">' + (n ? '打卡 ' + n + '/4' : '') + '</span>' +
      '</div></div>';
  }).join('');

  detail.innerHTML =
    '<div class="detail-top">' +
      '<button class="back-btn" id="libBack" type="button" aria-label="返回字母">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>' +
      '</button>' +
      '<span class="detail-title">' + esc(L) + ' · ' + list.length + ' 个词</span>' +
      '<button class="bulk-btn" id="libBulk" type="button">刷这组</button>' +
    '</div>' +
    '<div class="badge" id="libBadge" style="background:color-mix(in srgb,' + hex + ' 62%,#FFFFFF);box-shadow:0 14px 30px -12px color-mix(in srgb,' + hex + ' 60%,transparent);">' + esc(L) + '</div>' +

  detail.querySelectorAll('.w-card').forEach(card => {
    card.addEventListener('click', () => {

    });

/* 飞行动画：从 fromRect 飞到 toRect；toStrong 指目标态（实心大徽章） */
function libFly(fromRect, toRect, L, hex, toStrong){
  const f = document.createElement('div');
  f.className = 'flyer';
  f.textContent = L;
  f.style.left = fromRect.left + 'px';
  f.style.top = fromRect.top + 'px';
  f.style.width = fromRect.width + 'px';
  f.style.height = fromRect.height + 'px';
  f.style.fontSize = Math.round(fromRect.width * .38) + 'px';
  f.style.background = 'color-mix(in srgb,' + hex + (toStrong ? ' 12%,#FFFFFF)' : ' 62%,#FFFFFF)');
  f.style.color = toStrong ? 'color-mix(in srgb,' + hex + ' 72%,#20242A)' : '#FFFFFF';
  f.style.borderRadius = toStrong ? '12px' : '16px';
  document.body.appendChild(f);

  const dx = toRect.left - fromRect.left, dy = toRect.top - fromRect.top;
  const sx = toRect.width / fromRect.width, sy = toRect.height / fromRect.height;
  requestAnimationFrame(() => {
    f.style.transition = 'transform .42s cubic-bezier(.34,1.15,.64,1),background .3s ease,color .3s ease,border-radius .3s ease';
    f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    f.style.background = 'color-mix(in srgb,' + hex + (toStrong ? ' 62%,#FFFFFF)' : ' 12%,#FFFFFF)');
    f.style.color = toStrong ? '#FFFFFF' : 'color-mix(in srgb,' + hex + ' 72%,#20242A)';
    f.style.borderRadius = toStrong ? '16px' : '12px';
  });
  return f;
}

function openLibLetter(L){
  if(libAnimating) return;
  const list = libGroups.get(L);
  if(!list || !list.length) return;
  const grid = document.getElementById('libGrid');
  const detail = document.getElementById('libDetail');
  const src = grid.querySelector('[data-letter="' + L + '"]');
  if(!src) return;
  libAnimating = true;
  libCurrent = L;
  const hex = libGroupColor(list);

  const fromRect = src.getBoundingClientRect();
  src.classList.add('hide');
  grid.classList.add('fade-out');

  renderLibDetail(L, list, hex);
  detail.classList.add('show');
  detail.style.opacity = '0';
  const badge = document.getElementById('libBadge');
  const toRect = badge.getBoundingClientRect();

  libFly(fromRect, toRect, L, hex, true);

  setTimeout(() => {
    document.querySelectorAll('.flyer').forEach(el => el.remove());
    badge.style.visibility = 'visible';
    detail.style.transition = 'opacity .18s ease';
    detail.style.opacity = '1';
    detail.querySelectorAll('.w-card').forEach((el, i) => {
      el.style.animationDelay = (i * 26) + 'ms';
      el.classList.add('in');
    });
    setTimeout(() => { libAnimating = false; }, 380);
  }, 430);
}

function closeLibLetter(){
  if(libAnimating || !libCurrent) return;
  const L = libCurrent;
  const list = libGroups.get(L);
  if(!list){ hardCloseLib(); return; }
  const grid = document.getElementById('libGrid');
  const detail = document.getElementById('libDetail');
  const badge = document.getElementById('libBadge');
  const src = grid.querySelector('[data-letter="' + L + '"]');
  if(!badge || !src){ hardCloseLib(); return; }

  libAnimating = true;
  const hex = libGroupColor(list);
  const fromRect = badge.getBoundingClientRect();
  src.classList.remove('hide');
  const toRect = src.getBoundingClientRect();
  badge.style.visibility = 'hidden';
  grid.classList.remove('fade-out');
  detail.style.transition = 'opacity .2s ease';
  detail.style.opacity = '0';

  libFly(fromRect, toRect, L, hex, false);
  setTimeout(hardCloseLib, 420);
}

function hardCloseLib(){
  document.querySelectorAll('.flyer').forEach(el => el.remove());
  const detail = document.getElementById('libDetail');
  if(detail){
    detail.classList.remove('show');
    detail.innerHTML = '';
    detail.style.opacity = '';
    detail.style.transition = '';
  }
  const grid = document.getElementById('libGrid');
  if(grid){
    grid.classList.remove('fade-out');
    grid.querySelectorAll('.cell.hide').forEach(el => el.classList.remove('hide'));
  }
  libCurrent = null;
  libAnimating = false;
}

/* 刷这组：临时替换刷词队列，不写全局进度存档 */
function queueLibLetter(L, list){
  if(!list || !list.length || animating) return;
  if(!deckScoped) deckBackup = {queue: queue, pos: pos, undoSnap: undoSnap};
  deckScoped = true;
  deckScopeLabel = L;
  queue = libSorted(list);
  pos = 0;
  undoSnap = null;
  hardCloseLib();
  renderDeckShell();
  switchTab('deck');
  toast('已切到 ' + L + ' 组 · ' + queue.length + ' 个词');
}

/* 退出分组：原样回到进入前那张 */
function exitDeckScope(){
  if(!deckScoped || animating) return;
  if(deckBackup){
    queue = deckBackup.queue;
    pos = deckBackup.pos;
    undoSnap = deckBackup.undoSnap;
  } else {
    /* 兜底：没有备份时按今天的存档重建 */
    queue = buildQueue(false);
    pos = restorePos(queue);
    undoSnap = null;
  }
  deckBackup = null;
  deckScoped = false;
  deckScopeLabel = '';
  renderDeckShell();
  toast('已回到全部单词');
}

/* 再刷一遍这组：位置归零，词序不变 */
function replayDeckScope(){
  if(!deckScoped || animating) return;
  pos = 0;
  undoSnap = null;
  renderDeckShell();
  toast('再刷一遍 ' + deckScopeLabel + ' 组');
}

/* ============================================================
   自测：从 q 字段抽 10 题，判题规则与 index.html 完全一致
   ============================================================ */
let quizBuilt = false;
const quiz = {list:[], idx:0, right:0, wrong:0, answered:false};

function quizStat(){
  return Object.assign({rounds:0, total:0, right:0}, loadJSON(QUIZ_KEY, {}));
}
function quizNorm(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function quizPool(){
  const out = [];
  WORDS.forEach(w => {
    (w.q || []).forEach(item => {
      if(item && item.q && item.a) out.push({word:w.word, q:item.q, a:item.a, h:item.h || ''});
    });
  });
  return out;
}
function startQuiz(){
  quiz.list = shuffle(quizPool()).slice(0, 10);
  quiz.idx = 0; quiz.right = 0; quiz.wrong = 0; quiz.answered = false;
  renderQuizQuestion();
}

function renderQuiz(){
  const view = document.getElementById('view-quiz');
  if(!quizBuilt){
    quizBuilt = true;
    view.innerHTML = '<div class="quiz-wrap">' +
        '<div class="quiz-head"><span id="quizProg">首字母填空</span><span>✓ <b id="quizRight">0</b>　✗ <b id="quizWrong">0</b></span></div>' +
        '<div id="quizBody"></div></div>';
  }
  if(!quiz.list.length) startQuiz();
}

function renderQuizQuestion(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  if(quiz.idx >= quiz.list.length){ renderQuizResult(); return; }
  const item = quiz.list[quiz.idx];
  quiz.answered = false;
  const prog = document.getElementById('quizProg');
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(prog) prog.textContent = '第 ' + (quiz.idx + 1) + ' / ' + quiz.list.length + ' 题';
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">首字母填空 · ' + item.word + '</span>' +
      '<p class="q-sentence">' + item.q + '</p>' +
      '<input class="q-input" id="qInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="补全空格处的字母…" aria-label="补全空格">' +
      (item.h ? '<button class="q-btn ghost" type="button" data-hint style="margin-top:.5rem;font-size:.68rem;padding:.3rem .7rem;">看提示</button>' +
                '<p class="q-hint" id="qHint" hidden>' + item.h + '</p>' : '') +
      '<div class="q-foot"><span class="q-feed" id="qFeed"></span>' +
        '<button class="q-btn" type="button" id="qSubmit">检查</button></div>' +
    '</div>';
  const input = document.getElementById('qInput');
  if(input){
    /* 触屏设备不自动聚焦，避免切到自测就弹键盘；桌面键盘/鼠标环境才自动聚焦 */
    if(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches) input.focus();
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); quiz.answered ? quizNext() : quizCheck(); }
    });
  }
}

function quizCheck(){
  if(quiz.answered) return;
  const input = document.getElementById('qInput');
  const item = quiz.list[quiz.idx];
  if(!input || !item) return;
  const val = quizNorm(input.value);
  if(!val){ input.focus(); return; }
  quiz.answered = true;

  const first = (item.q.match(/class="first-letter">([^<]*)</) || ['', ''])[1];
  const ok = val === quizNorm(item.a)
          || val === quizNorm(item.word)
          || val === quizNorm(first + item.a);
  if(ok) quiz.right++; else quiz.wrong++;

  const blank = document.querySelector('#quizBody .qz-blank');
  if(blank){ blank.textContent = item.a; blank.classList.add('on'); }
  input.disabled = true;

  const hint = document.getElementById('qHint');
  if(hint) hint.hidden = false;

  const fb = document.getElementById('qFeed');
  if(fb){
    fb.className = 'q-feed ' + (ok ? 'right' : 'wrong');
    fb.textContent = ok ? '✓ 正确' : '✗ 正确答案：' + item.a;
  }
  const rightEl = document.getElementById('quizRight');
  const wrongEl = document.getElementById('quizWrong');
  if(rightEl) rightEl.textContent = quiz.right;
  if(wrongEl) wrongEl.textContent = quiz.wrong;

  const btn = document.getElementById('qSubmit');
  btn.textContent = quiz.idx + 1 >= quiz.list.length ? '看结果' : '下一题';
  btn.classList.add('ghost');
  btn.focus();
}

function quizNext(){
  quiz.idx++;
  if(quiz.idx >= quiz.list.length) renderQuizResult();
  else renderQuizQuestion();
}

function renderQuizResult(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  const total = quiz.right + quiz.wrong;
  const rate = total ? Math.round(quiz.right / total * 100) : 0;
  const stat = quizStat();
  stat.rounds += 1; stat.total += total; stat.right += quiz.right;
  persist(QUIZ_KEY, stat);
  const hist = stat.total ? Math.round(stat.right / stat.total * 100) : 0;
  const prog = document.getElementById('quizProg');
  if(prog) prog.textContent = '本轮完成';
  body.innerHTML = '<div class="quiz-card">' +
      '<span class="q-kicker">本轮完成</span>' +
      '<p class="q-result-num">' + quiz.right + ' / ' + total + '</p>' +
      '<p class="q-result-sub">正确率 ' + rate + '% · 累计 ' + stat.right + ' / ' + stat.total +
        '（' + hist + '%，共 ' + stat.rounds + ' 轮）</p>' +
      '<div class="q-actions"><button class="q-btn ghost" type="button" data-quiz-back>回刷词</button>' +
        '<button class="q-btn" type="button" data-quiz-again>再来一轮</button></div>' +
    '</div>';
}
