<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随身刷词">
<title>随身刷词 · 手机版</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/lib.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/stat.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="stylesheet" href="css/chrome.css">
</head>
<body>
<div class="blobs" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
</div>

<div class="app">
  <header class="hero">
    <div class="hero-bar">
      <span class="hk">今日 <b id="todayNum">0</b><i>/10</i></span>
      <span class="hero-tip" id="goalTip">刷一张就热身</span>
    </div>
    <i class="hero-fill" id="goalFill"></i>
  </header>

  <main class="main">
    <section class="view deck active" id="view-deck" aria-label="刷词"></section>
    <section class="view" id="view-lib" aria-label="词库"></section>
    <section class="view" id="view-quiz" aria-label="自测"></section>
    <section class="view" id="view-exam" aria-label="期末题库"></section>
    <section class="view" id="view-stat" aria-label="数据"></section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <button class="tab active" type="button" data-tab="deck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M18 8.5l3 1.6v9.4l-3-1.6"/></svg>
      <span>刷词</span>
    </button>
    <button class="tab" type="button" data-tab="lib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.8"/><rect x="14" y="4" width="6" height="6" rx="1.8"/><rect x="4" y="14" width="6" height="6" rx="1.8"/><rect x="14" y="14" width="6" height="6" rx="1.8" fill="currentColor" stroke="none"/></svg>
      <span>词库</span>
    </button>
    <button class="tab" type="button" data-tab="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5l4.5 4.5-8 8H7v-4.5z"/><path d="M4 20h16"/></svg>
      <span>自测</span>
    </button>
    <button class="tab" type="button" data-tab="exam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12.5h6M9 16.5h4"/></svg>
      <span>期末</span>
    </button>
    <button class="tab" type="button" data-tab="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19h-20"/></svg>
      <span>数据</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="../words-data.js"></script>
<!-- 脚本按依赖顺序加载：数据层 → 各 tab 页 → 导航与启动 -->
<script src="js/core.js"></script>
<script src="js/deck.js"></script>
<script src="js/lib.js"></script>
<script src="js/quiz.js"></script>
<script src="js/exam.js"></script>
<script src="js/stat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
